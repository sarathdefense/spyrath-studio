s are often only intelligible according to the conceptual associations observed in Aztec ceremonial culture. Which statement about the difrasismo in cuauhtli in ocelotl is most strongly supported by the text?", "choices": {"A": "Its metaphorical significance derives from the semantic equivalence of the two nouns constituting the difrasismo.", "B": "Its unintelligibility may cause its formal function within a line of verse to go unnoticed by present-day readers.", "C": "Its apparent obscurity can be resolved when considered in the proper cultural context.", "D": "Its frequency in Classical Nahuatl poetry confirms its intelligibility to the Aztec audience."}, "correct": "C", "rationale": "Choice C is the best answer because it presents a statement about the difrasismo in cuauhtli in ocelotl that is directly supported by the text. The\ntext begins by describing difrasismo, a device used in Classical Nahuatl poetry. The text then mentions the device’s two functions: a formal one\n(giving structure to lines of verse) and a ritualistic one. The text indicates that the relation between the words in a difrasismo may appear\ntenuous without the additional information supplied by Aztec ceremonial culture but that the meaning becomes intelligible in the context of that\ninformation. Therefore, the difrasismo’s apparent obscurity can be resolved when considered in the proper cultural context.\nChoice A is incorrect because the text doesn’t indicate that the two nouns used in a difrasismo are semantically equivalent; instead, the text\nindicates that the two nouns used in a difrasismo make up a single metaphor whose meaning is often intelligible only in the context of\ninformation supplied by Aztec ceremonial culture. Choice B is incorrect because the text doesn’t indicate that there’s a relationship between the\nformal function of the difrasismo and the difrasismo’s intelligibility. Additionally, the text suggests that present-day readers who are familiar with\nAztec ceremonial culture wouldn’t find the difrasismo to be unintelligible. Choice D is incorrect because the text doesn’t indicate that the\nfrequency of difrasismo’s use in Classical Nahuatl is a necessary feature of intelligibility: the text indicates that an infrequently used difrasismo\nwould presumably also be intelligible to members of an Aztec audience who are sufficiently familiar with Aztec ceremonial culture."}, {"id": "d95a0bb8", "skill": "Inferences", "difficulty": "Hard", "question": "The ratio of methane to other atmospheric constituents—represented by a measure called the methane mole fraction—influences a variety of meteorological phenomena, notably precipitation and humidity. For Titan, Saturn’s largest moon, the observational data that exist are too sparse and discrepant to fully constrain the range of the methane mole fraction at various atmospheric levels. Juan Lora and colleagues point out that outputs of the IPSL atmospheric model of Titan, which track closely to observations in some respects, reflect how the model’s developers responded to this challenge: by prescribing a uniform methane mole fraction for the lowest level of the atmosphere. It is therefore important to note that _____ Which choice most logically completes the text?", "choices": {"A": "some disagreements between the model’s simulations of Titan’s precipitation and humidity and the moon’s actual precipitation and humidity are to be expected.", "B": "further observations of Titan may clarify the moon’s methane mole fraction sufficiently for the model to employ a single value rather than a range.", "C": "even though the model’s outputs sometimes agree with observational data, Titan’s real methane mole fraction is likely higher than the methane mole fraction used in the model.", "D": "inconsistencies across the model’s simulations of Titan’s precipitation and humidity could be attributable to variations in the moon’s methane mole fraction."}, "correct": "A", "rationale": "Choice A is the best answer because it most logically completes the text’s discussion of modeling the atmosphere of Titan. The text establishes\nthat the methane mole fraction (the ratio of methane to other atmospheric components) influences precipitation, humidity, and other\nmeteorological phenomena and that observational data for Titan are too lacking (“too sparse and discrepant”) to fully determine the range of this\nmeasure across the moon’s various atmospheric levels. The text indicates that because of this limitation, researchers developed an atmospheric\nmodel (IPSL) that uses a simplified approach: it applies a uniform methane mole fraction for the lowest atmospheric level. Since it is very\nunlikely that the actual methane distribution across atmospheric levels on Titan is uniform, and since the methane mole fraction directly affects\nprecipitation and humidity, it logically follows that the model’s simplified treatment of the methane mole fraction would lead to some\ndisagreements between the model’s simulations and Titan’s actual precipitation and humidity.\nChoice B is incorrect because the text makes it clear that the model already uses a single value for Titan’s methane mole fraction instead of a\nrange. Further, the text suggests that the single value is a simplification of what is likely a more complex reality, so there’s no reason to assume\nthat a single value would be more desirable than a range. Choice C is incorrect. The text strongly suggests that Titan’s actual methane mole\nfraction differs from the uniform value used in the model, even though some of the model’s outputs align closely with observations, but nothing\nin the text indicates how the actual value would differ. There’s no reason to assume that the actual methane mole fraction is higher than what the\nmodel uses. The “lowest level” mentioned in the text refers to the atmosphere and not Titan’s methane mole fraction. Choice D is incorrect\nbecause the text makes it clear that the model doesn’t reflect the actual variations in the methane mole fraction across Titan’s atmospheric\nlevels, since observational data are too limited. Because the model uniformly applies a set methane mole fraction, no inconsistencies in the\nsimulations would be attributable to actual variations in the moon’s methane mole fraction."}, {"id": "d0f51067", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "Modern dog breeds are largely the result of 160 years of owners crossbreeding certain dogs in order to select for particular physical appearances. Owners often say that some breeds are also more likely than others to have particular personality traits—basset hounds are affectionate; boxers are easy to train—but Kathleen Morrill and colleagues found through a combination of owner surveys and DNA sequencing of 2,000 dogs that while physical traits are predictably heritable among purebred dogs, behavior varies widely among dogs of the same breed. Which choice best states the main idea of the text?", "choices": {"A": "Dog breeds would not exist without many years of human intervention in dogs’ reproduction.", "B": "Research fails to confirm a commonly held belief about dog breeds and behavior.", "C": "The dog breeds most popular among owners have often changed over the past 160 years.", "D": "A study of dog breeds is notable for its usage of both opinion surveys and DNA sequencing."}, "correct": "B", "rationale": "Choice B is the best answer because it most accurately states the main idea of the text. The text indicates that dog owners typically claim that\nsome dog breeds are “more likely than others to have particular personality traits.” In other words, the text points out that a commonly held belief\nabout dog breeds is that their personality traits are heritable. The text then states that Kathleen Morrill and colleagues undertook research about\ndog trait heritability and found that “behavior varies widely among dogs of the same breed.” Because Morrill and colleagues found evidence for\nvariability rather than consistency in the behavior of dogs of the same breed, the statement that research fails to uphold a commonly held belief\nabout dog breeds and behavior accurately reflects the main idea of the text.\nChoice A is incorrect. Although the text mentions that humans have long intervened in dogs’ reproduction by intentionally crossbreeding certain\ndogs, it doesn’t argue that such intervention is essential to the existence of dog breeds. Choice C is incorrect because the text doesn’t discuss\nthe popularity of any dog breeds; breeds are mentioned as having certain traits, but the text says nothing about the popularity of these breeds or\ntraits. Choice D is incorrect. Although the text briefly mentions that Morrill and colleagues conducted a study about dog traits using both surveys\nand DNA sequencing, this is not the main focus of the text. The text concerns the study’s results about the heritability of dog traits, not the\nparticular methodology used by Morrill and colleagues."}, {"id": "aaddd60f", "skill": "Inferences", "difficulty": "Hard", "question": "Scientists studying Mars long thought the history of its crust was relatively simple. One reason for this is that geologic and climate data collected by a spacecraft showed that the crust was largely composed of basalt, likely as a result of intense volcanic activity that brought about a magma ocean, which then cooled to form the planet’s surface. A study led by Valerie Payré focused on additional information—further analysis of data collected by the spacecraft and infrared wavelengths detected from Mars’s surface—that revealed the presence of surprisingly high concentrations of silica in certain regions on Mars. Since a planetary surface that formed in a mostly basaltic environment would be unlikely to contain large amounts of silica, Payré concluded that _____ Which choice most logically completes the text?", "choices": {"A": "the information about silica concentrations collected by the spacecraft is likely more reliable than the silica information gleaned from infrared wavelengths detected from Mars’s surface.", "B": "high silica concentrations on Mars likely formed from a different process than that which formed the crusts of other planets.", "C": "having a clearer understanding of the composition of Mars’s crust and the processes by which it formed will provide more insight into how Earth’s crust formed.", "D": "Mars’s crust likely formed as a result of other major geological events in addition to the cooling of a magma ocean."}, "correct": "D", "rationale": "Choice D is the best answer. Cooling magma would create basalt, but “a planetary surface that formed in a mostly basaltic environment would be\nunlikely to contain large amounts of silica.” Since Mars’s crust does contain large amounts of silica, it is unlikely that Mars’s crust was formed\nexclusively by cooling magma. Therefore, there were likely other major geological events that created the high silica concentrations.\nChoice A is incorrect. Although the passage discusses these two methods of collecting data about Mars’s crust, it never compares their\nreliability, so there’s no basis for this inference. Choice B is incorrect. The passage never mentions anything about the crusts of other planets, so\nthere’s no basis for this inference. Choice C is incorrect. The passage never mentions Earth’s crust, so there’s no basis for this inference."}, {"id": "1c69ff20", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "For many years, the only existing fossil evidence of mixopterid eurypterids—an extinct family of large aquatic arthropods known as sea scorpions and related to modern arachnids and horseshoe crabs—came from four species living on the paleocontinent of Laurussia. In a discovery that expands our understanding of the geographical distribution of mixopterids, paleontologist Bo Wang and others have identified fossilized remains of a new mixopterid species, Terropterus xiushanensis, that lived over 400 million years ago on the paleocontinent of Gondwana. According to the text, why was Wang and his team’s discovery of the Terropterus xiushanensis fossil significant?", "choices": {"A": "The fossil constitutes the first evidence found by scientists that mixopterids lived more than 400 million years ago.", "B": "The fossil helps establish that mixopterids are more closely related to modern arachnids and horseshoe crabs than previously thought.", "C": "The fossil helps establish a more accurate timeline of the evolution of mixopterids on the paleocontinents of Laurussia and Gondwana.", "D": "The fossil constitutes the first evidence found by scientists that mixopterids existed outside the paleocontinent of Laurussia."}, "correct": "D", "rationale": "Choice D is the best answer because it states why Wang and his team’s discovery of the Terropterus xiushanensis fossil was significant. The text\nexplains that up until Wang and his team’s discovery, the only fossil evidence of mixopterids came from the paleocontinent of Laurussia. Wang\nand his team, however, identified fossil remains of a mixopterid species from the paleocontinent Gondwana. Therefore, the team’s discovery was\nsignificant because the fossil remains of a mixopterid species were outside of the paleocontinent Laurussia.\nChoice A is incorrect. Although the text states that Wang and his team identified fossilized remains of a mixopterid species that lived more than\n400 million years ago, it doesn’t indicate that mixopterid fossils previously found by scientists dated to a more recent period than that. Choice B\nis incorrect. Although the text states that mixopterids are related to modern arachnids and horseshoe crabs, it doesn’t suggest that the fossil\ndiscovered by Wang and his team confirmed that this relationship is closer than scientists had previously thought. Choice C is incorrect because\nthe team’s fossil established the presence of mixopterids on Gondwana, not on Laurussia. Moreover, the text only discusses the fossil in relation\nto the geographical distribution of mixopterids, not in relation to their evolution."}, {"id": "39e440e4", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Archaeologists have held that the Casarabe culture, which emerged in the southwestern Amazon basin in the first millennium CE, was characterized by a sparse, widely distributed population and little intervention in the surrounding wilderness. Recently, however, archaeologist Heiko Prümers and colleagues conducted a study of the region using remote-sensing technology that enabled them to create three-dimensional images of the jungle-covered landscape from above, and the researchers concluded that the Casarabe people developed a form of urbanism in the Amazon basin. Which finding about the remote-sensing images, if true, would most directly support Prümers and colleagues’ conclusion?", "choices": {"A": "They show shapes consistent with widely separated settlements of roughly equal small size surrounded by uncultivated jungle.", "B": "They show shapes consistent with long-distance footpaths running from Casarabe territories to large cities outside the region inhabited by the Casarabe people.", "C": "They show shapes consistent with scattered small farms created by clearing jungle areas near sources of fresh water.", "D": "They show shapes consistent with monumental platforms and dense central settlements linked to smaller settlements by a system of canals and roadways."}, "correct": "D", "rationale": "Choice D is the best answer. This finding, if true, would support the archaeologists’ conclusion. Dense central settlements linked to smaller ones\nwould provide evidence of cities and suburbs—in other words, “a form of urbanism.”\nChoice A is incorrect. This finding, if true, would weaken the archaeologists’ conclusion. Widely separated, small settlements with jungle in\nbetween would support the long-held belief that the Casarabe culture “was characterized by a sparse, widely distributed population and little\nintervention in the surrounding wilderness.” Choice B is incorrect. This choice wouldn’t support the researchers’ conclusion. These large cities\nare located outside Casarabe territory, which doesn’t show evidence of Casarabe urbanism. Choice C is incorrect. This finding wouldn’t support\nthe archaeologists’ conclusion. Scattered small farms in jungle clearings are not good evidence to support the existence of cities (“a form of\nurbanism”)."}, {"id": "5f16d809", "skill": "Inferences", "difficulty": "Hard", "question": "In classical Greek and Roman mythology, female characters are typically cast as either villains lacking in psychological depth or passive victims who are marginal to these stories, which usually focus on the exploits of male characters. Recently, a subgenre has emerged in which writers reimagine these stories from the perspectives of their female characters, giving them agency and complex motivations. Purists argue that such efforts represent a distinctively modern tendency to impose our own values on past civilizations, obscuring those civilizations’ beliefs. Defenders of the subgenre counter that reimaginings of the myths for new cultural contexts are almost as old as the myths themselves, suggesting that _____ Which choice most logically completes the text?", "choices": {"A": "bringing female perspectives to the forefront is not indicative of a novel attitude regarding fidelity to Greek and Roman myths’ ideologies.", "B": "modern writers’ foregrounding of female characters is chiefly motivated by a desire to counterbalance the primacy of male perspectives among earlier adaptations of Greek and Roman myths.", "C": "purists are overlooking a long tradition of adapting Greek and Roman myths to focus on female characters.", "D": "the complex motivations given to female characters in modern retellings of Greek and Roman myths reflect a recent shift toward psychological depth in fictional representation."}, "correct": "A", "rationale": "Choice A is the best answer because it most logically completes the text’s discussion of a literary subgenre that reimagines Greek and Roman\nmyths in a more modern cultural context—namely, the greater visibility and psychological depth of female characters. According to the text,\npurists object that this subgenre imposes modern values on past civilizations, while the subgenre’s defenders argue that reimagining old myths\nfor new cultural contexts is “almost as old as the myths themselves.” If this argument in defense of the subgenre is accurate, then bringing\nfemale perspectives to the forefront of myth is reflective of a long-established attitude regarding writers’ freedom to recontextualize the\nideologies of Greek and Roman myths instead of remaining absolutely faithful to them.\nChoice B is incorrect because the text suggests that modern writers who foreground female characters in their adaptations of Greek and Roman\nmyths are motivated by a desire to counterbalance the primacy of male perspectives in the myths themselves, not in earlier adaptations of those\nmyths. The text doesn’t indicate that the modern writers are responding to earlier adaptations and only discusses those adaptations in the\ncontext of the argument that recontextualizing Greek and Roman myths is a very old practice. Choice C is incorrect because the defenders’ claim\nconcerns the general practice of reimagining myths for new cultural contexts, not specifically a tradition of focusing on female characters. The\ntext doesn’t indicate that earlier reimaginings centered on female characters, so it wouldn’t be logical to conclude that purists are overlooking a\nlong tradition of adapting myths to focus on female characters specifically. Choice D is incorrect. While the text supports the claim that the\nmodern retellings of Greek and Roman myths have given complex motivations to the female characters, it doesn’t associate this development\nwith a trend toward the portrayal of greater psychological depth in fiction more broadly or claim that such a trend exists. Moreover, the claim that\nthere is an association wouldn’t follow logically from the last sentence of the text, which asserts that reimagining myths in new cultural contexts\nis an established practice."}, {"id": "3f4ab688", "skill": "Command of Evidence", "difficulty": "Hard", "question": "In a research paper, a student criticizes some historians of modern African politics, claiming that they have evaluated Patrice Lumumba, the first prime minister of what is now the Democratic Republic of the Congo, primarily as a symbol rather than in terms of his actions. Which quotation from a work by a historian would best illustrate the student’s claim?", "choices": {"A": "“Lumumba is a difficult figure to evaluate due to the starkly conflicting opinions he inspired during his life and continues to inspire today.”", "B": "“The available information makes it clear that Lumumba’s political beliefs and values were largely consistent throughout his career.”", "C": "“Lumumba’s practical accomplishments can be passed over quickly; it is mainly as the personification of Congolese independence that he warrants scholarly attention.”", "D": "“Many questions remain about Lumumba’s ultimate vision for an independent Congo; without new evidence coming to light, these questions are likely to remain unanswered.”"}, "correct": "C", "rationale": "Choice C is the best answer because it illustrates the student’s claim about some historians viewing Lumumba primarily as a symbol. This\nquotation argues that Lumumba “warrants” (or deserves) “scholarly attention” as a symbol and not for his “practical accomplishments”—that is,\nhis actions as prime minister—which “can be passed over quickly,” or dismissed as being of comparatively little importance. Thus, the quotation\nexpresses the view that the student criticizes some historians for holding.\nChoice A is incorrect. Although this quotation touches on the difficulty of evaluating Lumumba’s legacy, it doesn’t address how historians of\nmodern African politics view him as a symbol. Choice B is incorrect. While this quotation mentions Lumumba’s political beliefs, it doesn’t discuss\nhistorians viewing him as a symbol. Choice D is incorrect. This quotation touches on Lumumba’s vision for his country, but it doesn’t discuss\nhistorians viewing him as a symbol."}, {"id": "08395130", "skill": "Inferences", "difficulty": "Hard", "question": "The Hubble Space Telescope (HST) is projected to maintain operation until at least 2030, but it has already revolutionized high-resolution imaging of solar-system bodies in visible and ultraviolet (UV) light wavelengths, notwithstanding that only about 6% of the bodies imaged by the HST are within the solar system. NASA researcher Cindy L. Young and colleagues assert that a new space telescope dedicated exclusively to solar-system observations would permit an extensive survey of minor solar-system bodies and long-term UV observation to discern how solar- system bodies change over time. Young and colleagues’ recommendation therefore implies that the HST _____ Which choice most logically completes the text?", "choices": {"A": "will likely continue to be used primarily to observe objects outside the solar system.", "B": "will no longer be used to observe solar system objects if the telescope recommended by Young and colleagues is deployed.", "C": "can be modified to observe the features of solar system objects that are of interest to Young and colleagues.", "D": "lacks the sensors to observe the wavelengths of light needed to discern how solar system bodies change over time."}, "correct": "A", "rationale": "Choice A is the best answer. The HST will operate until at least 2030, but it’s only observing stuff inside our solar system 6% of the time. If we\ncould get a different telescope to observe stuff inside our solar system 100% of the time and take more extensive images of certain things, then\nthe HST could continue to be used mainly for observing stuff outside the solar system.\nChoice B is incorrect. This inference is too strong to be supported by the text. Even if the new telescope is deployed, the HST might still be used\nas it’s being used now. Based on the text, the new telescope would just be used for more extensive and long-term imaging of solar system\nbodies, which doesn’t necessarily overlap with the HST. Choice C is incorrect. This inference isn’t supported. The text never mentions the\npossibility of modifying the HST, so there is no basis to make this inference. Rather, the researchers suggest using a different telescope to more\nclosely observe certain objects. Choice D is incorrect. This inference is too strong to be supported. The text doesn’t give us enough info to\nassume that the HST lacks any particular sensors."}, {"id": "26f5c4ba", "skill": "Inferences", "difficulty": "Hard", "question": "In 2022, Crystal Reeck and colleagues studied whether the decision-making modes that guide consumers influence their choice between nonenvironmentally friendly standard electricity plans and environmentally friendly green plans that cap electricity usage. Study participants who self-reported using either an Affect Mode or Role Mode—which prioritize choices that have a stronger positive emotional or social impact, respectively—were more likely to select a green plan. Conversely, participants using a Calculation Mode—which aims to minimize both financial cost and personal inconvenience—were more likely to select a standard plan, even when the green option was cheaper. This finding suggests that participants using a Calculation Mode _____ Which choice most logically completes the text?", "choices": {"A": "were equally unlikely to factor the financial savings of the green plan into their decision-making as were participants using either the Affect or Role Modes.", "B": "may have been less strongly motivated to appear socially responsible with their choice of plan than they realized.", "C": "may have determined that the green plan imposed additional burdens on them that were not sufficiently offset by the potential financial savings.", "D": "were less likely to believe that the green plan was truly cost-effective than were participants using either the Affect or Role Modes."}, "correct": "C", "rationale": "Choice C is the best answer because it most logically completes the text’s discussion of the influence of decision-making modes on consumers’\nchoices of different electricity plans. The Affect Mode describes choices based on the decision-maker’s preferred emotional outcome, the Role\nMode describes choices based on the decision-maker’s social motivations, and the Calculation Mode describes choices based on minimizing\nfinancial costs and maximizing the decision-maker’s convenience. Thus, if those using a Calculation Mode disfavor the green plan, it would be\ndue to some financial or convenience burden the green plan imposes that the other doesn’t. The text indicates that the green plan had a lower\nfinancial cost but was nonetheless rejected by participants using the Calculation Mode. It therefore follows that the green plan likely imposed a\nconvenience burden that outweighed potential financial savings for these participants.\nChoice A is incorrect. According to the text, the Affect Mode involves the decision-maker’s preferred emotional outcome, the Role Mode involves\nsocial motivations, and the Calculation Mode is oriented toward minimizing financial costs and maximizing the decision-maker’s convenience.\nThus, unlike the Affect or Role Modes, the Calculation Mode would almost certainly involve taking price differences into account. Choice B is\nincorrect. According to the text, the Affect Mode involves the decision-maker’s preferred emotional outcome, the Role Mode involves social\nmotivations, and the Calculation Mode is oriented toward minimizing financial costs and maximizing the decision-maker’s convenience. Thus,\nthere is no reason to think that participants using the Calculation Mode at any point took social responsibility into account, let alone think that\nthey discovered a disparity between their expectations and reality. Choice D is incorrect. According to the text, the Affect Mode involves the\ndecision-maker’s preferred emotional outcome, the Role Mode involves social motivations, and the Calculation Mode is oriented toward\nminimizing financial costs and maximizing the decision-maker’s convenience. Thus, the text doesn’t indicate that cost-effectiveness is a factor\nfor participants using the Affect or Role Modes, and there is no basis to compare their beliefs in the truthfulness of the green-plan description\nwith those of the Calculation Mode users."}, {"id": "cef77aa7", "skill": "Inferences", "difficulty": "Hard", "question": "Geoglyphs are large-scale designs of lines or shapes created in a natural landscape. The Nazca Lines were created in the Nazca Desert in Peru by several Indigenous civilizations over a period of many centuries. Peruvian archaeologist Johny Isla specializes in these geoglyphs. At a German exhibit about the Nazca Lines, he saw an old photograph of a large geoglyph of a whalelike figure and was surprised that he didn’t recognize it. Isla returned to Peru and used a drone to search a wide area, looking for the figure from the air. This approach suggests that Isla thought that if he hadn’t already seen it, the whalelike geoglyph _____ Which choice most logically completes the text?", "choices": {"A": "must represent a species of whale that went extinct before there were any people in Peru.", "B": "is actually located in Germany, not Peru, and isn’t part of the Nazca Lines at all.", "C": "is probably in a location Isla hadn’t ever come across while on the ground.", "D": "was almost certainly created a long time after the other Nazca Lines geoglyphs were created."}, "correct": "C", "rationale": "Choice C is the best answer because it most logically completes the text’s discussion of Johny Isla and the whalelike geoglyph. The text\nindicates that the German exhibit about the Nazca Lines included a photograph showing a whalelike geoglyph that Isla hadn’t known about\nbefore attending the exhibit, even though Isla “specializes in” Nazca Lines geoglyphs. Given his expertise, and his surprise at being unfamiliar\nwith the whale glyph, the text strongly suggests that Isla believed he would have noticed the glyph if he had been to its location. Thus, the text\nimplies that the whalelike geoglyph is likely in a location Isla had not previously been to.\nChoice A is incorrect because the text doesn’t address either the species of whale that the geoglyph is meant to represent or its relationship to\nthe earliest humans in the area that is now Peru. Choice B is incorrect. Although the text indicates that the photograph of the whalelike geoglyph\nwas on display at a “German exhibit,” that exhibit was specifically “about the Nazca Lines,” which the text indicates are located in Peru. Choice D\nis incorrect. Although the text does indicate that the glyphs were created “over a period of many centuries,” the text doesn’t address when in that\nperiod of time any particular glyphs were created."}, {"id": "9c591ff7", "skill": "Inferences", "difficulty": "Hard", "question": "Some Astyanax mexicanus, a river-dwelling fish found in northeast Mexico, have colonized caves in the region. Although there is little genetic difference between river and cave A. mexicanus and all members of the species can emit the same sounds, biologist Carole Hyacinthe and colleagues found that the context and significance of those sounds vary by location—e.g., the click that river-dwelling A. mexicanus use to signal aggression is used by cave dwellers when foraging—and the acoustic properties of cave fish sounds show some cave-specific variations as well. Hyacinthe and colleagues note that differences in sonic communication could accumulate to the point of inhibiting interbreeding among fish from different locations, suggesting that _____ Which choice most logically completes the text?", "choices": {"A": "although A. mexicanus living in rivers are genetically similar to those living in caves, river fish rely on sonic communication less than cave fish do.", "B": "although A. mexicanus is a single species at present, it could be in the process of splitting into distinct populations with different characteristics.", "C": "although all A. mexicanus emit sounds, the fish living in rivers produce some sounds that the fish living in caves do not, and vice versa.", "D": "although A. mexicanus from different locations can interbreed currently, river fish and cave fish are sufficiently genetically distinct that they can be considered separate species."}, "correct": "B", "rationale": "Choice B is the best answer because it presents the conclusion that most logically follows from the text’s discussion of A. mexicanus. According\nto the text, A. mexicanus, a river-dwelling fish species, has colonized caves. The fish that live in rivers and those that live in caves show no\nsignificant genetic differences and are all capable of making the same sounds. The text indicates, however, that Hyacinthe and colleagues found\nthat sounds that the river fish use in a particular context and for a particular purpose are used in a different context and for a different purpose\nby the cave fish. Additionally, the sounds made by cave fish show some differences depending on the specific cave the fish inhabit. The text\ngoes on to state that Hyacinthe and colleagues have noted that differences in how the fish use sound to communicate could eventually become\nso great that they prevent fish from different locations from interbreeding. In other words, the river fish might eventually only breed with other\nriver fish (with whom they share characteristics regarding sonic communication that they do not share with cave fish), while the cave fish might\nonly breed with other cave fish for a similar reason. In context, this observation suggests that even though the fish are a single species right now,\nthey could be in the process of splitting into distinct populations with different characteristics.\nChoice A is incorrect because there is no information in the text suggesting that the river fish are less reliant on sonic communication than the\ncave fish are. Although the text does indicate that the river fish and cave fish are genetically similar, the text describes both groups as using\nsonic communication and says nothing to indicate that one group depends on that communication more than the other group does. Choice C is\nincorrect. The text states that all members of the species can emit the same sounds but that the function and context of sounds differ\ndepending on whether the fish live in rivers or caves, but it does not indicate that river fish produce sounds that cave fish do not or vice\nversa. Choice D is incorrect because it contradicts the text. The text says that there is little genetic difference between the river fish and the cave\nfish, not that the river fish and cave fish are so genetically distinct that they can be considered separate species."}, {"id": "5d122d45", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Psychologists Dacher Keltner and Jonathan Haidt have argued that experiencing awe—a sensation of reverence and wonder typically brought on by perceiving something grand or powerful—can enable us to feel more connected to others and thereby inspire us to act more altruistically. Keltner, along with Paul K. Piff, Pia Dietze, and colleagues, claims to have found evidence for this effect in a recent study where participants were asked to either gaze up at exceptionally tall trees in a nearby grove (reported to be a universally awe-inspiring experience) or stare at the exterior of a nearby, nondescript building. After one minute, an experimenter deliberately spilled a box of pens nearby. Which finding from the researchers’ study, if true, would most strongly support their claim?", "choices": {"A": "Participants who had been looking at the trees helped the experimenter pick up significantly more pens than did participants who had been looking at the building.", "B": "Participants who helped the experimenter pick up the pens used a greater number of positive words to describe the trees and the building in a postexperiment survey than did participants who did not help the experimenter.", "C": "Participants who did not help the experimenter pick up the pens were significantly more likely to report having experienced a feeling of awe, regardless of whether they looked at the building or the trees.", "D": "Participants who had been looking at the building were significantly more likely to notice that the experimenter had dropped the pens than were participants who had been looking at the trees."}, "correct": "A", "rationale": "Choice A is the best answer because it presents a finding that, if true, would most strongly support the researchers’ claim that they found\nevidence that experiencing awe can make people feel more connected to others and thus more likely to behave altruistically (with beneficial and\nunselfish concern for others). According to the text, the researchers tested for this effect by first having participants look at either something\nknown to be awe-inspiring (very tall trees) or something ordinary (a plain building) and then purposely spilling pens near the participants. The\nfinding that participants who had looked at the trees helped pick up significantly more pens than did participants who had looked at the building\nwould support the researchers’ claim by demonstrating that the people who had experienced awe behaved more altruistically when the\nexperimenter needed help than the other participants did.\nChoice B is incorrect because a finding about helpful participants using positive words to describe the trees and the building after the\nexperiment was over wouldn’t have any bearing on the researchers’ claim that experiencing awe increases altruistic behavior. The text doesn’t\naddress the use of positive words to describe things or suggest any connection between using such words and having experienced awe, so that\nbehavior wouldn’t serve as evidence that experiencing awe played a role in promoting helpful behavior. Choice C is incorrect because a finding\nthat participants who didn’t help the experimenter were significantly more likely than others to report having experienced awe whether they had\nlooked at the building or the trees would weaken the researchers’ claim that experiencing awe increases altruistic behavior by suggesting that\nthe opposite might be true—that experiencing awe is in fact linked to choosing not to act in a way that benefits someone else. Choice D is\nincorrect because a finding about participants noticing that the experimenter had dropped the pens wouldn’t have any bearing on the\nresearchers’ claim about people behaving altruistically. Being aware of a challenge or problem isn’t necessarily beneficial on its own and isn’t the\nsame as offering help, so the finding wouldn’t support the idea that experiencing awe increases altruistic behavior."}, {"id": "fd1095d7", "skill": "Inferences", "difficulty": "Hard", "question": "To address the susceptibility of materials used in components of high-performance machinery, such as aircraft engines, to creep (deformation that is induced by persistent mechanical stress and that often occurs at elevated temperatures), materials researchers have developed silicon carbide (SiC) fibers for producing aerospace composites. Testing the thermomechanical properties of several commercially available SiC fibers, Ramakrishna T. Bhatt et al. found that in comparison with two polymer-derived SiC fibers, a nitrogen-treated SiC fiber exhibited a lower minimum creep rate, a measure of the rate at which a stress-exposed material deforms at a constant temperature and uniaxial load. The finding suggests that _____ Which choice most logically completes the text?", "choices": {"A": "unlike the two polymer-derived SiC fibers, the nitrogen-treated SiC fiber can substantially inhibit creep, provided that temperatures and loads are consistent.", "B": "the two polymer-derived SiC fibers likely hold similar potential for reducing the creep resistance of materials exposed to stress and elevated temperatures, thus prolonging the life span of aerospace machinery.", "C": "composites based on the two polymer-derived SiC fibers have chemical properties that may improve the mechanical and thermal stability of aerospace equipment to a greater extent than do composites based on the nitrogen-treated SiC fiber.", "D": "aerospace composites containing the nitrogen-treated SiC fiber may have the ability to withstand mechanical stress for a longer period of time than can aerospace composites containing either of the two polymer-derived SiC fibers."}, "correct": "D", "rationale": "Choice D is the best answer because it most logically completes the text’s discussion of silicon carbide (SiC) fibers and creep, or deformation\nrelated to ongoing mechanical stress and elevated temperatures. The text states that Bhatt et al. found that a nitrogen-treated SiC fiber had a\nlower minimum creep rate than two polymer-derived SiC fibers did. Because having a lower creep rate means that the material is slower to\ndeform with exposure to stress, as the text explains, this finding suggests that aerospace composites made with the nitrogen-treated SiC fiber\nmay be able to withstand mechanical stress for a longer period than those made with the other two polymer-derived SiC fibers can.\nChoice A is incorrect because it overstates the implications of the study’s findings, which have to do with the rate of a material’s deformation\nunder stress, not the absolute degree of deformation. The text states that Bhatt et al. observed that a nitrogen-treated SiC fiber had a lower\nminimum creep rate than two polymer-derived SiC fibers did, meaning only that it deformed more slowly over time under constant stress, not\nthat it underwent less deformation overall. Choice B is incorrect because the text doesn’t establish any similarity between the two polymer-\nderived SiC fibers other than that both had a higher creep rate than the nitrogen-treated SiC fiber did in Bhatt et al.’s study. Moreover, reducing a\nmaterial’s resistance to creep would mean that the material becomes more susceptible to deformation with exposure to stress and elevated\ntemperatures, which would be expected to shorten rather than prolong the lifespan of machinery made with that material. Choice C is incorrect\nbecause the text suggests that the stability of aerospace equipment may be better improved by composites containing nitrogen-treated SiC fiber\nthan by composites containing the two polymer-derived SiC fibers, not the other way around. The text indicates that Bhatt et al. observed that the\nnitrogen-treated SiC fiber had a lower minimum creep rate than the other two fibers did, meaning that it was slower to degrade under exposure to\nmechanical stress and elevated temperatures—suggesting that it may remain stable for longer periods."}, {"id": "156ff681", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Many governments that regularly transfer money to individuals—to provide supplemental incomes for senior citizens, for example—have long done so electronically, but other countries typically have distributed physical money and have only recently developed electronic transfer infrastructure. Researchers studied the introduction of an electronic transfer system in one such location and found that recipients of electronic transfers consumed a different array of foods than recipients of physical transfers of the same amount did. One potential explanation for this result is that individuals conceive of and allocate funds in physical money differently than they conceive of and allocate funds in electronic form. Which finding from the study, if true, would most directly weaken the potential explanation?", "choices": {"A": "Recipients of electronic transfers typically spent their funds at a slower rate than recipients of physical transfers did.", "B": "Nearly every recipient of an electronic transfer withdrew the entire amount in physical money shortly after receiving the transfer.", "C": "Recipients of physical transfers tended to purchase food about as frequently as recipients of electronic transfers did.", "D": "Some recipients of physical transfers received small amounts of money relatively frequently, while others received large amounts relatively infrequently."}, "correct": "B", "rationale": "Choice B is the best answer. This would weaken the explanation. If the recipients of electronic money immediately withdrew it all as physical\nmoney, then both kinds of recipients ended up spending physical money on food. So there must be some other explanation why those who\ninitially received electronic money ate different kinds of food.\nChoice A is incorrect. This wouldn’t weaken the explanation. If anything, it actually supports it: it demonstrates that recipients of electronic\nmoney and recipients of physical money have different spending habits. Choice C is incorrect. This wouldn’t weaken the explanation. The\nexplanation we’re testing this choice against is about the way that people might “conceive of and allocate” physical and electronic funds\ndifferently. This choice only focuses on the timing, not what they spend the money on. Choice D is incorrect. This would have no impact on the\nexplanation. It doesn’t tell us anything about possible differences between the spending habits of those who spend physical money and those\nwho spend money electronically."}, {"id": "8545ccfe", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Icebergs generally appear to be mostly white or blue, depending on how the ice reflects sunlight. Ice with air bubbles trapped in it looks white because much of the light reflects off the bubbles. Ice without air bubbles usually looks blue because the light travels deep into the ice and only a little of it is reflected. However, some icebergs in the sea around Antarctica appear to be green. One team of scientists hypothesized that this phenomenon is the result of yellow-tinted dissolved organic carbon in Antarctic waters mixing with blue ice to produce the color green. Which finding, if true, would most directly weaken the team’s hypothesis?", "choices": {"A": "White ice doesn’t change color when mixed with dissolved organic carbon due to the air bubbles in the ice.", "B": "Dissolved organic carbon has a stronger yellow color in Antarctic waters than it does in other places.", "C": "Blue icebergs and green icebergs are rarely found near each other.", "D": "Blue icebergs and green icebergs contain similarly small traces of dissolved organic carbon."}, "correct": "D", "rationale": "Choice D is the best answer because it presents a finding that, if true, would weaken the scientists’ hypothesis about icebergs that appear to be\ngreen. The text indicates that most icebergs are either mostly white or blue in color but that some icebergs in Antarctica appear to be green. The\ntext goes on to say that the scientists hypothesized that this green color occurs when yellow-tinted dissolved organic carbon in ocean waters\nmixes with blue ice. A finding that both blue icebergs and green icebergs contain similarly small traces of dissolved organic carbon would\nsuggest that something other than yellow-tinted organic carbon causes some icebergs’ green color, since the blue icebergs that contain yellow-\ntinted organic carbon remained blue instead of turning green.\nChoice A is incorrect because, according to the text, the scientists’ hypothesis was that blue icebergs, not white ones, change color when their\nice mixes with yellow-tinted dissolved organic carbon. A finding that white ice, because of its air bubbles, doesn’t change color when it’s mixed\nwith dissolved organic carbon would therefore have no bearing on the scientists’ hypothesis. Choice B is incorrect because the text focuses only\non Antarctic icebergs that appear to be green. It doesn’t indicate that icebergs in locations other than Antarctica have been found to have a green\nhue. A finding that dissolved organic carbon has a stronger yellow color in Antarctic waters than in other places would therefore have no bearing\non the scientists’ hypothesis that green color in icebergs in Antarctica is caused by yellow-tinted dissolved organic carbon mixing with blue ice.\nChoice C is incorrect because, according to the text, the scientists’ hypothesis was that blue icebergs turn green when their ice mixes with\nyellow-tinted dissolved organic carbon in the sea around them. If that’s correct, one would expect blue icebergs and green icebergs to be located\nat a distance from each other since all blue icebergs in an area where the waters contain yellow-tinted dissolved organic carbon would take on a\ngreen hue. A finding that blue icebergs and green icebergs are rarely found near each other would therefore strengthen, not weaken, the\nresearchers’ hypothesis."}, {"id": "e946a32e", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Boldly mixing elements of poetry, fiction, drama, philosophy, and manifesto, Puerto Rican writer Giannina Braschi creates cross-genre literature that explores themes such as immigration and independence. Her works have inspired responses from individuals across different fields and in a wide range of formats, from musical compositions and a comic book to architecture and furniture design. In an essay, a student asserts that the production of these diverse creations by others is reflective of Braschi’s own approach to crafting literature. Which quotation from a scholarly review of Braschi’s work best supports the student’s claim?", "choices": {"A": "“Braschi is the focus of a 2020 collection of essays in which fifteen scholars from seven different countries delved into the linguistic and structural patterns of her writings.”", "B": "“Braschi’s eagerness to push boundaries and blend genres within literature invites us to consider how other art forms might also engage with literature.”", "C": "“Before settling in New York City, where she would go on to become a college professor, Braschi studied both literature and philosophy in several cities around the world.”", "D": "“In addition to her creative literary works, Braschi has produced academic pieces analyzing writings by Miguel de Cervantes, Federico García Lorca, and other authors.”"}, "correct": "B", "rationale": "Choice B is the best answer because it presents the quotation that best supports the student’s claim about Braschi. By describing how Braschi’s\nblending of genres invites her audience to think about how other art forms could also engage with literature, the quotation supports the idea that\nthe diversity of responses to Braschi’s work reflects Braschi’s own approach to creating literature.\nChoice A is incorrect because the quotation describes scholars from different countries writing essays about Braschi’s use of language in her\nwritings; it doesn’t address how Braschi’s creation of cross-genre literature inspires diverse types of responses, which is the claim the student\nmakes. Choice C is incorrect because the quotation focuses on the fact that Braschi studied in several different cities, which doesn’t address the\nstudent’s claim that Braschi’s creation of cross-genre literature inspires diverse types of responses. Choice D is incorrect because the quotation\nlists some of the authors who Braschi has written academic works about, which is irrelevant to the student’s claim that Braschi’s creation of\ncross-genre literature inspires diverse types of responses."}, {"id": "d696eafa", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Early Earth is thought to have been characterized by a stagnant lid tectonic regime, in which the upper lithosphere (the outer rocky layer) was essentially immobile and there was no interaction between the lithosphere and the underlying mantle. Researchers investigated the timing of the transition from a stagnant lid regime to a tectonic plate regime, in which the lithosphere is fractured into dynamic plates that in turn allow lithospheric and mantle material to mix. Examining chemical data from lithospheric and mantle-derived rocks ranging from 285 million to 3.8 billion years old, the researchers dated the transition to 3.2 billion years ago. Which finding, if true, would most directly support the researchers’ conclusion?", "choices": {"A": "Among rocks known to be older than 3.2 billion years, significantly more are mantle derived than lithospheric, but the opposite is true for the rocks younger than 3.2 billion years.", "B": "Mantle-derived rocks older than 3.2 billion years show significantly more compositional diversity than lithospheric rocks older than 3.2 billion years do.", "C": "There is a positive correlation between the age of lithospheric rocks and their chemical similarity to mantle-derived rocks, and that correlation increases significantly in strength at around 3.2 billion years old.", "D": "Mantle-derived rocks younger than 3.2 billion years contain some material that is not found in older mantle-derived rocks but is found in older and contemporaneous lithospheric rocks."}, "correct": "D", "rationale": "Choice D is the best answer because it presents a finding that, if true, would most directly support the researchers’ conclusion that the transition\nfrom a stagnant lid regime to a tectonic plate regime occurred around 3.2 billion years ago. The text explains that early in Earth’s history, Earth\nexhibited a stagnant lid regime in which there’s no interaction between the lithosphere and the underlying mantle. The text further explains that,\nby contrast, once Earth began to exhibit a tectonic plate regime, its lithospheric and mantle material began to mix. If mantle-derived rocks\nyounger than 3.2 billion years contain material not found in older mantle-derived rocks, that material must have originated somewhere other than\nthe mantle. And if this material is found in both older and contemporaneous lithospheric rocks, that would imply that the lithosphere was able to\nmix with mantle material beginning around 3.2 billion years ago, as the researchers concluded.\nChoice A is incorrect. The text gives no basis for comparing the quantities of lithospheric and mantle-derived rocks. Choice B is incorrect. The\ntext gives no basis for comparing the material makeup of lithospheric rocks to that of mantle-derived rocks. Choice C is incorrect. A positive\ncorrelation between the age of lithospheric rocks and these rocks’ chemical similarity to mantle-derived rocks would mean that the oldest rocks\nwould be the most similar, which contradicts the text’s claim that lithospheric and mantle-derived rocks were completely separate until 3.2 billion\nyears ago. If the researchers’ conclusion about the onset of tectonics on Earth is correct, then younger lithospheric rocks would show greater\nchemical similarity to mantle-derived rocks than older lithospheric rocks do."}, {"id": "36e2868f", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "The following text is from Thomas Mann’s 1924 novel The Magic Mountain, translated by John E. Woods in 1995. The story of Hans Castorp that we intend to tell here—not for his sake (for the reader will come to know him as a perfectly ordinary, if engaging young man), but for the sake of the story itself, which seems to us to be very much worth telling (although in Hans Castorp’s favor it should be noted that it is his story, and that not every story happens to everybody)—is a story that took place long ago, and is, so to speak, covered with the patina of history and must necessarily be told with verbs whose tense is that of the deepest past. ©1995 by Alfred A. Knopf, Inc. What does the text most strongly suggest about the story of Hans Castorp?", "choices": {"A": "Though it is true that stories of even the most uninteresting people are themselves interesting because all people are unique, the reason this story is interesting is nonetheless difficult to understand because of the passage of time.", "B": "Even though it is a story of a person of no particular importance, its age and the manner in which it therefore must be told are both indicators that the story itself is important.", "C": "Like all stories about the lives of inconsequential people, this story must necessarily be related in a particular way if the reason the story is consequential is to be made evident to the audience.", "D": "It is a remarkable story that happened to an unremarkable person, though one could plausibly argue that because the story is valuable, some of its value accrues to the person at its center."}, "correct": "D", "rationale": "Choice D is the best answer because it presents a statement about Hans Castorp’s story that is suggested by the text. The narrator of the text\nindicates that the story about Hans Castorp will be told not because there is something particularly notable about him, since he is pleasant but\n\"perfectly ordinary,\" but because the story itself is remarkable (\"very much worth telling\"). The narrator then notes that there is a benefit in being\nat the heart of the story—that it is \"in Hans Castorp’s favor\" that the story is his, and maybe uniquely so (\"not every story happens to everybody\").\nThus, the text suggests both that the story that will be told is a remarkable one that happened to an unremarkable person and that it is\nreasonable to argue that the person at the center of a valuable story takes on some of the story’s value.\nChoice A is incorrect. Although the narrator of the text makes the point that \"not every story happens to everybody,\" the narrator doesn’t state that\nstories are interesting simply because the people they are about are unique. Rather, the narrator suggests that one particular story is \"very much\nworth telling\" on its own and that Hans Castorp benefits from the fact that the story is remarkable and may be unique to him. Further, the narrator\nnever suggests that the story will be hard to understand even though it is old. Choice B is incorrect. Although the narrator of the text suggests\nthat Hans Castorp is of no particular importance, since he is a \"perfectly ordinary\" person, the narrator never reveals what makes the story of\nCastorp important, just that \"the story itself\" is \"very much worth telling.\" The narrator states that the story \"took place long ago,\" is \"covered with\nthe patina of history,\" and can be told only \"with verbs whose tense is that of the deepest past,\" but the story’s age and the way it must be told\naren’t presented as reasons the story is important; the narrator is simply providing details about how the story will be told. Choice C is incorrect\nbecause the narrator of the text doesn’t suggest that all stories about people who are \"perfectly ordinary\" (like Hans Castorp) must be told in\nparticular ways to make it clear why those stories are consequential. Further, the narrator suggests that Hans Castorp’s story must be told \"with\n\nverbs whose tense is that of the deepest past\" because it took place so long ago, not because telling it that way will convey the story’s\nimportance."}, {"id": "dc87adf4", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Barchester Towers is an 1857 novel by Anthony Trollope. In the novel, Trollope’s portrayal of Dr. Proudie underscores the character’s exaggerated sense of his own abilities: _____ Which quotation from Barchester Towers most effectively illustrates the claim?", "choices": {"A": "“It must not…be taken as proved that Dr. Proudie was a man of great mental powers, or even of much capacity for business, for such qualities had not been required in him.”", "B": "“[Dr. Proudie] was comparatively young, and had, as he fondly flattered himself, been selected as possessing such gifts, natural and acquired, as must be sure to recommend him to a yet higher notice.”", "C": "“[Dr. Proudie’s] residence in the metropolis, rendered necessary by duties thus entrusted to him, his high connexions, and the peculiar talents and nature of the man, recommended him to persons in power.”", "D": "“[Dr. Proudie] was certainly possessed of sufficient tact to answer the purpose for which he was required without making himself troublesome.”"}, "correct": "B", "rationale": "Choice B is the best answer. In this quotation, Dr. Proudie is described as \"fondly flatter[ing] himself\" that he has gifts that \"must be sure to\nrecommend him to a yet higher notice.\" In other words, he expects his skills to push him to greater fame and success. This implies an\nexaggerated sense of his own abilities, which matches the claim we’re trying to support.\nChoice A is incorrect. This quotation doesn’t describe Proudie’s view of himself, nor does it paint him in an especially flattering light. Instead, by\nsaying his mental powers and business skill are not \"proved,\" it implies that he is actually dim-witted and bad at business. Choice C is incorrect.\nThis choice describes Proudie’s closeness to power and importance, but it doesn’t show what Proudie thinks of himself. Proudie is not\ndescribing himself or his abilities here. The narrator is. Choice D is incorrect. While this quotation offers Proudie very mild praise, it doesn’t show\nwhat Proudie thinks of himself or his own abilities, which is what the claim focuses on."}, {"id": "4b8eda0a", "skill": "Inferences", "difficulty": "Hard", "question": "For its 1974 work Instant Mural, the Chicano art collective Asco taped members Patssi Valdez and Humberto Sandoval to an outdoor wall in East Los Angeles. The work is manifestly a commentary on constraint, but many critics focus on Valdez and the social constraints women faced at the time, which is understandable but leaves the presence of Valdez’s male collaborator Sandoval unexplained. We should instead consider that in 1974, the art establishment’s recognition of Chicano artists was (and had long been) restricted to sociohistorical muralists, leaving nonmuralist Chicano artists—like Asco’s members—struggling to even exhibit their work; attending to this context opens an interpretation that accounts for all the evidence, allowing us to conclude that _____ Which choice most logically completes the text?", "choices": {"A": "while Valdez’s presence in Instant Mural represents the social constraints placed on women at the time, Sandoval’s presence represents Chicano muralists’ frustration at their lack of recognition by the art establishment.", "B": "the main subject of Instant Mural is female Chicano artists’ experience of being doubly constrained by gender-role expectations and the marginalization of certain types of art.", "C": "Instant Mural is a reflection on the constraining aesthetic expectations placed on Chicano artists in general rather than on the social constraints placed on women specifically.", "D": "Instant Mural is best understood not as a critique of the social constraints placed on women but rather as a critique of sociohistorical muralists’ depictions of Chicano culture."}, "correct": "C", "rationale": "Choice C is the best answer because it most logically completes the text’s discussion of Instant Mural. According to the text, the 1974 work\nInstant Mural involved taping two Asco members (Patssi Valdez and Humberto Sandoval) to an outdoor wall as a direct commentary on\nconstraint (limitation or restriction). The text suggests that instead of focusing on Valdez’s role in the work and on social limitations women\nfaced at the time—an approach that fails to explain the role of Sandoval, a man—people should consider that in 1974 (and long before) the art\nestablishment limited recognition of Chicano artists to those who created murals with social and historical subjects, making it challenging for\nnonmuralist Chicano artists (such as Asco’s members) to show their work. The text suggests that considering the situation with the art\nestablishment leads to a conclusion that accounts for the fact that Instant Mural is explicitly about constraint and features both a woman and a\nman taped to the wall: Instant Mural isn’t a reflection of the social constraints placed on women specifically but instead is a reflection on the\nconstraining aesthetic expectations placed on Chicano artists in general (that is, the limits resulting from the lack of recognition of Chicano\nartists of any gender who did not create sociohistorical murals).\nChoice A is incorrect. The text indicates that the art establishment in 1974 (and earlier) did recognize Chicano muralists to the exclusion of other\nChicano artists, so there’s no reason to assume Asco’s work Instant Mural was intended to represent Chicano muralists’ frustration; it’s far more\nlikely that Asco’s members—described as Chicano nonmuralists—were representing their own frustration at being unrecognized by the art\nestablishment. Choice B is incorrect. The text emphasizes that while a common approach to Instant Mural focuses on Valdez and the social\nlimitations women faced in 1974 but fails to account for the presence of a man in the work, there is a conclusion that explains Sandoval’s role.\nBut concluding that Instant Mural represents a double constraint experienced specifically by female Chicano artists would still fail to account for\nthe inclusion of a man in the work. Choice D is incorrect. Although the text suggests that Instant Mural can be understood as something other\nthan a commentary on social constraints women faced in 1974, it doesn’t suggest that the work is best understood as a critique of the content\nof any other artworks. The text doesn’t address how Chicano culture is depicted in sociohistorical murals; it discusses such murals only to make\n\nthe point that in 1974 (and earlier) the art establishment recognized Chicano artists who produced them to the exclusion of Chicano\nnonmuralists, indicating a constraint all of Asco’s members faced, regardless of gender."}, {"id": "3bfcb73b", "skill": "Command of Evidence", "difficulty": "Hard", "question": "An archaeological team led by Piotr Bieliński and Sultan al-Bakri found remnants of a 4,000-year-old Bronze Age board game at a site in Oman. Little is left of the game except a stone board, which is carved with a grid and has places to hold game pieces. Some scholars claim that the game was largely played by traders. Which finding, if true, would most directly support the scholars’ claim?", "choices": {"A": "Other examples of the game dating to the same period have been found in the remains of several homes in the region, including in one home that may have belonged to a trader.", "B": "Similar games have been found in other sites dating to the same period that were connected to the site in Oman via trade routes.", "C": "The other known examples of the game dating to the same period have been found along routes that seem to have been used primarily by traders at the time.", "D": "Remnants of other goods have been found at the site in Oman that probably also reached the location through trade."}, "correct": "C", "rationale": "Choice C is the best answer because it presents a finding that, if true, would most directly support the scholars’ claim about the board game. The\ntext explains that the remains of a 4,000-year-old board game were found in Oman. The text then states that scholars claim this board game was\nplayed mostly by traders. If the other known examples of this board game from the same time period were discovered along routes that seem to\nhave been used primarily by traders, this finding would directly support the scholars’ claim because it suggests that the game was largely played\nby traders who brought it with them for entertainment as they traveled.\nChoice A is incorrect because this finding would suggest only that a single trader may have possessed examples of the board game, perhaps for\nthe purpose of trading or selling the game to residents of Oman. For this reason, the finding wouldn’t directly support the scholars’ claim that the\nmajority of the game’s players were traders. Choice B is incorrect because this finding doesn’t mention the board game at all, referring only to\nsimilar games found at other sites, and would therefore provide no direct support for the scholars’ claim about the board game. Choice D is\nincorrect because this finding doesn’t mention the board game at all, referring only to the remains of other goods found at the site in Oman, and\nwould therefore provide no direct support for the scholars’ claim about the board game."}, {"id": "55688b3c", "skill": "Inferences", "difficulty": "Hard", "question": "Dutch painters in the sixteenth and seventeenth centuries often showed tables filled with large wheels of cheese or carved shards of butter. Some art historians, noting that dairy products were a major component of the Dutch diet, interpret these depictions as reflections of everyday Dutch eating habits. However, a group of researchers recently reviewed hundreds of food-related paintings and found that lemons—which could only be acquired in the Netherlands at great cost, since they had to be imported from warmer climates—feature in Dutch paintings of the period more than three times as frequently as dairy products do, thereby casting doubt on the idea that _____ Which choice most logically completes the text?", "choices": {"A": "dairy products were a more significant component of the Dutch diet of the period than lemons were.", "B": "food was a more popular subject among Dutch painters than it was among painters from other countries at the time.", "C": "depictions of food in Dutch paintings of the period should be taken as realistic representations of Dutch eating habits.", "D": "Dutch painters of the period may have depicted foods for symbolic reasons rather than to show what Dutch people typically ate."}, "correct": "C", "rationale": "Choice C is the best answer. The text tells us that lemons—an expensive imported product—feature in Dutch paintings of the period more\nfrequently than dairy products do. Since it’s unlikely lemons were eaten more often than dairy, this fact casts doubt on the theory that these\npaintings realistically depicted Dutch diets.\nChoice A is incorrect. In fact, the text suggests the opposite: it says that dairy products were a \"major component of the Dutch diet,\" while lemons\nwere an expensive import item, so we can infer that lemons were eaten much more rarely than dairy products. Choice B is incorrect. The passage\ndoesn’t mention painters from other countries, so there’s no basis to make this inference. Choice D is incorrect. In fact, the text suggests that\nDutch painters do have reasons for depicting foods other than to show what Dutch people typically ate. For example, lemons in a painting could\nindicate wealth or prosperity."}, {"id": "1bf2173e", "skill": "Inferences", "difficulty": "Hard", "question": "In a three-year study of parasitic infections by Anomotaenia brevis tapeworms in Temnothorax nylanderi ants, entomologist Susanne Foitzik and colleagues found something unexpected: rather than reducing its host’s fitness, as is typical of parasites, A. brevis greatly extends the lifespan of a T. nylanderi worker ant and seems to halt the effects of aging. Furthermore, those infected receive special treatment, ceasing their share of labor to sustain the colony and remaining in the nest as uninfected workers feed, groom, and transport them. By contrast, the researchers observed that uninfected workers in parasitized colonies have shortened lifespans, most likely because the _____ Which choice most logically completes the text?", "choices": {"A": "uninfected workers are at high risk for direct exposure to A. brevis in the course of providing social care to the infected workers in the nest.", "B": "need to compensate for reduced contributions within the colony while also caring for infected workers is burdensome to the uninfected workers.", "C": "high level of activity maintained by the uninfected workers makes them better able than infected workers to quickly disperse when the nest is attacked by a predator.", "D": "average lifespan of T. nylanderi worker ants in colonies without parasitic activity typically falls well below three years, the range covered by the study."}, "correct": "B", "rationale": "Choice B is the best answer. The text describes a study examining the relationship between a species of parasitic tapeworm, A. brevis, and its\nhost insect, the T. nylanderi ant. According to the text, researchers were surprised to find that the tapeworm extends the life of its ant host, rather\nthan reducing it. The text goes on to state that the infected ants end up doing less work to sustain the colony and that as a result, the uninfected\nants take on the infected ants’ share of labor in addition to caring for them in their infected state. The study’s researchers also observed that the\nuninfected ants have shorter lifespans than expected. If the infected ants, who are doing less work in the colony, have longer lifespans, it can be\ninferred that the less an ant works, the longer it will live. The opposite of this statement can also be inferred: the more an ant works, the shorter\nits life. So, since the workload within the colony is being redistributed so that the infected ants work less while the uninfected ants work more (as\nthey take on the neglected duties of the infected ants and also care for those ants), then it can be inferred that the lifespans of the uninfected\nants are shortened because the need to compensate for reduced contributions within the colony while also caring for infected workers is\nburdensome to the uninfected workers.\nChoice A is incorrect because the text does not indicate how A. brevis is transmitted to the ants or assert that uninfected ants are more likely to\nbe directly exposed to A. brevis while caring for infected ants. Choice C is incorrect because the text makes no mention of the relative abilities of\ninfected and uninfected ants to escape predators: in fact, predators are not mentioned in the text at all. Choice D is incorrect because the text\ndoes not supply any information about the average lifespans of the ants in colonies without parasitic activity; the text only indicates factors that\nlengthen and shorten the lifespans of ants in parasitized colonies."}, {"id": "7bdf094b", "skill": "Inferences", "difficulty": "Hard", "question": "Sir Gawain and the Green Knight is a circa 1400 poem written in Middle English—an archaic form of the English spoken today. Over the last several centuries, the English language has undergone such transformations in vocabulary, spelling, and grammar that most readers now rely on translations to read Sir Gawain. In the introduction to his 2007 translation, Simon Armitage remarks that the sonic patterns of the poem, which was written in alliterative verse (a verse form featuring extensive repetition of initial consonant sounds), are essential to its structure. Because many Modern English words begin with different sounds than their Middle English equivalents do, a strictly literal translation of Sir Gawain would therefore likely _____ Which choice most logically completes the text?", "choices": {"A": "preserve much of the original text’s meaning at the expense of other qualities that are also integral to the experience of reading the poem.", "B": "appeal more to modern readers than would translations like Armitage’s that instead prioritize the original text’s sonic and structural qualities.", "C": "be more faithful to the original intentions of the poem than most strictly literal translations of alliterative Middle English poems are to their originals.", "D": "be preferable to modern readers who are primarily interested in learning what the poem reveals about historical conditions during the time it was originally written."}, "correct": "A", "rationale": "Choice A is the best answer because it most logically completes the text’s discussion of translating Sir Gawain and the Green Knight. The text\nstates that the poem was written in alliterative verse, a form that features extensive repetition of initial consonant sounds, and that, according to\nArmitage, the patterns of sound in the poem are essential to the poem’s structure. The text also notes that many Modern English words begin\nwith different sounds than their Middle English equivalents (that is, the words with the same meanings) do. This means that if a translator were\nto render the poem’s Middle English words into their direct Modern English equivalents, the initial consonant sounds of many words would\nchange and the original alliterative patterns wouldn’t hold. It follows, then, that a strictly literal (word for word) translation would preserve much\nof the original text’s meaning at the expense of sonic and structural qualities that are also integral to the experience of reading the poem.\nChoice B is incorrect because the text doesn’t address modern readers’ preferences among translation approaches. Although the text implies\nthat Armitage may have prioritized the sonic patterns and structure of the original poem in his translation, it doesn’t give any indication that this\napproach would be less appealing to modern readers than an approach that directly translates the words but loses the original patterns of\nsounds in the poem. Choice C is incorrect. The text actually suggests that a strictly literal Modern English translation of Sir Gawain and the Green\nKnight wouldn’t be especially faithful to the original intentions of the poem because the Modern English words would change the sonic patterns\nArmitage notes are essential to the alliterative poem’s structure—that is, such a translation would change patterns of sound that are a\nfundamental part of the original poem’s composition. Moreover, there’s no reason to think that a strictly literal translation of that poem would be\nmore faithful to the original intentions than literal translations of other alliterative Middle English poems would be, since they would presumably\nall face the issue of a change in the patterns of sounds. Choice D is incorrect because the end of the text makes a point about sounds, not\nmeaning. Modern readers interested in gathering historical information from the poem might prefer a strictly literal translation (one that directly\ntranslates the words without making additional changes), but that idea doesn’t logically follow from the fact that many Modern English words\nstart with different sounds than their Middle English counterparts; a change in the sounds wouldn’t have any effect on the information the poem\nconveys."}, {"id": "df91532e", "skill": "Command of Evidence", "difficulty": "Hard", "question": "In the “language nest” model of education, Indigenous children learn the language of their people by using it as the medium of instruction and socialization at pre-K or elementary levels. In their 2016 study of a school in an Anishinaabe community in Ontario, Canada, scholars Lindsay Morcom and Stephanie Roy (who are Anishinaabe themselves) found that the model not only imparted fluency in the Anishinaabe language but also enhanced students’ pride in Anishinaabe culture overall. Given these positive effects, Morcom and Roy predict that the model increases the probability that as adults, former students of the school will transmit the la
