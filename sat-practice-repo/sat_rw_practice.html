ions? The best among them, those who consecrate Nature with their sacred desire for the future, will lose, in a sordid and painful annihilation, all stimulus to alleviate the ugliness of humanity.”", "D": "“Listen to the song of this hardworking and satisfied nation; listen to Walt Whitman. The exercise of himself exalts him to majesty, tolerance exalts him to justice, and order to joy.”"}, "correct": "A", "rationale": "Choice A is the best answer because it most effectively illustrates the claim that Martí argues that a society’s spiritual well-being depends on the\ncharacter of its literary culture. In the quotation, Martí asserts that poetry is “more necessary to a people than industry itself” and that it has the\npower to provide people with “faith and vigor.” He also adds that literature gives people “the desire and strength for life.” Therefore, this quotation\nshows that Martí believes that literature is a societal necessity because it uplifts people and nourishes their spiritual well-being.\nChoice B is incorrect. Although this quotation emphasizes the importance of literature, it focuses on how the nature of a society is reflected in\nthat society’s literature rather than on literature’s value for people’s spiritual well-being. Choice C is incorrect. Although this quotation involves an\nelement of spirituality, it doesn’t discuss literature. The quotation instead focuses on humanity’s actions. Choice D is incorrect because this\nquotation mainly focuses on the importance of Walt Whitman rather than on the value of literature in general."}, {"id": "b28dc26d", "skill": "Command of Evidence", "difficulty": "Hard", "question": "The linguistic niche hypothesis (LNH) posits that the exotericity of languages (how prevalent non-native speakers are) and grammatical complexity are inversely related, which the LNH ascribes to attrition of complex grammatical rules as more non-native speakers adopt the language but fail to acquire those rules. Focusing on two characteristics that are positive indices of grammatical complexity, fusion (when new phonemes arise from the merger of previously distinct ones) and informativity (languages’ capacity for meaningful variation), Olena Shcherbakova and colleagues conducted a quantitative analysis for more than 1,300 languages and claim the outcome is inconsistent with the LNH. Which finding, if true, would most directly support Shcherbakova and colleagues’ claim?", "choices": {"A": "Shcherbakova and colleagues’ analysis showed a slightly negative correlation between grammatical complexity and fusion and between grammatical complexity and informativity.", "B": "Shcherbakova and colleagues’ analysis showed a slightly negative correlation between grammatical complexity and exotericity.", "C": "Shcherbakova and colleagues’ analysis showed a slightly positive correlation between grammatical complexity and fusion.", "D": "Shcherbakova and colleagues’ analysis showed a slightly positive correlation between fusion and exotericity and between informativity and exotericity."}, "correct": "D", "rationale": "Choice D is the best answer because it presents a finding that, if true, would support Shcherbakova and colleagues’ claim that the outcome of\ntheir study is inconsistent with the linguistic niche hypothesis (LNH). The text explains that the LNH holds that there is an inverse relationship\nbetween the prevalence of non-native speakers of a language (exotericity) and the grammatical complexity of that language—that is, that as the\nnumber of non-native speakers increases, grammatical complexity decreases, and vice versa. According to the text, Shcherbakova and\ncolleagues focused on two positive indications of grammatical complexity—fusion and informativity—and analyzed their occurrence in over\n1,300 languages. If the researchers found a slightly positive correlation between fusion and exotericity and between informativity and exotericity\n—meaning that to some extent, grammatical complexity increases as the number of non-native speakers of a language increases—their outcome\nwould not be consistent with the assumption that exotericity and grammatical complexity are inversely related (the LNH).\nChoice A is incorrect because it wouldn’t be possible to say that a finding of a slightly negative correlation between grammatical complexity and\nboth fusion and informativity is inconsistent or consistent with the LNH, since the finding would address only grammatical complexity (given that\nfusion and informativity are aspects of grammatical complexity) and wouldn’t move beyond that factor to address its relationship to the\nprevalence of non-native speakers of a language (exotericity), which is the relationship the LNH focuses on. Choice B is incorrect because a\nfinding of a slightly negative correlation between grammatical complexity and the prevalence of non-native speakers of a language (exotericity)—\nmeaning that as the number of non-native speakers increases, grammatical complexity somewhat decreases, and vice versa—would be\nconsistent, not inconsistent, with the LNH, since the text indicates that according to the LNH, there is an inverse relationship between\ngrammatical complexity and exotericity; a negative correlation reflects an inverse relationship. Choice C is incorrect because it wouldn’t be\npossible to say that a finding of a slightly positive correlation between grammatical complexity and fusion is inconsistent or consistent with the\nLNH, since the finding would address only grammatical complexity (given that fusion is a positive indication of grammatical complexity) and\nwouldn’t move beyond that factor to address its relationship to the prevalence of non-native speakers of a language (exotericity), which is the\nrelationship the LNH focuses on."}, {"id": "8f3a200e", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "Some astronomers searching for extraterrestrial life have proposed that atmospheric NH3 (ammonia) can serve as a biosignature gas—an indication that a planet harbors life. Jingcheng Huang, Sara Seager, and colleagues evaluated this possibility, finding that on rocky planets, atmospheric NH3 likely couldn’t reach detectably high levels in the absence of biological activity. But the team also found that on so-called mini- Neptunes—gas planets smaller than Neptune but with atmospheres similar to Neptune’s—atmospheric pressure and temperature can be high enough to produce atmospheric NH3. Based on the text, Huang, Seager, and colleagues would most likely agree with which statement about atmospheric NH3?", "choices": {"A": "Its presence is more likely to indicate that a planet is a mini-Neptune than that the planet is a rocky planet that could support life.", "B": "Its absence from a planet that’s not a mini-Neptune indicates that the planet probably doesn’t have life.", "C": "It should be treated as a biosignature gas if detected in the atmosphere of a rocky planet but not if detected in the atmosphere of a mini- Neptune.", "D": "It doesn’t reliably reach high enough concentrations in the atmospheres of rocky planets or mini-Neptunes to be treated as a biosignature gas."}, "correct": "C", "rationale": "Choice C is the best answer because it states a conclusion the researchers likely agree with, given the details in the text. The text explains that a\nbiosignature gas is a gas that can be used as an indicator that a planet harbors some form of life and some astronomers have proposed that\nNH3 could serve as a biosignature gas. The researchers evaluating this claim found that the atmosphere of rocky planets would be unlikely to\nreach \"detectably high levels\" of NH3 without biological activity, which would support the proposal of NH3 serving as a biosignature gas.\nHowever, the text also states that mini-Neptune planets can produce NH3 in the absence of biological activity. Thus, the text is structured to lead\nto the conclusion that detectable levels of NH3 in the atmospheres of rocky planets could constitute a biosignature, but that is not the case for\ndetectable levels of the gas in the atmospheres of mini-Neptune planets.\nChoice A is incorrect because the text indicates that biological activity likely accounts for detectable levels of NH3 in the atmospheres of rocky\nplanets but mini-Neptune planets can have detectable levels of NH3 in their atmospheres in the absence of biological activity. Therefore, both\nrocky planets and mini-Neptune planets can have detectable levels of atmospheric NH3. Choice B is incorrect because the text states that for\nNH3 to reach detectable levels in the atmospheres of rocky planets likely means they harbor biological activity, meaning that rocky planets with\ndetectable NH3 usually harbor biological activity. However, that does not entail that every rocky planet with biological activity will have detectable\nlevels of NH3 in their atmospheres. Choice D is incorrect because the text claims only that some astronomers have proposed using NH3 as a\nbiosignature gas without mentioning a minimum concentration of atmospheric NH3 that must be met for it to function as a biosignature gas."}, {"id": "db2da2bf", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "In 2019, 20 previously unknown moons were confirmed to be orbiting Saturn. Three of the moons have prograde orbits (orbiting in the direction the planet spins), and the other 17 have retrograde orbits (orbiting in the opposite direction of the planet’s spin). All but one of the 20 moons are thought to be remnants of bodies that orbited Saturn until they broke apart in collisions. Although the one exceptional moon orbits in the same direction as the planet’s spin, its orbit is highly eccentric compared to the rest, which may suggest that it has a different origin than the other 19 moons. Based on the text, which choice best describes the moon with the eccentric orbit?", "choices": {"A": "It doesn’t have a retrograde orbit, but it likely has the same origin as the moons with retrograde orbits.", "B": "Its orbit is so tilted with respect to the other moons’ orbits that it’s neither prograde nor retrograde.", "C": "It has a prograde orbit that is likely the result of having collided with another body orbiting Saturn.", "D": "It has a prograde orbit and may not be a remnant of an earlier body that orbited Saturn."}, "correct": "D", "rationale": "Choice D is the best answer because it most accurately describes the moon with the eccentric orbit. The text indicates that three of the 20 newly\ndiscovered moons have prograde orbits, meaning that they orbit Saturn in the same direction as the planet’s spin, while the other 17 moons have\nretrograde orbits, meaning that they orbit Saturn in the opposite direction of the planet’s spin. The text then states that 19 of the 20 moons\nappear to be the remains of earlier bodies that orbited Saturn but were broken apart in collisions. The one exception is a moon that orbits Saturn\nin the same direction as the planet’s spin, meaning that the exceptional moon’s orbit is prograde. The text goes on to state that the exceptional\nmoon’s orbit is so eccentric that the moon may have formed through a different process than the other 19 moons. The moon with the eccentric\norbit, therefore, has a prograde orbit and may not be a remnant of an earlier body that orbited Saturn.\nChoice A is incorrect because nothing in the text supports the idea that the moon with the eccentric orbit likely has the same origin as the moons\nwith retrograde orbits. Although it’s true that the moon has a prograde orbit (and thus doesn’t have a retrograde orbit), the only information the\ntext provides about the moon’s origin is that it may be different than the origin of the other 19 moons. Choice B is incorrect because the text\nstates that the moon in question orbits Saturn in the same direction as the planet’s spin, meaning that the moon’s orbit is prograde, not that its\norbit is neither prograde nor retrograde. Choice C is incorrect because the text merely notes that the moon in question has a prograde orbit\nwithout giving any indication of what likely caused that orbit."}, {"id": "df37c087", "skill": "Command of Evidence", "difficulty": "Hard", "question": "550 500 450 400 350 300 250 200 150 100 50 0 )smarg( thgieW Weight of Three Aerial Robots Robot Ultra-Fast Robot Hand Permanent Magnet Hand Yale Model T Aerial robots vary considerably in their holding force; the Ultra-Fast Robot Hand, for example, has a holding force of 56 newtons, more than twice that of the Permanent Magnet Hand and more than four times that of the Yale Model T. Since an aerial robot must lift its own weight along with its cargo, engineer Jiawei Meng and colleagues used a ratio of each robot’s holding force to the robot’s weight to calculate payload capacity, with higher ratios corresponding to greater capacity, concluding that the Ultra-Fast Robot Hand has a higher payload capacity than the Yale Model T. Which choice best describes data in the graph that support Meng and colleagues’ conclusion?", "choices": {"A": "The Ultra-Fast Robot Hand and the Yale Model T each weigh more than 450 grams.", "B": "The Ultra-Fast Robot Hand and the Yale Model T each weigh more than the Permanent Magnet Hand does.", "C": "The Yale Model T has a lower holding force than the Permanent Magnet Hand despite weighing more.", "D": "The Ultra-Fast Robot Hand weighs only slightly more than the Yale Model T does."}, "correct": "D", "rationale": "Choice D is the best answer because it describes data in the graph that support Meng and colleagues’ conclusion that the Ultra-Fast Robot Hand\nhas a higher payload capacity than the Yale Model T. According to the text, payload capacity is calculated by using a ratio of a robot’s holding\nforce to the robot’s weight, and higher ratios indicate a greater payload capacity. The Ultra-Fast Robot Hand has a holding force of 56 newtons,\nfour times greater than that of the Yale Model T. Additionally, the graph shows that the Ultra-Fast Robot Hand has a weight of approximately 500\ngrams, slightly more than the Yale Model T’s weight of approximately 480 grams. Therefore, the Ultra-Fast Robot Hand has a higher ratio of\nholding force to weight than the Yale Model T. Since higher ratios correspond to greater payload capacity, the information from the graph\nindicating that the Ultra-Fast Robot Hand weighs only slightly more than the Yale Model T combined with the information in the text ultimately\nsupports the conclusion that the Ultra-Fast Robot Hand has a higher payload capacity than the Yale Model T.\nChoice A is incorrect. Although, according to the graph, it’s true that both the Ultra-Fast Robot Hand and the Yale Model T weigh more than 450\ngrams, this statement doesn’t support Meng and colleagues’ conclusion that the Ultra-Fast Robot Hand has a higher payload capacity than the\nYale Model T. This statement emphasizes a similarity, not a distinction, between the two robots. Choice B is incorrect. Although, according to the\ngraph, it’s true that the Ultra-Fast Robot Hand and the Yale Model T both weigh more than the Permanent Magnet Hand does, this statement\ndoesn’t support Meng and colleagues’ conclusion that the Ultra-Fast Robot Hand has a higher payload capacity than the Yale Model T. This\nstatement emphasizes a similarity, not a distinction, between the Ultra-Fast Robot Hand and the Yale Model T. Furthermore, the comparison to\nthe Permanent Magnet Hand is irrelevant to the claim about the relative ratios and payload capacities of the Ultra-Fast Robot Hand and the Yale\nModel T. Choice C is incorrect. Although the text states that the Yale Model T has a lower holding force than the Permanent Magnet Hand, the\ngraph provides no information about holding force. Moreover, information about the Permanent Magnet Hand is irrelevant to the conclusion by\nMeng and colleagues, which only concerns the Ultra-Fast Robot Hand and the Yale Model T."}, {"id": "e6e6be2d", "skill": "Inferences", "difficulty": "Hard", "question": "Overgrazing by purple sea urchins has caused many kelp forests along North America’s west coast to be replaced by urchin barrens—areas stripped of vegetation and covered in purple sea urchins. Urchins in barrens persist in a state of starvation that lessens their nutritional value— and thus their appeal—to many predators. Sarah Gravem and colleagues placed sunflower sea stars, a once-abundant predator species suffering massive population declines in recent years, in aquariums that each contained a nutritionally poor and a nutritionally rich purple sea urchin. The researchers found that the sea stars selected the nutritionally rich urchin in 42.7% of trials and the nutritionally poor urchin in 37.5% of trials, suggesting that _____ Which choice most logically completes the text?", "choices": {"A": "sunflower sea stars are willing to hunt sea urchins, but if given a choice, they will prey on other more nutritious marine animals instead.", "B": "sunflower sea stars are reluctant to feed on both nutritionally poor and nutritionally rich sea urchins and are therefore unlikely to thrive in kelp forests.", "C": "sunflower sea stars are less likely to consume sea urchins in barrens than other species of sea stars are, putting sunflower sea stars at a high risk of extinction.", "D": "sunflower sea stars do not always avoid foraging on nutritionally poor sea urchins, making sunflower sea star population recovery a potentially important tool for controlling urchin barrens."}, "correct": "D", "rationale": "Choice D is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the researchers’ findings\nabout purple sea urchins and sunflower sea stars. The text explains that urchin barrens are areas that used to be kelp forests but are now\ncovered by purple sea urchins. The text suggests that because there is no more vegetation to be consumed in those areas, the urchins exist in a\nstate of starvation that makes them less nutritional for many predators. The text goes on to explain that in a study with a choice between two\npurple sea urchins, sunflower sea stars (a predator species that has been substantially declining) consumed a nutritionally rich urchin 42.7% of\nthe time and a nutritionally poor urchin 37.5% of the time. Because the sunflower sea stars didn’t always avoid consuming nutritionally poor\nurchins, even when nutritionally rich ones were available, it follows that helping sunflower sea star populations to grow could help control urchin\nbarrens by increasing the number of sea stars that may consume and thus remove nutritionally poor purple sea urchins from barrens.\nChoice A is incorrect because the text indicates only that when presented with purple sea urchins, the sunflower sea stars in the study consumed\nboth nutritionally rich and nutritionally poor ones. It doesn’t suggest that sunflower sea stars generally prefer other marine animals that are more\nnutritious; there’s no mention of other marine animals. Choice B is incorrect because the text doesn’t suggest that sunflower sea stars are\ngenerally reluctant to feed on sea urchins. In fact, the text indicates that the sunflower sea stars in the study did consume sea urchins, feeding on\nboth nutritionally poor and nutritionally rich ones. Choice C is incorrect because the text addresses only the willingness of sunflower sea stars to\nconsume the type of sea urchins found in barrens (nutritionally poor sea urchins), not how likely other species of sea stars are to consume them."}, {"id": "0dccbf17", "skill": "Inferences", "difficulty": "Hard", "question": "Henry Ossawa Tanner’s 1893 painting The Banjo Lesson, which depicts an elderly man teaching a boy to play the banjo, is regarded as a landmark in the history of works by Black artists in the United States. Scholars should be cautious when ascribing political or ideological values to the painting, however: beliefs and assumptions that are commonly held now may have been unfamiliar to Tanner and his contemporaries, and vice versa. Scholars who forget this fact when discussing The Banjo Lesson therefore _____ Which choice most logically completes the text?", "choices": {"A": "risk judging Tanner’s painting by standards that may not be historically appropriate.", "B": "tend to conflate Tanner’s political views with those of his contemporaries.", "C": "forgo analyzing Tanner’s painting in favor of analyzing his political activity.", "D": "wrongly assume that Tanner’s painting was intended as a critique of his fellow artists."}, "correct": "A", "rationale": "Choice A is the best answer. It most logically completes the text. The text argues that Tanner and his contemporaries may have been unfamiliar\nwith modern beliefs and values. This suggests that scholars who attribute those modern values to Tanner’s painting are risking judging the\npainting by standards that are not historically accurate.\nChoice B is incorrect. It doesn’t logically complete the text. The text argues that Tanner AND his contemporaries may have been unfamiliar with\nmodern views. It never suggests that Tanner’s views were different from his contemporaries’ views. Choice C is incorrect. It doesn’t logically\ncomplete the text. The text never suggests that scholars should analyze Tanner’s political activity instead of his painting. Rather, the text argues\nthat Tanner and his contemporaries may have been unfamiliar with modern beliefs and values. Choice D is incorrect. It doesn’t logically complete\nthe text. The text never suggests that Tanner wanted to critique his contemporaries with his painting. Rather, the text argues that Tanner AND his\ncontemporaries may have been unfamiliar with modern beliefs and values."}, {"id": "37e15265", "skill": "Command of Evidence", "difficulty": "Hard", "question": "“The Young Girl” is a 1920 short story by Katherine Mansfield. In the story, the narrator takes an unnamed seventeen-year-old girl and her younger brother out for a meal. In describing the teenager, Mansfield frequently contrasts the character’s pleasant appearance with her unpleasant attitude, as when Mansfield writes of the teenager, _____ Which quotation from “The Young Girl” most effectively illustrates the claim?", "choices": {"A": "“I heard her murmur, ‘I can’t bear flowers on a table.’ They had evidently been giving her intense pain, for she positively closed her eyes as I moved them away.”", "B": "“While we waited she took out a little, gold powder-box with a mirror in the lid, shook the poor little puff as though she loathed it, and dabbed her lovely nose.”", "C": "“I saw, after that, she couldn’t stand this place a moment longer, and, indeed, she jumped up and turned away while I went through the vulgar act of paying for the tea.”", "D": "“She didn’t even take her gloves off. She lowered her eyes and drummed on the table. When a faint violin sounded she winced and bit her lip again. Silence.”"}, "correct": "B", "rationale": "Choice B is the best answer because it most effectively illustrates the claim in the text that in describing the teenaged girl, Mansfield contrasts\nthe character’s pleasant appearance with her unpleasant attitude. In the quotation, Mansfield describes the teenager as having a “lovely nose” (a\ncompliment about her appearance) but also as treating her makeup puff “as though she loathed it” (a judgment suggesting her unpleasant\nattitude).\nChoice A is incorrect because the teenager′s reaction to the flowers doesn’t make it clear that she has an unpleasant attitude, and nothing in the\nquotation indicates that any part of her appearance is pleasant. Choice C is incorrect because the quotation suggests that the teenager has an\nunpleasant attitude (being upset with the location and leaving the table before the narrator has paid for the meal) but doesn’t give any indication\nthat she has a pleasant appearance. Choice D is incorrect because the quotation suggests that the teenager may have an unpleasant attitude\n(lowering her eyes, wincing, and sitting in silence) but doesn’t give any indication that any part of her appearance is pleasant."}, {"id": "f9c4bdab", "skill": "Command of Evidence", "difficulty": "Hard", "question": "A student is writing a paper about One Night in Miami..., a 2020 film directed by Regina King and written by Kemp Powers. Powers adapted the film’s screenplay from his 2013 play, which he wrote after learning about a 1964 meeting that took place in Miami, Florida, between four prominent figures of the Civil Rights movement: Malcolm X, Muhammad Ali, Jim Brown, and Sam Cooke. The student claims that although Powers was inspired by this meeting, the film is best understood not as a precise retelling of historical events but rather as a largely imagined but informed representation of them. Which quotation from an article about One Night in Miami... would be the most effective evidence for the student to include in support of this claim?", "choices": {"A": "“When Powers learned of the meeting, he initially planned to write a much longer work about its four famous participants rather than focusing on the meeting itself.”", "B": "“One Night in Miami... received numerous awards and nominations, including an Academy Award nomination for Powers for Best Adapted Screenplay.”", "C": "“Powers has described One Night in Miami... as the story of four friends encouraging and supporting one another while engaged in a crucial political debate about how best to achieve equality for Black people in the United States.”", "D": "“Powers could find only the most superficial historical details about the meeting, so he read extensively about the four individuals and their thinking at the time in an effort to portray what might have happened between them.”"}, "correct": "D", "rationale": "Choice D is the best answer because it provides a quotation that effectively supports the student’s claim about the film One Night in Miami…. The\nquotation states that in researching the play on which the film was based, Kemp Powers only found superficial details about what actually\nhappened during the 1964 meeting in Miami between four leading Civil Rights leaders, meaning that there is very little information about the\nmeeting in the historical record. In the absence of greater details, it wouldn’t have been possible for the film to be a precise retelling of the\nhistorical events it depicts. The quotation explains that to compensate for this lack of information about the meeting, Powers did extensive\nresearch into the four figures and how they thought at the time in order to speculate in an informed way about what they might have said or what\nmight have occurred between them. Therefore, the quotation effectively supports the claim that the film is best understood not as a precise\nretelling of a historical event but as a deeply informed imaginative rendering of that event.\nChoice A is incorrect. Although the quotation discusses how on learning about the 1964 meeting in Miami, Powers was inspired to write a play\nand, later, to adapt it into a screenplay, it doesn’t discuss Powers’s approach to representing what had occurred in the meeting. Instead, it states\nthat Powers didn’t initially plan to write a story only “focusing on the meeting itself” but rather had considered writing a “much longer” and more\nexpansive work about the meeting’s four participants. Choice B is incorrect because the quotation doesn’t discuss Powers’s approach to\nrepresenting historical events in his play and in the film; instead, the quotation focuses on the film’s positive critical reception by mentioning that\nit received numerous awards and nominations. Choice C is incorrect. Although the quotation references historical events that are discussed\ndirectly in the play and film by explaining how the four historical figures featured in the story engage in political debates about contemporary\nissues, it doesn’t specify to what extent Powers’s representation of what occurred during the 1964 meeting in Miami is a factual retelling of what\nhappened and how much is an imaginative rendering of what might have happened. Rather, the quotation focuses on Powers’s description of the\nfilm’s basic premise and how the characters engage with the historical context of its setting."}, {"id": "5632ffb4", "skill": "Inferences", "difficulty": "Hard", "question": "In a study of the cognitive abilities of white-faced capuchin monkeys (Cebus imitator), researchers neglected to control for the physical difficulty of the tasks they used to evaluate the monkeys. The cognitive abilities of monkeys given problems requiring little dexterity, such as sliding a panel to retrieve food, were judged by the same criteria as were those of monkeys given physically demanding problems, such as unscrewing a bottle and inserting a straw. The results of the study, therefore, _____ Which choice most logically completes the text?", "choices": {"A": "could suggest that there are differences in cognitive ability among the monkeys even though such differences may not actually exist.", "B": "are useful for identifying tasks that the monkeys lack the cognitive capacity to perform but not for identifying tasks that the monkeys can perform.", "C": "should not be taken as indicative of the cognitive abilities of any monkey species other than C. imitator.", "D": "reveal more about the monkeys’ cognitive abilities when solving artificial problems than when solving problems encountered in the wild."}, "correct": "A", "rationale": "Choice A is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the study of capuchin\nmonkeys’ cognitive abilities. The text explains that the study failed to distinguish between outcomes for the tasks performed by the capuchin\nmonkeys, such that simpler tasks requiring less dexterity, or skill, were judged by the same criteria as tasks that demanded more dexterity.\nBecause the study didn’t account for this discrepancy, the researchers might have assumed that observed differences in performance were due\nto the abilities of the monkeys rather than the complexity of the tasks. In other words, the results may suggest cognitive differences among the\nmonkeys even though such differences may not really exist.\nChoice B is incorrect because the text focuses on the fact that the tasks assigned to the capuchin monkeys in the study varied in difficulty and\nthat the variety wasn’t taken into consideration. The text doesn’t suggest that the capuchin monkeys couldn’t perform certain tasks, just that\nsome tasks were more difficult to do. Choice C is incorrect because the text doesn’t suggest that the study’s results are indicative of the abilities\nof capuchin monkeys but not of other monkey species; in fact, the text suggests that the results may not even be an accurate reflection of\ncapuchin monkeys’ abilities. Choice D is incorrect because the text doesn’t indicate that the researchers compared results for artificial tasks with\nthose for tasks encountered in the wild, although the tasks described in the text—sliding a panel and putting a straw in a bottle—are presumably\nartificial."}, {"id": "6eb0223c", "skill": "Command of Evidence", "difficulty": "Hard", "question": "In subtropical Asia, Apis dorsata (giant honeybee) plays an essential role in pollinating a wide variety of crops and wild plants. To study how different agricultural land covers affect the species, Rika Raffiudin and colleagues monitored the foraging activity of the bees as well as the pollen content of the honey from A. dorsata colonies at two sites in Indonesia: Kampar, characterized by its surrounding monoculture farms (growing a single crop), and Kerinci, a forest-agriculture site where multiple crops, including hot peppers and coffee, are grown nearby. The researchers concluded that a lack of crop variety may reduce total pollen collection by A. dorsata. Which finding, if true, would most directly support the researchers’ conclusion?", "choices": {"A": "Pollen in honey samples from Kampar bee colonies was predominantly sourced from a single plant species, whereas pollen in honey samples from Kerinci bee colonies was sourced from multiple different plant species.", "B": "In one Kerinci bee colony, a greater proportion of bees returned to their nests with pollen than returned without pollen, whereas the inverse was observed in a second Kerinci bee colony.", "C": "Significantly fewer bees were observed engaging in foraging activities with the crops surrounding Kerinci than with the crops surrounding Kampar.", "D": "Honey samples from Kerinci bee colonies contained significantly higher concentrations of pollen than honey samples from Kampar bee colonies did."}, "correct": "D", "rationale": "Choice D is the best answer because it presents a finding that, if true, would most directly support the researchers’ conclusion that a lack of crop\nvariety may reduce total pollen collection by A. dorsata. The text explains that the researchers compared two sites: Kampar, which is surrounded\nby farms all growing the same crop, and Kerinci, which is a forest-agriculture site with multiple crops. If honey samples from Kerinci bee colonies\ncontained significantly higher pollen concentrations than honey samples from Kampar bee colonies did, this finding would suggest that bees in\nthe multiple-crop environment collected more pollen overall, thereby supporting the conclusion that the low crop variety at the Kampar site\ncorresponds with reduced total pollen collection.\nChoice A is incorrect because this finding addresses the diversity of pollen sources—single species at the Kampar site versus multiple species at\nthe Kerinci site—not the total quantity of pollen collected. Choice B is incorrect because this finding compares two colonies within Kerinci rather\nthan comparing the two sites and it concerns whether bees returned with pollen, which doesn’t address the total quantity of pollen collected.\nChoice C is incorrect because the finding that fewer bees foraged at Kerinci—the higher-variety site—than at Kampar doesn’t address the\nconclusion about total pollen collected. If anything, a lower number of foraging bees would suggest reduced activity and hence a lower amount\nof pollen collected in the variety-rich environment, which would undermine rather than support the researchers’ conclusion."}, {"id": "b32c4b3a", "skill": "Command of Evidence", "difficulty": "Hard", "question": "The Intertropical Convergence Zone (ITCZ), a band of clouds that encircles Earth in the tropics and is a major rainfall source, shifts position in response to temperature variations across Earth’s hemispheres. Data from Huagapo Cave in Peru suggest the ITCZ shifted south during the Little Ice Age (circa 1300–1850), but a shift as far into South America as Huagapo should have led to dry conditions in Central America, which is inconsistent with climate models. To resolve the issue, geologist Yemane Asmerom and colleagues collected data from Yok Balum Cave in Central America and compared them with the Huagapo data. They concluded that during the Little Ice Age, the ITCZ may have expanded northward and southward rather than simply shifted. Which finding from Asmerom and colleagues’ study, if true, would most directly support their conclusion?", "choices": {"A": "Neither the Yok Balum data nor the Huagapo data show significant local variations in temperature during the Little Ice Age.", "B": "Both the Yok Balum data and the Huagapo data show increased temperatures and prolonged dry conditions during the Little Ice Age.", "C": "The Yok Balum data show prolonged dry conditions during the same portions of the Little Ice Age in which the Huagapo data show heightened levels of rainfall.", "D": "The Yok Balum data and the Huagapo data show strongly correlated patterns of high rainfall during the Little Ice Age."}, "correct": "D", "rationale": "Choice D is the best answer because it presents a finding that, if true, would support Asmerom and colleagues’ conclusion that the ITCZ may\nhave expanded northward and southward rather than shifting south during the Little Ice Age. The text indicates that the ITCZ, a band of clouds in\nthe tropics that is a significant rainfall source, can change position. Data from Peru’s Huagapo Cave suggest that the ITCZ shifted south during\nthe Little Ice Age. But according to the text, if the ITCZ moved into South America in that way, then Central America should have been drier than\nclimate models suggest it was. In other words, rainfall should have been reduced in Central America because the ITCZ, a significant rainfall\nsource, had shifted into South America, but climate models do not show such a reduction in Central America. The text goes on to say that\nAsmerom and colleagues tried to resolve this apparent conflict by collecting data from Yok Balum cave in Central America and comparing them\nwith data from Huagapo, which led the researchers to conclude that the ITCZ may have expanded both northward and southward rather than\nsimply shifting south. If it is true that Yok Balum in Central America and Huagapo in South America show strongly correlated patterns of high\nrainfall during the Little Ice Age, such a finding would support Asmerom and colleagues’ conclusion by suggesting that the two areas were\naffected by the same rainfall source, and thus that the ITCZ may have expanded rather than shifted.\nChoice A is incorrect because there is no information in the text about how, if at all, the ITCZ affects temperature in areas where it is located.\nRather, the text states that temperature variations across Earth’s hemispheres can shift the position of the ITCZ. Finding that neither Yok Balum\nnor Huagapo data show evidence of significant local variations in temperature during the Little Ice Age would have no clear bearing on Asmerom\nand colleagues’ claim. Choice B is incorrect because finding that both Yok Balum and Huagapo experienced prolonged dry conditions during the\nLittle Ice Age would not support Asmerom and colleagues’ conclusion that the ITCZ, a major source of rainfall, may have expanded northward\nand southward rather than simply shifting south. Dry conditions in both locations would suggest that the ITCZ did not cover either location.\nAdditionally, finding that temperatures were elevated in both locations would have no clear bearing on Asmerom and colleagues’ conclusion,\nsince there is no information in the text that indicates how, if at all, the ITCZ affects temperature. Choice C is incorrect because finding that Yok\nBalum experienced prolonged dry conditions at the same time that Huagapo experienced high rainfall would weaken Asmerom and colleagues’\nconclusion, not strengthen it. Such a finding would suggest that the ITCZ shifted south and left Central America dry rather than expanding both\nnorthward and southward."}, {"id": "d102706f", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Estimates of Tyrannosaurid Bite Force Study Year Estimation method Approximate bite force (newtons) Cost et al. 2019 muscular and skeletal modeling 35,000–63,000 Gignac and Erickson 2017 tooth-bone interaction analysis 8,000–34,000 Meers 2002 body-mass scaling 183,000–235,000 Bates and Falkingham 2012 muscular and skeletal modeling 35,000–57,000 The largest tyrannosaurids—the family of carnivorous dinosaurs that includes Tarbosaurus, Albertosaurus, and, most famously, Tyrannosaurus rex —are thought to have had the strongest bites of any land animals in Earth’s history. Determining the bite force of extinct animals can be difficult, however, and paleontologists Paul Barrett and Emily Rayfield have suggested that an estimate of dinosaur bite force may be significantly influenced by the methodology used in generating that estimate. Which choice best describes data from the table that support Barrett and Rayfield’s suggestion?", "choices": {"A": "The study by Meers used body-mass scaling and produced the lowest estimated maximum bite force, while the study by Cost et al. used muscular and skeletal modeling and produced the highest estimated maximum.", "B": "In their study, Gignac and Erickson used tooth-bone interaction analysis to produce an estimated bite force range with a minimum of 8,000 newtons and a maximum of 34,000 newtons.", "C": "The bite force estimates produced by Bates and Falkingham and by Cost et al. were similar to each other, while the estimates produced by Meers and by Gignac and Erickson each differed substantially from any other estimate.", "D": "The estimated maximum bite force produced by Cost et al. exceeded the estimated maximum produced by Bates and Falkingham, even though both groups of researchers used the same method to generate their estimates."}, "correct": "C", "rationale": "Choice C is the best answer because it accurately describes data from the table that support Barrett and Rayfield’s suggestion about bite force\nestimates. According to the text, Barrett and Rayfield believe that estimates of dinosaur bite force may be strongly influenced by the methods\nused to produce them—that is, that different methods may produce significantly different results. The table shows that the studies by Bates and\nFalkingham and by Cost et al. used the same estimation method (muscular and skeletal modeling) and produced similar bite force estimates\n(approximately 35,000–57,000 newtons and 35,000–63,000 newtons, respectively). The study by Meers, however, used body-mass scaling and\nproduced a much higher bite force estimate (183,000–235,000 newtons), while the study by Gignac and Erickson used tooth-bone interaction\nanalysis and produced a much lower bite force estimate (8,000–34,000 newtons). The fact that one method produced similar estimates in two\ndifferent studies and that two different methods used in other studies produced substantially different estimates supports the idea that dinosaur\nbite force estimates are significantly influenced by the methodology used to produce them.\nChoice A is incorrect because it inaccurately describes data from the table. The table does show that the studies by Meers and by Cost et al.\nused different estimation methods and produced very different ranges of estimated dinosaur bite force, which would support Barrett and\n\nRayfield’s suggestion that different methodologies may produce significantly different estimates. However, the table doesn’t show that the study\nby Meers produced the lowest estimated maximum bite force while the study by Cost et al. produced the highest. In fact, the study by Meers\nestimated a maximum bite force of approximately 235,000 newtons, which is the highest of all the estimated maximums. Choice B is incorrect.\nAlthough the data from Gignac and Ericson’s study are accurately described, a single set of findings from one study using only one methodology\ncan’t show that different methodologies may produce significantly different dinosaur bite force estimates, as Barrett and Rayfield suggest.\nChoice D is incorrect. Although the table shows that the maximum bite force estimated by Cost et al. was higher than that estimated by Bates\nand Falkingham, the difference is relatively small; in fact, both teams estimated a minimum bite force of approximately 35,000 newtons and a\nmaximum bite force close to approximately 60,000 newtons. Because these findings demonstrate that a single methodology (muscular and\nskeletal modeling) produced similar overall results in two studies, the findings don’t support Barrett and Rayfield’s suggestion that different\nmethodologies may produce significantly different dinosaur bite force estimates."}, {"id": "1b9b29f1", "skill": "Inferences", "difficulty": "Hard", "question": "A team of biologists led by Jae-Hoon Jung, Antonio D. Barbosa, and Stephanie Hutin investigated the mechanism that allows Arabidopsis thaliana (thale cress) plants to accelerate flowering at high temperatures. They replaced the protein ELF3 in the plants with a similar protein found in another species (stiff brome) that, unlike A. thaliana, displays no acceleration in flowering with increased temperature. A comparison of unmodified A. thaliana plants with the altered plants showed no difference in flowering at 22° Celsius, but at 27° Celsius, the unmodified plants exhibited accelerated flowering while the altered ones did not, which suggests that _____ Which choice most logically completes the text?", "choices": {"A": "temperature-sensitive accelerated flowering is unique to A. thaliana.", "B": "A. thaliana increases ELF3 production as temperatures rise.", "C": "ELF3 enables A. thaliana to respond to increased temperatures.", "D": "temperatures of at least 22° Celsius are required for A. thaliana to flower."}, "correct": "C", "rationale": "Choice C is the best answer because it most logically completes the text’s discussion of accelerated flowering in A. thaliana plants. The text\nindicates that A. thaliana plants show accelerated flowering at high temperatures. To investigate the mechanism for this accelerated flowering,\nbiologists replaced the ELF3 protein in one group of A. thaliana plants with a similar protein found in another plant species that doesn’t show\naccelerated flowering. The team then compared these modified plants to A. thaliana plants that retained their original ELF3 protein. The text\nstates that the two samples of plants showed no difference in flowering at 22° Celsius, but at 27° Celsius the unaltered plants with ELF3 showed\naccelerated flowering while the plants without ELF3 didn’t. If accelerated flowering at the higher temperature occurred in the A. thaliana plants\nwith ELF3 but not in the plants without the protein, then ELF3 likely enables A. thaliana to respond to increased temperatures.\nChoice A is incorrect because the text doesn’t mention whether any plants other than A. thaliana and stiff brome show temperature-sensitive\nflowering, so there is no support for the idea that this type of flowering is unique to A. thaliana. Choice B is incorrect because the text discusses\nthe effects of ELF3 and not the production of it. There’s nothing in the text to suggest that the amount of ELF3 in A. thaliana varies with\ntemperature. Choice D is incorrect. While the text states that there was no difference in the flowering of modified and unmodified A. thaliana\nplants at 22° Celsius, there’s no suggestion that A. thaliana only begins to flower at 22° Celsius; the text doesn’t mention a specific temperature\nthreshold required for A. thaliana flowering."}, {"id": "34c2e387", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "Jürgen Kocka and other historians of capitalism rarely discuss domestic capitalism in Africa before the period of European colonization, implicitly presenting capitalism as external to and imposed on Africa. Crislayne Alfagali and other Africanist scholars have shown, however, that in parts of Africa, returns-focused investment, the establishment of open markets for wage labor, and other features of capitalism predated colonization. One reason for this discrepancy is that historians of capitalism tend to focus on longitudinal economic data drawn from archival records, which do not exist for much of precolonial Africa. Which statement about Alfagali and other Africanist scholars is best supported by information in the text?", "choices": {"A": "They likely make use of different types of evidence than historians of capitalism typically rely on.", "B": "They likely differ from historians of capitalism in the methods they use to derive longitudinal economic data from archival records.", "C": "They likely have a different view about which activities should be considered capitalist in nature than historians of capitalism do.", "D": "They likely view capitalism as having been more beneficial for Africa than historians of capitalism do."}, "correct": "A", "rationale": "Choice A is the best answer because it presents a statement about Alfagali and other Africanist scholars that is supported by the text. The last\nsentence of the text explains that historians of capitalism generally rely on a type of data that requires \"archival records, which do not exist for\nmuch of precolonial Africa.\" Nevertheless, Alfagali and other Africanist scholars have demonstrated that features of capitalism including\n\"returns-focused investment,...open markets for wage labor, and other features of capitalism\" existed in parts of Africa before colonization.\nBecause archival records typically used by historians of capitalism aren′t available for precolonial Africa, Alfagali and other Africanist scholars of\nprecolonial capitalism in Africa likely used atypical sources for their studies.\nChoice B is incorrect because the text states that archival records containing longitudinal economic data \"do not exist for much of precolonial\nAfrica.\" If these records don’t exist for precolonial Africa, then Alfagali and other Africanist scholars couldn’t derive data from them by any\nmethod. Choice C is incorrect because the text doesn’t suggest that Alfagali and other Africanist scholars define capitalism differently than other\nhistorians of capitalism do. On the contrary, the text simply asserts that specific features they found, such as \"returns-focused investment [and]\nopen markets for wage labor,\" are \"features of capitalism,\" which implies scholarly agreement that these activities are capitalist in nature. Choice\nD is incorrect because the text doesn’t indicate any effects of capitalism in Africa, positive or negative. Rather, the text explains why precolonial\nAfrica has been omitted from mainstream histories of capitalism and presents work by Alfagali and other Africanist scholars that challenges and\ncorrects the historical record of precolonial capitalism."}, {"id": "2df56712", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "Electronic music pioneer Wendy Carlos is credited with the music for three feature films: A Clockwork Orange (1971), The Shining (1980), and Tron (1982). However, her musical score for A Clockwork Orange is mostly made up of her arrangements of Ludwig van Beethoven’s work. Also, almost all the music that she and Rachel Elkind composed for The Shining was unused by director Stanley Kubrick. It did not appear in the film. Of the three films, Tron is the one in which audiences can hear the most of Carlos’s original compositions. Which choice best states the main idea of the text?", "choices": {"A": "Of the three films for which Carlos is credited, Tron features the most original music from her.", "B": "The director of The Shining used most of the music that Carlos composed for it.", "C": "Beethoven is widely considered to be a more important composer than Carlos.", "D": "Carlos is a notable innovator among film composers in the 1970s and 1980s."}, "correct": "A", "rationale": "Choice A is the best answer because it best states the main idea of the text. The text indicates that Wendy Carlos scored three feature films: A\nClockwork Orange, The Shining, and Tron. It also indicates that Carlos’s work on A Clockwork Orange consisted primarily of electronic\narrangements of Beethoven compositions and that very little of what she and Rachel Elkind composed for The Shining was used in the film. But\nthe soundtrack for Tron consists largely of music composed by Carlos, so it contains more of her original music than do the soundtracks for the\nother two films. Thus, the main idea of the text is that of the three films for which Carlos is credited, Tron features the most original music from\nher.\nChoice B is incorrect because it directly contradicts the text’s claim that \"very little of what she and Rachel Elkind composed for The Shining was\nused in the film.\" Choice C is incorrect because the text doesn’t address the perceived quality of different composers, instead, it discusses how\nmuch of Carlos’s original work was used in each of the three films she scored. Choice D is incorrect because it doesn’t relate to any of the major\nthemes of the text: the work Wendy Carlos did for three feature films, how much of that work was composed by Carlos, and how much of her\noriginal work was ultimately used in the film."}, {"id": "af9e3240", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Electra is a circa 420–410 BCE play by Sophocles, translated in 1870 by R.C. Jebb. Electra, who is in mourning for her dead father and her long- absent brother, is aware of the intensity of her grief but believes it to be justified: _____ Which quotation from Electra most effectively illustrates the claim?", "choices": {"A": "“O thou pure sunlight, and thou air, earth’s canopy, how often have ye heard the strains of my lament, the wild blows dealt against this bleeding breast, when dark night fails!”", "B": "“Send to me my brother; for I have no more the strength to bear up alone against the load of grief that weighs me down.”", "C": "“I know my own passion, it escapes me not; but, seeing that the causes are so dire, will never curb these frenzied plaints, while life is in me.”", "D": "“But never will I cease from dirge and sore lament, while I look on the trembling rays of the bright stars, or on this light of day.”"}, "correct": "C", "rationale": "Choice C is the best answer. Electra states that she “knows her own passion,” which shows that she’s aware of the intensity of her grief. But she\nalso claims that the “causes are so dire”—meaning the reasons for her grief are so awful—that she can’t let it go, which shows that she believes\nher grief is justified.\nChoice A is incorrect. This quotation doesn’t show that Electra believes her grief is justified. It shows that Electra is aware of its intensity, but it\ndoesn’t suggest that she believes she has a legitimate reason for feeling that way. Choice B is incorrect. This quotation doesn’t show that Electra\nbelieves her grief is justified. It shows that Electra is aware of its intensity, but it doesn’t suggest that she believes she has a legitimate reason for\nfeeling that way. Choice D is incorrect. This quotation doesn’t show that Electra believes her grief is justified. It shows that Electra is aware of the\nintensity of her grief, but it doesn’t suggest that she has a legitimate reason for feeling that way."}, {"id": "71c2cea9", "skill": "Inferences", "difficulty": "Hard", "question": "Belonging to neither the minimalist nor the abstract art movements but heavily influencing both, Constantin Brâncuşi spent his sculpting career returning to the same few themes—a kiss, a sleeping head, and a bird in flight—each rendered in pristine, simple, almost abstract forms. Perhaps the most famous example is Bird in Space (1923), a tall, slender bronze sculpture that arcs upward in a manner suggestive of flight but that otherwise lacks any identifiable characteristics of a bird. Despite the seeming simplicity of his works, the exacting standards to which Brâncuşi held his work meant that he produced relatively few pieces over his career. There is thus something of a disparity between _____ Which choice most logically completes the text?", "choices": {"A": "the nature of much of Brâncuşi’s work and the abstraction of Bird in Space.", "B": "Brâncuşi’s relatively limited productivity and the diversity of his sculptures.", "C": "the themes Brâncuşi explored and the themes favored by artists he inspired.", "D": "Brâncuşi’s importance to the history of art and his total artistic output."}, "correct": "D", "rationale": "Choice D is the best answer because it most logically completes the text’s discussion of the sculptor Constantin Brâncuşi. The text establishes\nBrâncuşi’s significance by noting that although he belonged to neither the minimalist nor the abstract art movements, he heavily influenced both\n—a detail that signals his importance to the history of art. At the same time, the text notes that the exacting standards to which Brâncuşi held his\nwork meant that he produced relatively few pieces over his career. Because the text presents both Brâncuşi’s major artistic influence and his\nlimited output, it is reasonable to infer that the disparity the text identifies is between his importance to the history of art and his total artistic\noutput.\nChoice A is incorrect because the text explicitly identifies Brâncuşi’s Bird in Space as “a famous example” of how the artist conveyed his\npreferred themes—in this case, a bird in flight—through simplicity bordering on abstraction. Thus, this particular sculpture is consistent with the\nnature of much of Brâncuşi’s work instead of showing a disparity, or marked difference, with it. Choice B is incorrect because the text indicates\nthat Brâncuşi returned to the same few themes, suggesting limited thematic diversity. Since his productivity and his thematic diversity were both\nlimited, these two aspects of Brâncuşi’s work are consistent with each other instead of showing a disparity, or a marked difference. Choice C is\nincorrect because although the text mentions that Brâncuşi heavily influenced both the minimalist and abstract art movements, it doesn’t\ndiscuss the specific themes favored by artists in those movements. There is therefore no basis for identifying a disparity between Brâncuşi’s\nthemes and those of artists he inspired."}, {"id": "75208874", "skill": "Inferences", "difficulty": "Hard", "question": "The widespread use of social media enables linguists to study changes in language usage in real time. A notable recent example is the proliferation of the affix meng- among speakers of Bahasa Indonesia, the official language of Indonesia. Linguists observed meng- originate as an onomatopoetic tag that social-media users applied to images of cats they posted; over time, users increasingly applied it as a prefix to existing words (e.g., mengsedih affixes meng- to the word for sad) in text that they posted. From there, it has begun to move into spoken Bahasa Indonesia. Linguists have noted many similar examples of this phenomenon occurring in other languages, suggesting that social media _____ Which choice most logically completes the text?", "choices": {"A": "is more useful for studying informal language than for studying formal or official language.", "B": "appears to be exerting an exceptionally strong influence on the evolution of Bahasa Indonesia.", "C": "may give linguists a somewhat misleading sense of how languages are changing.", "D": "does not merely register changes in language usage but can facilitate such changes."}, "correct": "D", "rationale": "Choice D is the best answer because it most logically completes the text’s discussion of linguists using social media to study changes in\nlanguage usage in real time, providing the specific example of the affix meng- in Bahasa Indonesia. The text states that linguists first observed\nmeng- being used as an onomatopoeic tag on social media, which then spread to being affixed to existing words in text posted on social media;\nfrom there, it has begun to move into spoken Bahasa Indonesia. As presented in the text, this progression from online usage to spoken language\nsuggests that social media does more than just register or reflect changes in language—it can actively drive such changes. In the case of meng-,\nthe text suggests, social media facilitated the movement of the affix from an online tag to part of spoken Bahasa Indonesia.\nChoice A is incorrect because the text doesn’t differentiate between social media’s usefulness for studying informal versus formal or official\nlanguage; it merely notes that Bahasa Indonesia is an official language. Choice B is incorrect because while the example given in the text\nfocuses on changes in Bahasa Indonesia, the text doesn’t provide any evidence that social media is exerting an exceptionally strong influence on\nthe evolution of this particular language compared to others. In fact, the text states that \"linguists have noted many similar examples of this\nphenomenon occurring in other languages,\" suggesting that social media’s influence is evident across multiple languages and not unique to\nBahasa Indonesia. Choice C is incorrect because the text never suggests that social media provides a somewhat misleading sense of how\nlanguages are changing. Rather, the text suggests that by allowing linguists to directly observe linguistic changes, social media offers a clear\nwindow into language evolution."}, {"id": "45c03837", "skill": "Inferences", "difficulty": "Hard", "question": "Outi Tervo and team studied the effect of human-caused noise on narwhals (Monodon monoceros), arctic marine mammals that are sensitive to acoustic changes in their environment. Hypothesizing that elevated sound levels affect foraging among narwhals, Tervo’s team compared narwhal diving behaviors in natural sound conditions with those behaviors in two human-caused sound exposure conditions—ship sounds and ship sounds coupled with sonic pulses. Both exposure conditions resulted in significant decreases in the number and target depth of deep dives (associated with foraging) relative to natural conditions. However, differences between diving behaviors in the two exposure types were negligible, a finding that could be attributed to the fact that _____ Which choice most logically completes the text?", "choices": {"A": "sonic pulses can be heard at significantly greater ocean depths than ship sounds can.", "B": "ship sounds contribute so much to the overall sound level that the addition of sonic pulses has little effect on the narwhals’ auditory environment.", "C": "narwhals forage at shallower depths in the presence of ship sounds alone than in the presence of ship sounds coupled with sonic pulses.", "D": "the narwhals weren’t as sensitive to human-caused sounds as the researchers had predicted."}, "correct": "B", "rationale": "Choice B is the best answer because it most logically completes the text’s discussion of human-caused noise and narwhal behavior. The text\nestablishes that Outi Tervo and team found that while both ship sounds alone and ship sounds coupled with sonic pulses significantly affected\nnarwhal foraging behaviors compared to natural conditions, there were negligible differences between the narwhals’ responses to the two sound\nexposure types (a somewhat surprising finding because one might expect that adding sonic pulses would have an even greater impact). It\nlogically follows that if ship sounds are already so loud that adding sonic pulses to them doesn’t substantially increase the level of human-\ncaused sound exposure, the two conditions would produce essentially the same behavioral responses because the additional sonic pulses are\nessentially irrelevant.\nChoice A is incorrect because the fact that sonic pulses are audible at greater depths than are ship sounds would be more likely to help explain a\ndifference—not a similarity—in how the narwhals responded to the two types of sound exposure. If at some points during the study the narwhals\nwere at depths where only sonic pulses (but not ship sounds) could be heard, then they might be expected to alter their diving behavior more\ndramatically in response to those pulses. But since the text reports negligible differences between diving behaviors in the two exposure types,\nthe fact that sonic pulses reach greater depths than do ship sounds has little explanatory power in this context. Choice C is incorrect because\nthe idea that the narwhals foraged at shallower depths in one of the two exposure conditions directly contradicts the information given in the\ntext. The text states that there were negligible differences in the narwhals’ diving behaviors between the two conditions, meaning that the\nbehaviors were essentially the same. Choice D is incorrect. Although the text states that two conditions with human-caused sounds (ship sounds\nalone and ship sounds coupled with sonic pulses) had essentially the same effect on narwhals’ deep dives, this indicates only that sonic pulses\ndidn’t meaningfully change the effect of ship sounds, not that the narwhals were less sensitive to human-caused sounds than predicted. Indeed,\nthe text makes it clear that the sounds significantly altered the narwhals’ behavior."}, {"id": "2398ffbf", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Archaeologist Weiwei Wang and her colleagues analyzed footed grinding slabs and other food-preparation tools excavated from Óc Eo, a Southeast Asian port city that flourished between the first and sixth centuries CE. Wang and colleagues recovered microscopic remnants of turmeric and other spices from the surfaces of the tools. Turmeric is native to South Asia, more than a thousand miles west of Óc Eo, and the researchers showed that the footed grinding slabs at Óc Eo are very similar to footed grinding slabs common throughout South Asia from around 500 BCE to 300 CE. Wang and colleagues’ findings therefore indicate that there must have been a trade link, whether direct or indirect, between the two regions. Which finding, if true, would directly weaken the conclusion about Wang and her colleagues’ findings that is presented in the text?", "choices": {"A": "Some of the spices recovered from Óc Eo are native to the Maluku Islands, which are located approximately 2,000 miles southeast of Óc Eo.", "B": "In the first through third centuries CE, there was a significant migration of people from South Asia to Southeast Asia.", "C": "Other types of artifacts originating in South Asia and dating to the first through sixth centuries CE have been found throughout Southeast Asia.", "D": "The people of Óc Eo and several communities in South Asia regularly traded with people in the region that is now the Southeast Asian country of Malaysia no later than the first century CE."}, "correct": "B", "rationale": "Choice B is the best answer because it presents a finding that, if true, would most directly weaken the conclusion that Wang and colleagues’\nfindings indicate a trade link between Óc Eo and South Asia. The text explains that turmeric (native to South Asia) and footed grinding slabs of a\nstyle common in South Asia between roughly 500 BCE and 300 CE were found at Óc Eo, a Southeast Asian port that flourished between the first\nand sixth centuries CE. From this evidence, the text concludes that these items must have reached Óc Eo through trade. If, however, there was a\nsignificant migration of people from South Asia to Southeast Asia during the first through third centuries CE, that would offer an alternative\nexplanation: South Asian people could have brought turmeric and grinding slabs with them when they migrated. Thus, the finding would weaken\nthe conclusion that trade must account for the items’ presence at Óc Eo.\nChoice A is incorrect. A finding involving spices from a different region—the Maluku Islands, southeast of Óc Eo—wouldn’t undermine the\nconclusion because it wouldn’t reveal how the items from South Asia, a region to the west, reached Óc Eo. If anything, such a finding might be\nfurther evidence of broad trade networks involving Óc Eo. Choice C is incorrect. If it were true that other South Asian artifacts from the period\nwhen Óc Eo flourished have been found throughout Southeast Asia, that would suggest only that South Asian items other than turmeric and\nfooted grinding slabs were present in the region at the time; it wouldn’t reveal anything about how any of those items reached Southeast Asia\nfrom South Asia. If anything, the widespread presence of South Asian artifacts in Southeast Asia during this period could be seen as further\nsupport for a trade network connecting the regions. Choice D is incorrect because the finding that Óc Eo and some South Asian communities\ntraded with people in another Southeast Asian location (what is now Malaysia) would suggest that this location could have been an intermediary\nfor the movement of items from South Asia to Óc Eo. Such a finding would support, not weaken, the plausibility of an indirect trade link that’s\npresented in the conclusion."}, {"id": "e9521fd1", "skill": "Inferences", "difficulty": "Hard", "question": "The Uto-Aztecan language family is divided into a northern branch, which includes the Shoshone language of present-day Idaho and Utah, and a southern one, whose best-known representative is Nahuatl, the language of the Aztec Empire in Mexico. Lexical similarities across the family, including of botanical terms, confirm descent from a single language spoken millennia ago, and the family’s geographical distribution suggests an origin in what is now the US Southwest. However, vocabulary pertaining to maize isn’t shared between northern and southern branches, despite the crop’s universal cultivation among Uto-Aztecan tribes. Given archaeological evidence that maize originated in Mexico and diffused northward into what became the US Southwest, some linguists reason that _____ Which choice most logically completes the text?", "choices": {"A": "northern Uto-Aztecan tribes likely obtained the crop directly from a southern Uto-Aztecan tribe rather than from a non-Uto-Aztecan tribe.", "B": "variation in maize-related vocabulary within each branch of the Uto-Aztecan family likely reflects regionally specific methods for cultivating the crop.", "C": "southern Uto-Aztecan tribes likely acquired maize at roughly the same time as northern Uto-Aztecan tribes did, though from different sources.", "D": "the family’s division into northern and southern branches likely preceded the acquisition of the crop by the Uto-Aztecan tribes."}, "correct": "D", "rationale": "Choice D is the best answer because it most logically completes the discussion of Uto-Aztecan languages. The text explains that the northern\nand southern branches of the Uto-Aztecan language family descended from a single language (believed to have originated in what is now the US\nSouthwest), resulting in similarities across the family’s languages; however, the branches don’t have similar vocabulary for maize, even though\nmaize has been cultivated by all Uto-Aztecan tribes. The text also indicates that maize originated in Mexico and spread northward into what is\nnow the US Southwest—the area where the Uto-Aztecan language family originated. It follows, then, that the language family had already divided\ninto northern and southern branches before maize reached that area; if maize had been present before the division occurred, the family’s origin\nlanguage would have had terminology for it that likely would have been reflected in the branches, meaning they would have had similar\nvocabulary for maize. If maize arrived after the division occurred, however, the tribes in the two regions likely would have developed vocabulary\npertaining to maize separately, at the times when they acquired the crop.\nChoice A is incorrect because the text focuses on vocabulary pertaining to maize in the branches of the Uto-Aztecan language family, and\nreferring only to how some Uto-Aztecan tribes obtained maize wouldn’t directly address the role of language. Moreover, if northern Uto-Aztecan\ntribes had acquired maize from a southern Uto-Aztecan tribe, it’s reasonable to assume that the northern tribes might have also picked up\nsouthern Uto-Aztecan terminology for maize in that exchange. Choice B is incorrect because the text discusses the fact that the northern and\nsouthern branches of the Uto-Aztecan language family don’t have shared vocabulary pertaining to maize, not the idea that there are variations in\nsuch vocabulary within each branch—that is, the text focuses on differences between the two branches, not on differences between languages\nwithin a branch. Choice C is incorrect because the text focuses on vocabulary pertaining to maize in the branches of the Uto-Aztecan language\nfamily, and referring only to the timing and source of maize acquisition wouldn’t directly address the role of language. Furthermore, the text\nimplies that southern Uto-Aztecan tribes probably acquired maize before the northern tribes did, given the evidence that maize originated in\nMexico—the location of the best-known representative of the southern branch of the Uto-Aztecan language family—before spreading to the\nnorth."}, {"id": "82bdf676", "skill": "Command of Evidence", "difficulty": "Hard", "question": "100 75 50 25 0 erocs ytilibakil-etadidnaC )elbakil erom = erocs rehgih( Participants’ Likability Ratings for Candidates by Candidates’ Traits and Participants’ Ignoble-Trait Scores 1 2 3 4 5 6 7 Ignoble-trait scores of participants admirable-trait candidates ignoble-trait candidates Alessandro Nai et al. presented study participants with vignettes about fictive political candidates, portraying them as embodying a personality trait widely considered admirable (e.g., agreeableness) or one considered ignoble (e.g., cynicism). A survey recorded participants’ ratings of the candidates’ likability and showed that across participants, ignoble-trait candidates were less likable than admirable-trait candidates. However, when the researchers factored in the participants’ own personality-trait scores, on a scale of 1 (least ignoble) to 7 (most ignoble), they concluded that this relative ranking of candidates persisted except among the participants with high ignobility scores. Which choice best describes data from the graph that support the researchers’ conclusion?", "choices": {"A": "There was a strong positive correlation between participants’ ignobility scores and admirable-trait candidates’ likability ratings, but there was no correlation between ignobility scores and ignoble-trait candidates’ likability ratings.", "B": "Participants with an ignobility score of 5 or less rated admirable-trait candidates as more likable than ignoble-trait candidates, whereas participants with an ignobility score of 6 or more rated ignoble-trait candidates as equally likable as or even more likable than admirable-trait candidates.", "C": "Overall, participants rated admirable-trait candidates as quite likable, and that rating was not significantly affected by the participants’ ignobility scores.", "D": "Unlike participants with an ignobility score of 6, participants with an ignobility score either greater or less than 6 gave admirable-trait candidates and ignoble-trait candidates different likability ratings."}, "correct": "B", "rationale": "Choice B is the best answer because it describes data from the graph that support the researchers’ conclusion that the trend of admirable-trait\ncandidates being rated as more likable than ignoble-trait candidates held true when participants’ own personality-trait scores were factored in,\nexcept among participants with high ignobility scores. The values on the x-axis represent survey participants grouped by their own ignobility\nscores, from low ignobility (1) to high ignobility (7), while the values on the y-axis represent the likability scores given to the political candidates.\nThe graph shows that the full range of participants (from least to most ignoble) gave the admirable-trait candidates (represented by the line with\ntriangles) a likability rating of approximately 70 out of 100; that is, regardless of their own level of ignobility, participants generally found\nadmirable-trait candidates quite likable. However, the graph shows that participants varied in their views of ignoble-trait candidates (represented\nby the line with squares); likability ratings increased as the participants’ own ignobility scores increased. Participants with low to medium-high\nignobility scores (1 to 5) still rated the ignoble-trait candidates as less likable than the admirable-trait candidates, with all ratings falling below\napproximately 70, but participants with high ignobility scores (6 and 7) gave ratings equal to or higher than approximately 70. In other words, the\npreviously observed trend of ranking admirable-trait candidates as more likable than ignoble-trait candidates persisted for participants with low\nto medium-high ignobility but not for participants with high ignobility.\nChoice A is incorrect because it describes the opposite of what the graph shows. The graph shows a positive correlation between participants’\nignobility scores and ignoble-trait candidates’ likability ratings (as participants’ ignobility scores increased, so did their ratings for ignoble-trait\ncandidates’ likability) and no correlation between ignobility scores and admirable-trait candidates’ likability ratings (all participants gave\nadmirable-trait candidates a rating of approximately 70 out of 100). Choice C is incorrect. The graph does show that regardless of their own\nignobility scores, participants rated admirable-trait candidates as quite likable (a rating of approximately 70 out of 100). However, this doesn’t\nsupport the researchers’ conclusion because the conclusion has to do with how participants rated both types of candidates, not just the\nadmirable-trait ones; moreover, the conclusion is that relative ratings were actually affected by the participants’ ignobility scores. Choice D is\nincorrect. The graph does show that only participants with an ignobility score of 6 gave the same likability score to both admirable- and ignoble-\ntrait candidates while participants with other ignobility scores gave a different rating for each candidate, but this doesn’t support the researchers’\nconclusion. The conclusion isn’t just that participants gave different ratings to the two types of candidates—it’s that participants with low to\nmedium-high ignobility scores specifically gave higher likability ratings to admirable-trait candidates than to ignoble-trait candidates and that\nparticipants with high ignobility scores didn’t."}, {"id": "881ba6f1", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "Eighteenth-century economist Adam Smith is famed for his metaphor of the invisible hand, which he putatively used to illustrate a robust model of how individuals produce aggregate benefits by pursuing their own economic interests. Note “putatively”: as Gavin Kennedy has shown, Smith deploys this metaphor only once in his economic writings—to make a narrow point about the then-dominant economic theory of mercantilism— and it was largely ignored until some twentieth-century economists eager to secure an intellectual pedigree for their views elevated it to a fully- fledged paradigm. Which choice best states the main idea of the text?", "choices": {"A": "Although Smith is famed for his metaphor of the invisible hand, the metaphor was largely ignored until economists in the twentieth century came to realize that the metaphor was a robust model that anticipated their own views.", "B": "Some twentieth-century economists gave Smith’s metaphor of the invisible hand a significance it does not have in Smith’s work, but it is nevertheless a useful model of how individuals produce aggregate benefits by pursuing their own economic interests.", "C": "Smith’s metaphor of the invisible hand has been interpreted as a model of how individuals acting in their own interest produce aggregate benefits, but it was intended as a subtle critique of the economic theory of mercantilism.", "D": "The reputation of Smith’s metaphor of the invisible hand is not due to the importance of the metaphor in Smith’s work but rather to the promotion of the metaphor by some later economists for their own ends."}, "correct": "D", "rationale": "Choice D is the best answer because it most accurately states the main idea of the text. The text explains that economist Adam Smith’s famous\nmetaphor of the invisible hand was putatively
