ed far apart, participants judged the jewelry at Tiffany & Co. to be more valuable than the jewelry at Forever 21, but when jewelry was spaced close together, participants judged the jewelry at Tiffany & Co. to be less valuable than the jewelry at Forever 21."}, "correct": "A", "rationale": "Choice A is the best answer because it presents a finding that, if true, would support the text’s conclusion about the results of the experiment\nwith Tiffany & Co. and Forever 21. According to the text, Sevilla and Townsend found in several experiments that when products in a generic\nretail setting are displayed with a low product-to-space ratio (that is, with lots of space between them), consumers view those products as\nsignificantly more valuable than when the same products are displayed with a higher product-to-space ratio (less space between them). The text\nthen states that the results of an experiment specifically using the contexts of an inexpensive store (Forever 21) and an upscale one (Tiffany &\nCo.) suggest that an inexpensive store context may moderate, or lessen, that effect. If Sevilla and Townsend found that participants in the\nexperiment with Tiffany & Co. and Forever 21 judged the same jewelry items as substantially more valuable when there was lots of space\nbetween them than when there was little space between them in the upscale store (Tiffany & Co.) but judged the same jewelry items as only\nslightly more valuable when there was lots of space between them than when there was little space between them in the inexpensive store\n(Forever 21), that finding would demonstrate that increased space between products was associated with less of an increase in those products’\nperceived value at the inexpensive store than at the upscale store. Thus, the finding would support the text’s conclusion that a store context\nassociated with inexpensive goods moderates the effect Sevilla and Townsend observed in their earlier experiments.\nChoice B is incorrect because if Sevilla and Townsend found that at both upscale and inexpensive stores, participants judged jewelry spaced far\napart to be less valuable than jewelry spaced close together, that would show the opposite of the effect the researchers observed in their earlier\nexperiments, not show that an inexpensive store context merely moderates, or lessens, that effect. Choice C is incorrect because this finding\nwouldn’t show that the effect Sevilla and Townsend observed in their initial experiments (that products spaced far apart were perceived as more\nvaluable than the same products spaced close together) is present but lessened in inexpensive retail contexts, as the text suggests. The\nconclusion in the text rests on determining the difference in jewelry items’ perceived value between two spacing conditions within each store and\nthen comparing the difference for the inexpensive store (Forever 21) to the difference for the upscale store (Tiffany & Co.); a finding that\n\ncompares perceptions of the jewelry items’ value between the two stores but for only one type of spacing condition at a time wouldn’t provide\ninformation about the degree of difference between spacing conditions within each type of store context. Choice D is incorrect because this\nfinding wouldn’t show that the effect Sevilla and Townsend observed in their initial experiments (that products spaced far apart were perceived\nas more valuable than the same products spaced close together) is present but lessened in inexpensive retail contexts, as the text suggests. The\nconclusion in the text rests on determining the difference in jewelry items’ perceived value between two spacing conditions within each store and\nthen comparing the difference for the inexpensive store (Forever 21) to the difference for the upscale store (Tiffany & Co.); a finding that\ncompares perceptions of the relative value of jewelry items between the two stores and for only one type of spacing condition at a time wouldn’t\nprovide information about the degree of difference between spacing conditions within each type of store context."}, {"id": "45f66433", "skill": "Inferences", "difficulty": "Hard", "question": "While mammals collectively exhibit the highest ratio of brain size to body size among vertebrates, a team led by paleontologist Ornella Bertrand demonstrates that for ten million years following the extinction of dinosaurs, that ratio in fact shrank for mammals as they evolved to fill newly vacated ecological niches and their bodies increased in size more rapidly than their brains. Competition for resources tends to favor intelligence and thus large, complex brains, but during this period, the abundance of resources relative to mammalian population numbers likely moderated competition and facilitated an increase in body size. Bertrand and her team reason that as population numbers swelled, competition intensified, creating conditions that _____ Which choice most logically completes the text?", "choices": {"A": "heightened the advantage that large body size conferred on mammals in certain ecological niches.", "B": "restricted resources so drastically that mammals struggled to secure enough food to maintain large brain sizes.", "C": "favored an evolutionary increase in brain size relative to body size among mammals.", "D": "encouraged mammals with large brain sizes to adapt to a range of ecological niches."}, "correct": "C", "rationale": "Choice C is the best answer because it most logically completes the text’s discussion of the evolution of mammalian brain-to-body size ratios.\nAs the text explains, mammals evolved to fill ecological niches left vacant by the dinosaurs’ extinction, and for the next ten million years, brain-to-\nbody size ratios among mammals shrank as their bodies grew more rapidly than their brains. This decline was a natural outcome of resource\nabundance since increased competition for resources tends to favor intelligence and large brains, while decreased competition conversely\nfavors large body size. Later, mammalian population sizes “swelled,” resulting in intensified competition—that is, a decrease in the abundance of\nresources relative to population sizes. Given the relationship established between resource availability and the ratio of brain size to body size, it\ncan be inferred that around ten million years after the dinosaurs’ extinction, ecological conditions favored an evolutionary increase in brain size\nrelative to body size among mammals—a reversal of the previous trend.\nChoice A is incorrect because, as the text explains, competition for resources tends to favor intelligence and large brains, not large body size.\nThus, when mammalian population sizes swelled and competition among mammals intensified, the result would have been a decrease, not an\nincrease, in the advantage that large body size conferred on mammals in certain ecological niches. Choice B is incorrect because the text frames\ncompetition for resources as a selective pressure favoring intelligence and brain size relative to body size. Thus, even if competition among\nmammals resulted in resource deprivation, these conditions would have favored adaptation toward larger brain-to-body size and consequently\ngreater intelligence to compete more effectively for decreased resources. Choice D is incorrect. The period when mammals adapted to a range\nof ecological niches that is under discussion in the text is the ten million years immediately following the dinosaurs’ extinction, when competition\nfor resources was low. Moreover, the text explains that increased competition tends to favor brain size, while decreased competition tends to\nfavor body size. Thus, when competition increased, the logical outcome would have been an increase in brain size relative to body size among\nmammals, not a dispersal of large-brained mammals into new ecological niches, which the text states had already occurred under the very\ndifferent conditions of low competition."}, {"id": "e503ae04", "skill": "Inferences", "difficulty": "Hard", "question": "With the ongoing expansion of e-commerce, consumers are expecting faster and faster delivery of goods, but delivery companies continue to struggle with last-mile logistics (the final step in delivery to consumers) due to challenges such as complex and inefficient delivery routes. Innovations to mitigate these challenges have been emerging—the use of aerial drones, for example—but these innovations tend to engender their own complications (e.g., regulations on the use of drones in residential airspace), leading researchers to conclude that _____ Which choice most logically completes the text?", "choices": {"A": "consumers’ expectations for reduced delivery times may be outstripping what is viable for delivery companies to provide.", "B": "a better understanding of consumers’ expectations for delivery is needed so that companies can better plan for fluctuations in delivery volume.", "C": "rapid delivery is a leading factor in consumer satisfaction, and therefore delivery companies would benefit from investing resources in reducing delivery times.", "D": "there may not be sufficient incentive for delivery companies to attempt to solve the problems associated with last-mile logistics."}, "correct": "A", "rationale": "Choice A is the best answer because it most logically completes the text’s discussion of consumer expectations and the struggles delivery\ncompanies face. The text states that while consumers expect ever-faster delivery of goods, delivery companies \"continue to struggle with last-\nmile logistics.\" The text further explains that innovations aimed at addressing this challenge have a tendency to cause complications of their\nown. Because escalating consumer demands for speed are paired with persistent, complex delivery obstacles and new problems arising from\nattempted solutions, it logically follows that consumer expectations for delivery times may be exceeding what companies can feasibly provide.\nChoice B is incorrect because the text doesn’t address the idea of delivery volumes at all and makes it clear that companies are already aware of\nand trying to address consumers’ expectations for delivery. Further, the challenge presented at the end of the text relates to new problems that\ntend to arise with solutions for logistical problems, not to a lack of understanding of what consumers want or how delivery volumes fluctuate.\nChoice C is incorrect. The text does suggest that rapid delivery is important for customer satisfaction and thus is a beneficial investment for\ncompanies, but that idea is already presented in the beginning of the text and doesn’t logically follow as a conclusion from the information about\ninnovations companies are exploring to solve last-mile logistics problems; the idea that the potential solutions tend to introduce new issues\npoints to the feasibility of meeting consumer expectations, not to the general fact that it would be beneficial to reduce delivery times. Choice D is\nincorrect because the text doesn’t suggest that there may be insufficient incentive for delivery companies to try to solve last-mile logistics\nproblems—on the contrary, the text directly indicates that delivery companies are already actively pursuing innovations to try to address those\nproblems, citing the example of the use of aerial drones, even though the innovations can introduce new complications."}, {"id": "a3fb5e77", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "Some animal-behavior studies involve observing wild animals in their natural habitat, and some involve capturing wild animals and observing them in a laboratory. Each approach has advantages over the other. In wild studies, researchers can more easily presume that the animals are behaving normally, and in lab studies, researchers can more easily control factors that might affect the results. But if, for example, the results from a wild study and a lab study of Western scrub-jays (Aphelocoma californica) contradict each other, one or both of the studies must have failed to account for some factor that was relevant to the birds’ behavior. Which choice best states the main idea of the text?", "choices": {"A": "When the results of a natural-habitat study and those from a lab study of a wild animal such as the Western scrub-jay conflict, the study in the natural habitat is more likely than the lab study to have accurate results.", "B": "Studying wild animals such as the Western scrub-jay in both their natural habitat and lab settings is likely to yield conflicting results that researchers cannot fully resolve.", "C": "Wild animals such as the Western scrub-jay can be effectively studied in their natural habitat and in the lab, but each approach has drawbacks that could affect the accuracy of the findings.", "D": "Differing results between natural-habitat and lab studies of wild animals such as the Western scrub-jay are a strong indication that both of the studies had design flaws that affected the accuracy of their results."}, "correct": "C", "rationale": "Choice C is the best answer because it most accurately states the main idea of the text. The text begins by explaining that wild animals can be\nstudied in their natural habitat or in a laboratory setting, with each setting offering unique advantages to researchers. The text then highlights an\ninstance in which Western scrub-jays were studied in both settings but with conflicting results, indicating that one or both studies may have\nfailed to account for the disadvantages of its research setting. Thus, the main idea of the text is that while wild animals can be effectively studied\nin natural or lab settings, there are drawbacks to each that need to be considered to ensure accurate results.\nChoice A is incorrect because the text does not position one study setting (natural or lab) as superior to the other; rather, the text states that\neach one has advantages over the other. Choice B is incorrect. The text provides a hypothetical example of two studies in different environments\nwith conflicting results, but this single example cannot be extrapolated to a general claim about the likelihood that results of studies in different\nenvironments will conflict. Additionally, the text does not assert anything about how researchers can or cannot resolve conflicting study results.\nChoice D is incorrect because the text does not state that discrepancies between natural-habitat and lab-based animal behavior studies are due\nto both of the designs being flawed. Rather, the text states that the conflict in results can be the consequence of one or both of the studies\nhaving failed to account for some factor."}, {"id": "4fc9a13a", "skill": "Command of Evidence", "difficulty": "Hard", "question": "The novelist Toni Morrison was the first Black woman to work as an editor at the publishing company Random House, from 1967 to 1983. A scholar asserts that one of Morrison’s likely aims during her time as an editor was to strengthen the presence of Black writers on the list of Random House’s published authors. Which finding, if true, would most strongly support the scholar’s claim?", "choices": {"A": "The percentage of authors published by Random House who were Black rose in the early 1970s and stabilized throughout the decade.", "B": "Black authors who were interviewed in the 1980s and 1990s were highly likely to cite Toni Morrison’s novels as a principal influence on their work.", "C": "The novels written by Toni Morrison that were published after 1983 sold significantly more copies and received wider critical acclaim than the novels she wrote that were published before 1983.", "D": "Works that were edited by Toni Morrison during her time at Random House displayed stylistic characteristics that distinguished them from works that were not edited by Morrison."}, "correct": "A", "rationale": "Choice A is the best answer because it presents a finding that, if true, would support the scholar’s claim about Toni Morrison’s likely goal of\nstrengthening the presence of Black writers on Random House’s list of published authors. The text explains that Morrison was the first Black\nwoman to be an editor for Random House and that she was an editor there from 1967 to 1983. If it were true that Random House published a\nhigher percentage of works by Black authors throughout the 1970s—during most of Morrison’s time working there—than it had previously\npublished, that would suggest that Morrison may have made a deliberate effort to strengthen the presence of Black authors on the list of\nRandom House’s published authors, thus supporting the scholar’s claim.\nChoice B is incorrect because the scholar’s claim is about Morrison’s work as an editor at a publishing company and her likely effort to\nstrengthen the presence of Black writers on that company’s list of published authors. It might be true that Black authors interviewed in the 1980s\nand 1990s often cited Morrison’s novels as an influence on their work, but that finding would simply suggest something about how those authors\napproached their work; it wouldn’t show that Morrison intended to increase the number of Black writers among the published authors specifically\nat Random House. Choice C is incorrect because the scholar’s claim is about Morrison’s work as an editor at a publishing company, not about\nher work as a novelist. Therefore, a finding that Morrison’s novels published after 1983 sold more copies and were more widely acclaimed than\nher earlier novels would have no bearing on the claim that as an editor Morrison made an effort to ensure that more Black writers were present\non Random House’s list of published authors. Choice D is incorrect. Although the text discusses Morrison’s work as an editor at Random House,\nthe scholar’s claim focuses on Morrison’s likely effort in that role to increase the number of Black writers present on Random House’s list of\npublished authors, not on the influence she may have had on the content of the works she edited. Without knowing whether Morrison’s stylistic\ninfluence led to more publications or if Morrison applied her influence specifically to works by Black writers, the finding that works edited by\nMorrison could be identified by stylistic characteristics would have no bearing on the claim that Morrison intended to strengthen the presence of\nBlack writers among the published authors at Random House."}, {"id": "5d20f560", "skill": "Inferences", "difficulty": "Hard", "question": "Conventional theories of rhetoric hold that presenting information as coming from credentialed experts increases that information’s credibility. When communications researcher Sungkyoung Lee and her colleagues tested messages seeking volunteers for clinical trials, however, they found that participants in their study judged recruitment messages from former trial volunteers as significantly more credible than messages from doctors (i.e., credentialed experts). One reason for this may be that the doctors’ status as credentialed experts wasn’t ignored but rather was outweighed by participants’ views of the experiential relevance of the two types of messengers; that is, participants may have reacted the way they did because _____ Which choice most logically completes the text?", "choices": {"A": "messages from former trial volunteers depicted clinical trials as being more positive experiences than did messages from doctors.", "B": "participants did not have enough experience to evaluate the credibility of the doctors’ messages but did have enough experience to evaluate the credibility of former trial volunteers’ messages.", "C": "the fact that former trial volunteers went through the same experience that participants were contemplating while doctors did not was more important to participants than the doctors’ status as credentialed experts was.", "D": "participants regarded the experiences of both the doctors and former trial volunteers as relevant to the subject of clinical trials but were skeptical of the doctors’ status as credentialed experts."}, "correct": "C", "rationale": "Choice C is the best answer because it presents the conclusion that most logically follows from the text’s discussion of how participants\nconsidered messages from former trial volunteers and doctors. The text first establishes that information coming from credentialed experts\ntypically increases the credibility of that information. However, the text goes on to describe a situation that goes against this expectation: the\nmessages from previous trial volunteers were judged as more credible than the messages from licensed doctors when recruiting clinic trial\nparticipants. The text then goes on to speculate as to why this may have been the case, stating that participants likely considered the messages\nfrom the former trial volunteers to be more convincing than the messages from the doctors because the former trial volunteers were perceived\nas having undergone the same experience that the participants were considering. It is reasonable to infer, then, that participants regarded the\nformer trial volunteers’ direct experience as more important to their decision-making than the doctors’ status as credentialed experts.\nChoice A is incorrect because the text does not provide any indication as to the content or the tone of the messages provided by either the\ndoctors or the former trial volunteers regarding the clinical trials. Choice B is incorrect. Since the study participants had not themselves\nparticipated in the clinical trial, they could not rely on their experience to evaluate the credibility of either the former trial volunteers or the\ndoctors. Choice D is incorrect. While the text does establish that the participants likely considered the messages from both the doctors and the\nformer trial volunteers, it does not suggest that the participants doubted the doctors’ credentials. Rather, the text speculates that participants\nmay have given the experiences of the former trial volunteers more importance than the doctors’ credentials when considering the recruitment\nmessages."}, {"id": "cae97f58", "skill": "Inferences", "difficulty": "Hard", "question": "Mosses can struggle in harsh desert conditions because these plants require enough sunlight for photosynthesis but not so much that they risk drying out. Researchers Jenna Ekwealor and Kirsten M. Fisher found several species of Syntrichia caninervis, a type of desert moss, growing under quartz crystals in California’s Mojave Desert. To evaluate whether these semitransparent rocks benefited the moss, the researchers compared the shoot tissue, a measure of plant growth, of S. caninervis when growing on the soil surface versus when the moss was growing under the quartz rocks. They found that the shoot tissue was 62% longer for moss growing under the quartz as compared to moss on the soil surface, suggesting that _____ Which choice most logically completes the text?", "choices": {"A": "S. caninervis is one of the few types of moss that can survive under semitransparent rocks.", "B": "quartz crystals do not transmit the necessary sunlight for photosynthesis in S. caninervis.", "C": "S. caninervis growing under quartz crystals experience lower light intensity and are thus able to retain more moisture.", "D": "quartz crystals are capable of supporting S. caninervis growth if the crystals are not too thin."}, "correct": "C", "rationale": "Choice C is the best answer because it most logically completes the text. The text explains that while desert moss species need sufficient\nsunlight for photosynthesis, exposure to sunlight can also affect the plants negatively by drying them out. Ekwealor and Fisher’s team found\nspecimens of S. caninervis moss growing under quartz crystals that were semitransparent, allowing some but not all sunlight to pass through\nthem, and the shoot tissue of these specimens was longer than that of S. caninervis specimens found growing on the surface that were\nunprotected by such crystals. Since, as the text explains, the length of shoot tissue is an indicator of plant growth, and since greater exposure to\nsunlight results in greater loss of moisture, it can be inferred that S. caninervis growing under quartz crystals experience lower light intensity and\nare thus able to retain more moisture.\nChoice A is incorrect because the text doesn’t mention another moss species besides S. caninervis or discuss whether other such species are\nable to grow under transparent crystals, as S. caninervis is. Choice B is incorrect because, as the text explains, specimens of S. caninervis were\nfound growing under quartz crystals and exhibited more plant growth than specimens growing on the soil surface. This wouldn’t have been the\ncase if the crystals transmitted insufficient light for the moss’s photosynthesis. Choice D is incorrect. The text contrasts the growth of S.\ncaninervis specimens found beneath semitransparent quartz crystals with that of specimens found on the soil surface absent such crystals, but\nit doesn’t make a comparison among specimens growing beneath crystals of different degrees of thickness or consider how the relative\nthickness of the crystals affects the growth of the moss."}, {"id": "9c199797", "skill": "Command of Evidence", "difficulty": "Hard", "question": "The presence of other individuals of the same species has been observed to mitigate stress in highly social mammals. To investigate whether this phenomenon, known as social buffering, also occurs in reptiles, researchers led by Chelsea E. Martin monitored stress responses in wild southern Pacific rattlesnakes (Crotalus helleri) in three experimental treatments: when alone, with a rope, and with a companion C. helleri. The researchers compared the percent change between baseline and peak heart rate in response to a (harmless) disturbance, with higher values indicating higher stress levels. Which finding, if true, would most directly support the idea that social buffering occurs among C. helleri?", "choices": {"A": "The average percent change in heart rate was lower among C. helleri with a companion than among solitary C. helleri and C. helleri with a rope.", "B": "Average peak heart rates were highest among solitary C. helleri, but no differences were observed in average peak heart rates between C. helleri with a companion and C. helleri with a rope.", "C": "C. helleri with a companion displayed a lower average baseline heart rate and lower average peak heart rate than did solitary C. helleri or C. helleri with a rope.", "D": "Solitary C. helleri had higher average baseline heart rates than did C. helleri in the other treatments, but the average percent change in heart rate was smaller among solitary C. helleri than among C. helleri with a companion."}, "correct": "A", "rationale": "Choice A is the best answer because it presents a finding that, if true, would most directly support the idea that social buffering—the mitigation\nof stress by the presence of other animals of the same species—occurs among C. helleri. According to the text, the researchers quantified the\namount of stress in C. helleri as the percent change between baseline and peak heart rate, with higher values indicating greater stress. The text\nalso describes the researchers’ three treatments: snakes alone, snakes with a rope, and snakes with a companion C. helleri. If the average\npercent change in heart rate was lower among snakes with a companion than among either solitary snakes or snakes with a rope, that would\nindicate two things: snakes accompanied by a companion experienced less stress than they did when alone, and the reduction wasn’t simply the\nresult of any object being present, since the rope didn’t produce the same effect. Together, these results would directly support the conclusion\nthat the companion’s presence mitigated stress, as the social buffering hypothesis predicts.\nChoice B is incorrect because the finding compares peak heart rates among the three treatments rather than the percent change in heart rates\namong those treatments. The finding also indicates that snakes with a companion and snakes with a rope showed no differences in peak heart\nrates. If a rope produced the same effect as a companion did, that would suggest that the effect, whatever its extent, isn’t caused specifically by\nthe presence of another individual of the same species and so wouldn’t support the social buffering hypothesis. Choice C is incorrect because\nthe finding addresses absolute baseline and peak heart rates rather than the percent change between them, which is the measure of stress\nresponse the researchers used. Lower absolute heart rates in companion-present snakes could reflect a generally calmer state but wouldn’t\nshow that the stress response to the disturbance was reduced and so wouldn’t directly demonstrate social buffering as defined in the study.\nChoice D is incorrect because the finding states that the percent change in heart rate was smaller among solitary snakes than among snakes\nwith a companion, which would indicate a smaller stress response when alone. This pattern would directly contradict the social buffering\nhypothesis rather than support it. Furthermore, a comparison of baseline heart rates would be immaterial for determining whether social\nbuffering occurs among C. helleri because the text indicates that a change in heart rate, not average baseline heart rate, indicates a stress\nresponse."}, {"id": "8391a002", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Black beans (Phaseolus vulgaris) are a nutritionally dense food, but they are difficult to digest in part because of their high levels of soluble fiber and compounds like raffinose. They also contain antinutrients like tannins and trypsin inhibitors, which interfere with the body’s ability to extract nutrients from foods. In a research article, Marisela Granito and Glenda Álvarez from Simón Bolívar University in Venezuela claim that inducing fermentation of black beans using lactic acid bacteria improves the digestibility of the beans and makes them more nutritious. Which finding from Granito and Álvarez’s research, if true, would most directly support their claim?", "choices": {"A": "When cooked, fermented beans contained significantly more trypsin inhibitors and tannins but significantly less soluble fiber and raffinose than nonfermented beans.", "B": "Fermented beans contained significantly less soluble fiber and raffinose than nonfermented beans, and when cooked, the fermented beans also displayed a significant reduction in trypsin inhibitors and tannins.", "C": "When the fermented beans were analyzed, they were found to contain two microorganisms, Lactobacillus casei and Lactobacillus plantarum, that are theorized to increase the amount of nitrogen absorbed by the gut after eating beans.", "D": "Both fermented and nonfermented black beans contained significantly fewer trypsin inhibitors and tannins after being cooked at high pressure."}, "correct": "B", "rationale": "Choice B is the best answer because it presents a finding that would best support Granito and Álvarez’s claim that fermenting black beans\nmakes them easier to digest and more nutritious. The text indicates that high levels of soluble fiber and raffinose in black beans make the beans\nhard to digest and that tannins and trypsin inhibitors make it harder for the body to extract nutrients from the beans. If it were found that\nfermenting the beans significantly reduces their levels of soluble fiber, raffinose, trypsin inhibitors, and tannins when cooked, this would directly\nsupport the claim that fermentation improves the digestibility of the beans and makes them more nutritious.\nChoice A is incorrect because the text indicates that trypsin inhibitors and tannins interfere with the body’s ability to extract nutrients from black\nbeans; if fermentation and cooking were found to increase these antinutrients, fermented beans would likely be less nutritious than unfermented\nones, not more nutritious (as Granito and Álvarez claim). Choice C is incorrect because the text doesn’t address the idea that greater nitrogen\nabsorption in the gut has an effect on a food’s digestibility or level of nutrition, so the discovery of the presence of microorganisms that may\nincrease nitrogen absorption wouldn’t provide relevant support for the claim that fermentation makes black beans easier to digest and more\nnutritious. Choice D is incorrect because Granito and Álvarez’s claim focuses on the effect of fermenting black beans, but the finding that\nnonfermented black beans also have fewer trypsin inhibitors and tannins when cooked at high pressure would suggest that the role of the\ncooking method could be significant when it comes to nutrition; further, the finding wouldn’t address the beans’ digestibility."}, {"id": "65502c46", "skill": "Inferences", "difficulty": "Hard", "question": "In a 2017 article, historian Jasmine Kilburn-Toppin explains that in early modern London, members of the city’s guilds (trade and artisanal associations) were participants in a civic culture in which gift giving both signaled and conferred social status. Research on this phenomenon has tended to focus on philanthropic gifting by London’s largest guilds; for her part, Kilburn-Toppin focuses on the gifting of handmade objects and fixtures (such as decorative paneling or plasterwork) within the craft guilds, which were “composed of highly discerning producers and consumers of material cultures.” Given this characterization, it can reasonably be inferred that the gifting of such objects may have _____ Which choice most logically completes the text?", "choices": {"A": "ensured that knowledge of the materials and techniques used by members of the craft guilds stayed within the craft guilds.", "B": "emphasized ostentatious offerings in the case of the largest guilds and prosaic objects in the case of the craft guilds.", "C": "functioned as a way for craft guild members to maintain and enhance their professional reputations among their peers.", "D": "conferred greater social status when the recipient belonged to one of London’s largest guilds than when the recipient belonged to a craft guild."}, "correct": "C", "rationale": "Choice C is the best answer because it logically completes the text’s discussion of the role of gift giving among members of guilds in early\nmodern London. According to the text, members of these guilds participated in a culture where giving gifts \"both signaled and conferred social\nstatus\"—that is, it indicated people’s social standing and also gave them social standing—and occurred in the forms of both philanthropic gifting\n(donations for humanitarian purposes) by large guilds, which much research has focused on, and the gifting of handmade items between craft\nguild members, which Kilburn-Toppin focuses on. The text indicates that Kilburn-Toppin characterizes craft guild members as people who made\nand consumed items and were \"highly discerning,\" or were careful judges of quality. Because gift giving benefited one’s status and if craft guild\nmembers were particularly attentive to quality, it follows that gifting handmade items within the guilds—between people who had high standards\nfor items they made and for items they received—may have been a way for members to maintain and enhance their professional reputations, or\ntheir professional statuses, among their peers.\nChoice A is incorrect because the text emphasizes the idea that members of guilds participated in gift giving both to display and receive social\nstatus, suggesting that the gifting of handmade items between the \"highly discerning\" members of craft guilds had to do with the members’\ninterest in quality and status; nothing in the text suggests that the practice of gifting those items within the craft guilds was intended to limit\nknowledge of materials and techniques to the members of those guilds. Choice B is incorrect because the text doesn’t distinguish between\n\"ostentatious,\" or very showy, and \"prosaic,\" or ordinary, gifts and because the characterization at the end of the text pertains specifically to the\ngifting of handmade items indicative of great taste, not prosaic items, between members of craft guilds. And while the text indicates that\nLondon’s largest guilds gave philanthropic gifts (donations for humanitarian purposes), it doesn’t indicate whether these gifts would have been\nconsidered ostentatious. Choice D is incorrect because the characterization presented at the end of the text pertains specifically to the \"highly\ndiscerning\" members of craft guilds giving their handmade items as gifts to one another within the craft guilds; the text doesn’t suggest anything\nabout gifting those items to members of London’s largest guilds or how that might affect status differently from giving them to other craft guild\nmembers."}, {"id": "4987f743", "skill": "Command of Evidence", "difficulty": "Hard", "question": "ALSOL is a microcredit program in Mexico that makes small loans to female entrepreneurs who lack the collateral and credit history to secure financing from conventional banks. Borrowers use their business proceeds to repay loans in equal weekly installments and incur no penalty for missed payments other than lack of access to larger loans. Economists Gustavo Barboza and Sandra Trejos analyzed ALSOL data and found that rural borrowers, who mostly make and sell handicrafts, miss payments more often than urban borrowers do, partly because they sell their goods less frequently than they could. Barboza and Trejos claim that this behavior reflects strategic decisions that enable rural women to increase their profits per unit sold. Which finding, if true, would most directly support Barboza and Trejos’s claim?", "choices": {"A": "Many marketplaces require entrepreneurs to pay marketplace operators a fixed percentage of each day’s proceeds in exchange for permission to sell goods there.", "B": "Rural entrepreneurs can typically sell their goods for higher prices in cities than in their home areas, but the number of people selling competing goods tends to be higher in cities.", "C": "Due to the lower costs they incur, rural entrepreneurs tend to require smaller initial loans than urban entrepreneurs do.", "D": "The cost to rural entrepreneurs to bring their goods to towns with marketplaces is high but largely independent of the number of goods they bring."}, "correct": "D", "rationale": "Choice D is the best answer because it presents a finding that, if true, would most directly support Barboza and Trejos’s claim that rural female\nentrepreneurs who have received small loans from ALSOL are strategic in selling their goods less frequently than they could, even if it means\nmissing payments. The text explains that borrowers in the ALSOL program use proceeds from their businesses to repay loans in equal weekly\npayments, with almost no penalty for missed payments. According to the text, Barboza and Trejos found that rural borrowers miss weekly\npayments in part because they don’t sell their goods as often as they could, a move the researchers claim allows the entrepreneurs to help\nincrease profits for the goods they sell. Finding that the cost of bringing goods to towns with marketplaces is high for rural entrepreneurs but is\nlargely independent of how many goods are brought would support the researchers’ claim: traveling to marketplaces less frequently would mean\nthat a rural entrepreneur spends less on travel overall, and taking a large load of goods to a marketplace for essentially the same cost as taking a\nsmall load would allow the entrepreneur to more substantially offset the cost of travel with greater overall sales at the marketplace, resulting in\nmore profit per good sold—even if those profits are earned less frequently and don’t support weekly loan payments.\nChoice A is incorrect because the finding that many marketplaces require entrepreneurs to pay the operators of the marketplace a fixed\npercentage of proceeds to be able to sell goods there wouldn’t explain why rural entrepreneurs strategically choose to sell their goods less\nfrequently than they could in order to increase their profits per unit sold. With a fixed percentage of proceeds due to operators, the amount\nentrepreneurs have to pay operators would also be fixed regardless of frequency of selling. Choice B is incorrect because the finding that rural\nentrepreneurs can usually sell their goods for higher prices in cities than in their local areas but also face higher competition to sell goods in\ncities wouldn’t explain why rural entrepreneurs strategically choose to sell their goods less frequently than they could in order to increase their\nprofits per unit sold. This is because both the higher prices and higher competition in cities would be stable factors—meaning there would be no\nclear reason for the rural entrepreneurs not to take every available chance to sell their goods in cities and to instead sell their goods in cities only\nsometimes. Choice C is incorrect because the finding that rural entrepreneurs have lower costs and thus tend to require smaller initial loans than\nurban entrepreneurs do has no bearing on rural borrowers strategically choosing to sell their goods less frequently than they could specifically to\n\nincrease their profits per unit sold. The cost of producing goods doesn’t depend on the frequency with which an entrepreneur sells those goods,\nso lower frequency alone wouldn’t affect profits, and the initial loan amount is set and has nothing to do with how much profit is earned from\neach sale."}, {"id": "9869c261", "skill": "Inferences", "difficulty": "Hard", "question": "Data collected by the Mars rover Curiosity at the Gale Crater’s Murray Formation are suggestive of hydrological deposition of sediment in the distant past. To characterize the nature of the depositional environment, Frances Rivera-Hernández et al. analyzed the grain size of Murray Formation sediment, finding that although there are intervals of coarse grains, most of the sediment consists of fine grains that show signs of cracking due to episodic desiccation. Rivera-Hernández et al. concluded that the coarse grains are sandstone, which tends to be deposited by flowing water, whereas the fine grains are mudstone, which is slowly deposited by settling out of suspension in low-flow water, leading the researchers to posit that _____ Which choice most logically completes the text?", "choices": {"A": "although the area of the Murray Formation experienced a prolonged period of dryness that prevented a lake from forming, water flowing from a distant source was present.", "B": "a lake existed at the Murray Formation for a prolonged period, though the lake occasionally experienced drying and there were periods in which one or more streams were present.", "C": "one or more streams existed at the Murray Formation for an extended period until being replaced by a lake that persisted for only a brief period before permanently drying.", "D": "a stream-fed lake was present at the Murray Formation for an extended period, and although the streams experienced occasional drying, the lake did not."}, "correct": "B", "rationale": "Choice B is the best answer because it most logically completes the text’s discussion of the sediments found at the Gale Crater’s Murray\nFormation on Mars. The text states that data gathered by the Curiosity rover suggest that bodies of water deposited sediment on Mars’s surface\nlong ago. The text goes on to say that studying the sediment, Rivera-Hernández et al. found some coarse grains they believe are sandstone,\nwhich tends to be left by flowing water, and many more fine grains they believe are mudstone, which tends to slowly sink in low-flow water. The\ntext further indicates that the researchers noted cracks in the fine grains that suggest there were cycles of desiccation, or drying, at the site.\nTaken together, this information suggests that a lake (a body of low-flow water) existed at the site for a prolonged period but occasionally\nexperienced drying and that there were periods in which one or more streams (flowing water) were present, since the extended existence of a\nlake would account for the abundance of fine grains, periods of drying would account for the cracks in the fine grains, and periods with streams\nwould account for the sections of coarse grains.\nChoice A is incorrect because the text indicates that an abundance of fine grains of sediment was found at the Murray Formation site, which\nsuggests that a low-flow water source (such as a lake) was present. Further, the text makes no mention of where the water at the site may have\noriginated from. Choice C is incorrect because the evidence described in the text doesn’t support the idea that there were streams at the Murray\nFormation for an extended period and a lake for just a short time. The abundance of fine grains suggests that a lake (a body of low-flow water)\nwas present for an extended time, not just a short time, and the sections of coarse grains suggest that one or more streams (bodies of flowing\nwater) were intermittently present while the lake existed, not at a separate time. Choice D is incorrect. Although the text suggests that both a low-\nflow body of water (such as a lake) and flowing water (such as streams) existed at the Murray Formation site, meaning that there could have\nbeen a stream-fed lake, the text explains that the fine grains that signify the presence of a lake exhibit cracking that indicates periods of\ndesiccation, or drying, which suggests that a lake was present but did occasionally dry out."}, {"id": "124fdcd7", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Many archaeologists will tell you that categorizing excavated fragments of pottery by style, period, and what objects they belong to relies not only on standard criteria, but also on instinct developed over years of practice. In a recent study, however, researchers trained a deep-learning computer model on thousands of images of pottery fragments and found that it could categorize them as accurately as a team of expert archaeologists. Some archaeologists have expressed concern that they might be replaced by such computer models, but the researchers claim that outcome is highly unlikely. Which finding, if true, would most directly support the researchers’ claim?", "choices": {"A": "In the researchers’ study, the model was able to categorize the pottery fragments much more quickly than the archaeologists could.", "B": "In the researchers’ study, neither the model nor the archeologists were able to accurately categorize all the pottery fragments that were presented.", "C": "A survey of archaeologists showed that categorizing pottery fragments limits the amount of time they can dedicate to other important tasks that only human experts can do.", "D": "A survey of archaeologists showed that few of them received dedicated training in how to properly categorize pottery fragments."}, "correct": "C", "rationale": "Choice C is the best answer because it presents a finding that, if true, would support the researchers’ claim that archaeologists are unlikely to be\nreplaced by certain computer models. The text explains that although archaeologists hold that categorizing pottery fragments relies on both\nobjective criteria and instinct developed through direct experience, researchers have found that a computer model can categorize the fragments\nwith the same degree of accuracy as the humans can—a finding that has caused some archaeologists to worry that their own work won’t be\nneeded any longer. If survey results indicate that categorizing pottery fragments limits the amount of time ccurrence of blue head plumage in adult female jacobins is driven by one or more factors not associated with mate attraction.", "D": "coloration prevents green-feathered adult female jacobins from distinguishing between adult males and blue-feathered adult females."}, "correct": "C", "rationale": "Choice C is the best answer because it most logically completes the text’s discussion of researchers’ observations of white-necked jacobin\nhummingbird females that retain blue head plumage into adulthood. The text indicates that even though adult males show a clear preference in\nmate selection for adult females with drab green feathers, a significant percentage of adult females (28%) retain blue head plumage. Critically,\nthe text also notes that the mating advantage conferred on adult females by green head plumage is offset by the fact that when competing for\nresources, adult males behave more antagonistically toward green-feathered adult females than toward blue-feathered ones. Given this\ndiscrepancy in the males’ behavior, it is reasonable to hypothesize that the occurrence of blue head plumage in adult females is driven by factors\nnot associated with mate attraction—specifically, reduced antagonism during resource competition.\nChoice A is incorrect because the antagonistic behavior discussed in the text is that displayed by adult male jacobins toward blue-feathered and\ngreen-feathered adult females, not toward juveniles. The text doesn’t discuss the behavior of adult males toward juveniles. Choice B is incorrect.\nAlthough the text cites the current percentage (28%) of female white-necked jacobin hummingbirds that retain blue plumage into adulthood, it\ndoesn’t make predictions about future changes in the proportion of blue to green plumage in this species or provide information supporting such\na prediction. Choice D is incorrect because the text doesn’t discuss the perceptual abilities of green-feathered adult females or whether they can\ndistinguish between adult males and blue-feathered adult females. Instead, the text focuses on adult male behavior—namely, mate selection and\nantagonism toward adult females."}]

<script>
(function(){
  var ALL = JSON.parse(document.getElementById('question-data').textContent);

  var SKILL_ORDER = ['All','Central Ideas and Details','Command of Evidence','Inferences'];
  var skillCounts = {'All': ALL.length};
  ALL.forEach(function(q){
    skillCounts[q.skill] = (skillCounts[q.skill] || 0) + 1;
  });

  var state = {
    filter: 'All',
    order: [],       // array of indices into ALL, in current working order
    pos: 0,           // position within `order`
    answers: {},      // qid -> {selected, correct(bool)}
  };

  function buildOrder(shuffle){
    var idxs = [];
    for (var i = 0; i < ALL.length; i++){
      if (state.filter === 'All' || ALL[i].skill === state.filter) idxs.push(i);
    }
    if (shuffle) idxs = shuffleArray(idxs);
    state.order = idxs;
    state.pos = 0;
  }

  function shuffleArray(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function currentQuestion(){
    return ALL[state.order[state.pos]];
  }

  // ---------- Filters UI ----------
  var filtersHost = document.getElementById('filters');
  function renderFilters(){
    filtersHost.innerHTML = '';
    SKILL_ORDER.forEach(function(skill){
      var count = skillCounts[skill] || 0;
      if (count === 0) return;
      var chip = document.createElement('div');
      chip.className = 'chip' + (state.filter === skill ? ' active' : '');
      chip.innerHTML = skill + '<span class="count">' + count + '</span>';
      chip.addEventListener('click', function(){
        if (state.filter === skill) return;
        state.filter = skill;
        buildOrder(false);
        renderFilters();
        renderCard();
        renderFooter();
      });
      filtersHost.appendChild(chip);
    });
  }

  // ---------- Score ----------
  function renderScore(){
    var answered = Object.keys(state.answers).length;
    var correct = 0;
    Object.keys(state.answers).forEach(function(qid){
      if (state.answers[qid].correct) correct++;
    });
    document.getElementById('scoreCorrect').textContent = correct;
    document.getElementById('scoreAnswered').textContent = answered;
  }

  function renderProgress(){
    var answeredInSet = 0;
    state.order.forEach(function(i){
      if (state.answers[ALL[i].id]) answeredInSet++;
    });
    var pct = state.order.length ? (answeredInSet / state.order.length) * 100 : 0;
    document.getElementById('progressFill').style.width = pct + '%';
  }

  // ---------- Card ----------
  var cardHost = document.getElementById('cardHost');

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatQuestionText(text){
    var escaped = escapeHtml(text);
    escaped = escaped.replace(/_{4,}/g, '<span class="blank"></span>');
    return escaped;
  }

  function formatRationale(text, correctLetter){
    var escaped = escapeHtml(text);
    // Bold "Choice X is..." lead-ins for scannability
    escaped = escaped.replace(/(Choice [A-D] is (?:the best answer|incorrect|correct))/g, '<b>$1</b>');
    return escaped;
  }

  function renderCard(){
    if (state.order.length === 0){
      cardHost.innerHTML = '<div class="card"><div class="empty-state">No questions in this category.</div></div>';
      return;
    }

    var q = currentQuestion();
    var prior = state.answers[q.id];

    var letters = ['A','B','C','D'];
    var choicesHtml = letters.map(function(letter){
      var text = q.choices[letter] || '';
      return (
        '<div class="choice" data-letter="' + letter + '">' +
          '<div class="bubble"><span class="fill"></span><span class="letter">' + letter + '</span></div>' +
          '<div class="choice-text">' + escapeHtml(text) + '</div>' +
        '</div>'
      );
    }).join('');

    cardHost.innerHTML =
      '<div class="card">' +
        '<div class="card-top">' +
          '<div class="qid">Question ID: ' + q.id + '</div>' +
          '<div class="tags">' +
            '<span class="tag skill">' + q.skill + '</span>' +
            '<span class="tag difficulty">' + q.difficulty + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="question-text">' + formatQuestionText(q.question) + '</div>' +
        '<div class="choices">' + choicesHtml + '</div>' +
        '<div class="actions">' +
          '<button class="btn" id="checkBtn" disabled>Check answer</button>' +
          '<button class="btn ghost" id="resetBtn" style="display:none;">Try again</button>' +
          '<span class="result-line" id="resultLine"></span>' +
        '</div>' +
        '<div class="rationale" id="rationaleBox">' +
          '<h3>Rationale</h3>' +
          '<div class="rationale-text">' + formatRationale(q.rationale) + '</div>' +
        '</div>' +
      '</div>';

    var selected = prior ? prior.selected : null;
    var checked = !!prior;

    var choiceEls = cardHost.querySelectorAll('.choice');
    choiceEls.forEach(function(el){
      var letter = el.getAttribute('data-letter');
      if (checked){
        el.classList.add('disabled');
        if (letter === q.correct) el.classList.add('reveal-correct');
        else if (letter === selected) el.classList.add('reveal-incorrect');
      } else {
        if (letter === selected) el.classList.add('selected');
        el.addEventListener('click', function(){
          choiceEls.forEach(function(e2){ e2.classList.remove('selected'); });
          el.classList.add('selected');
          selected = letter;
          document.getElementById('checkBtn').disabled = false;
        });
      }
    });

    var checkBtn = document.getElementById('checkBtn');
    var resetBtn = document.getElementById('resetBtn');
    var resultLine = document.getElementById('resultLine');
    var rationaleBox = document.getElementById('rationaleBox');

    if (checked){
      checkBtn.style.display = 'none';
      resetBtn.style.display = 'inline-block';
      rationaleBox.classList.add('show');
      if (prior.correct){
        resultLine.textContent = 'Correct — you chose ' + prior.selected + '.';
        resultLine.className = 'result-line correct';
      } else {
        resultLine.textContent = 'Incorrect — you chose ' + prior.selected + '. Correct answer: ' + q.correct + '.';
        resultLine.className = 'result-line incorrect';
      }
    } else {
      checkBtn.disabled = (selected === null);
      checkBtn.addEventListener('click', function(){
        if (selected === null) return;
        var isCorrect = selected === q.correct;
        state.answers[q.id] = {selected: selected, correct: isCorrect};
        renderCard();
        renderScore();
        renderProgress();
      });
    }

    resetBtn.addEventListener('click', function(){
      delete state.answers[q.id];
      renderCard();
      renderScore();
      renderProgress();
    });
  }

  // ---------- Footer nav ----------
  function renderFooter(){
    document.getElementById('posNum').textContent = state.order.length ? (state.pos + 1) : 0;
    document.getElementById('posTotal').textContent = state.order.length;
    document.getElementById('prevBtn').disabled = state.pos <= 0;
    document.getElementById('nextBtn').disabled = state.pos >= state.order.length - 1;
  }

  document.getElementById('prevBtn').addEventListener('click', function(){
    if (state.pos > 0){
      state.pos--;
      renderCard();
      renderFooter();
      window.scrollTo({top:0, behavior:'smooth'});
    }
  });
  document.getElementById('nextBtn').addEventListener('click', function(){
    if (state.pos < state.order.length - 1){
      state.pos++;
      renderCard();
      renderFooter();
      window.scrollTo({top:0, behavior:'smooth'});
    }
  });
  document.getElementById('shuffleBtn').addEventListener('click', function(){
    buildOrder(true);
    renderCard();
    renderFooter();
    renderProgress();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  // ---------- Init ----------
  buildOrder(false);
  renderFilters();
  renderCard();
  renderFooter();
  renderScore();
  renderProgress();
})();

</script>
</body>
</html>
