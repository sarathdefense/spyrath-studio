es show that Spanish Merino outer\nfibers are finer, and thus softer, than mouflon outer fibers and that at their finest, Navajo-Churro outer fibers are softer than mouflon outer fibers,\nbut it also shows that Spanish Merino inner fibers are less soft than mouflon inner fibers, since their minimum diameter is greater than 15\nmicrons, and that Navajo-Churro inner fibers can be less soft than mouflon inner fibers, since the diameter ranges up to 35 microns."}, {"id": "3f236877", "skill": "Inferences", "difficulty": "Hard", "question": "Ratified by more than 90 countries, the Nagoya Protocol is an international agreement ensuring that Indigenous communities are compensated when their agricultural resources and knowledge of wild plants and animals are utilized by agricultural corporations. However, the protocol has shortcomings. For example, it allows corporations to insist that their agreements with communities to conduct research on the commercial uses of the communities’ resources and knowledge remain confidential. Therefore, some Indigenous advocates express concern that the protocol may have the unintended effect of _____ Which choice most logically completes the text?", "choices": {"A": "diminishing the monetary reward that corporations might derive from their agreements with Indigenous communities.", "B": "limiting the research that corporations conduct on the resources of the Indigenous communities with which they have signed agreements.", "C": "preventing independent observers from determining whether the agreements guarantee equitable compensation for Indigenous communities.", "D": "discouraging Indigenous communities from learning new methods for harvesting plants and animals from their corporate partners."}, "correct": "C", "rationale": "Choice C is the best answer because it most logically completes the argument about an unintended effect of the Nagoya Protocol. The text\nexplains that the Nagoya Protocol is an agreement ensuring that Indigenous communities are compensated when their agricultural resources\nand knowledge are used by corporations. The text then states that the protocol allows corporations to keep their agreements with Indigenous\ncommunities confidential, about which some Indigenous advocates express concern. Choice C, when inserted into the blank, gives a good\njustification for the advocates’ concern: such secrecy could mean that the public is unable to determine whether participating Indigenous\ncommunities were properly compensated under these agreements.\nChoice A is incorrect. The text suggests that because corporations can keep their agreements with Indigenous communities confidential,\nIndigenous communities, not corporations, might not be compensated fairly. Choice B is incorrect because the text doesn’t suggest that the\nability of corporations to keep their agreements with Indigenous communities confidential would place limits on how much research\ncorporations can undertake. Choice D is incorrect because the text doesn’t indicate that Indigenous communities aim to learn new harvesting\nmethods from their corporate partners. Rather, the text suggests that corporations use the knowledge of Indigenous communities for their\nresearch."}, {"id": "5b74feb9", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Political scientists who favor the traditional view of voter behavior claim that voting in an election does not change a voter’s attitude toward the candidates in that election. Focusing on each US presidential election from 1976 to 1996, Ebonya Washington and Sendhil Mullainathan tested this claim by distinguishing between subjects who had just become old enough to vote (around half of whom actually voted) and otherwise similar subjects who were slightly too young to vote (and thus none of whom voted). Washington and Mullainathan compared the attitudes of the groups of subjects toward the winning candidate two years after each election. Which finding from Washington and Mullainathan’s study, if true, would most directly weaken the claim made by people who favor the traditional view of voter behavior?", "choices": {"A": "Subjects’ attitudes toward the winning candidate two years after a given election were strongly predicted by subjects’ general political orientation, regardless of whether subjects were old enough to vote at the time of the election.", "B": "Subjects who were not old enough to vote in a given election held significantly more positive attitudes towards the winning candidate two years later than they held at the time of the election.", "C": "Subjects who voted in a given election held significantly more polarized attitudes toward the winning candidate two years later than did subjects who were not old enough to vote in that election.", "D": "Two years after a given election, subjects who voted and subjects who were not old enough to vote were significantly more likely to express negative attitudes than positive attitudes toward the winning candidate in that election."}, "correct": "C", "rationale": "Choice C is the best answer because it presents a finding that, if true, would weaken the claim made by people who favor the traditional view of\nvoter behavior. According to the text, people who favor that view believe that voting in an election doesn’t change a voter’s attitude toward the\ncandidates in that election. If Washington and Mullainathan found that two years after an election, attitudes toward the winning candidate were\nsignificantly more polarized among subjects who had voted than among subjects who had been too young to vote, that would suggest that the\nact of voting did have an effect on the voters’ attitudes toward the candidates, which would undermine the claim that voting doesn’t change\nvoters’ attitudes.\nChoice A is incorrect because a finding about links between subjects’ attitudes and general political orientation, regardless of age and ability to\nvote, wouldn’t address the presence or absence of changes in attitudes among those subjects who did actually vote. Therefore, the finding\nwouldn’t have any bearing on the claim that voting in an election doesn’t change a voter’s attitude toward the candidates in that election. Choice\nB is incorrect because a finding that positive attitudes toward a winning candidate significantly increased in the two years after the election\namong subjects who had been too young to vote would involve only people who didn’t vote; therefore, the finding wouldn’t have any bearing on\nthe claim that when people do vote, the act of voting doesn’t change their attitudes toward the candidates. Choice D is incorrect because the\nfinding that subjects in both groups were more likely to have negative attitudes than positive attitudes toward the winning candidate two years\nafter an election would reflect all subjects’ attitudes at one particular time whether they voted or not, rather than the presence or absence of a\nchange in voters’ attitudes after voting. Therefore, the finding would neither weaken nor strengthen the claim that voting in an election doesn’t\nchange a voter’s attitude toward the candidates."}, {"id": "0198240a", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Under normal atmospheric pressure at Earth’s surface, water molecules form a tetrahedral network stabilized by hydrogen bonds between adjacent molecules. Extreme high pressure, such as can be found in deep ocean waters, destabilizes these bonds and compresses water’s structure, allowing water molecules within organisms to permeate proteins and impede crucial biological functions; yet deep-sea organisms known as piezophiles have adapted to extreme pressure. Studies have found a positive correlation between the depths that various piezophiles inhabit and concentrations of a compound called trimethylamine N-oxide (TMAO) in their muscle tissues, which has led a team of researchers to hypothesize that TMAO reduces water’s compressibility. Which finding, if true, would most directly support the researchers’ hypothesis?", "choices": {"A": "Water molecules are found to be impervious to TMAO even when the water molecules’ tetrahedral configuration has been distorted by high pressure.", "B": "Examination of TMAO’s molecular structure shows that TMAO molecules retain their shape even as pressure increases.", "C": "A positive correlation is found between concentrations of TMAO and the rate at which water’s molecular structure compresses as pressure increases.", "D": "Analysis of water’s molecular structure under high pressure reveals that hydrogen bonds are more stable when TMAO is present than when it is not."}, "correct": "D", "rationale": "Choice D is the best answer because it presents a finding that, if true, would support the researchers’ hypothesis that TMAO reduces water’s\ncompressibility. The text explains that at great depths in the ocean, extreme pressure compresses the molecular structure of water by\ndestabilizing the hydrogen bonds between adjacent molecules, thereby allowing water to penetrate proteins and harm the associated organisms.\nHowever, deep-sea organisms called piezophiles have adapted to live at these depths and previous studies show a positive correlation between\nthe depth at which a piezophile species lives and the species’ level of the compound TMAO. Because this hypothesis links TMAO levels with\nreduced compressibility of water’s tetrahedral molecular structure, a finding that TMAO helps maintain the hydrogen bonds between water\nmolecules under high pressure would strongly support that hypothesis.\nChoice A is incorrect. Although the researchers’ hypothesis suggests a relationship between TMAO and water molecules’ tetrahedral molecular\nstructure, that relationship involves TMAO helping maintain water’s tetrahedral molecular structure under high pressure; as presented in the text,\nthe hypothesis doesn’t contend that water molecules are impervious to, or incapable of being penetrated by, TMAO. Choice B is incorrect\nbecause the text discusses how the molecular structure of water, not TMAO, is compressed under extreme pressure and never addresses how\nTMAO might be affected by such pressure. Choice C is incorrect because the researchers’ hypothesis holds that water under extreme pressure is\nmore resistant, not less, to being compressed when TMAO concentrations are higher. Moreover, the positive correlation mentioned in the text is\nbetween TMAO concentrations and the depths at which piezophiles live, not between concentrations of TMAO and the rate at which water’s\nmolecular structure compresses as pressure increases."}, {"id": "c2c61e7d", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Researchers hypothesized that a decline in the population of dusky sharks near the mid-Atlantic coast of North America led to a decline in the population of eastern oysters in the region. Dusky sharks do not typically consume eastern oysters but do consume cownose rays, which are the main predators of the oysters. Which finding, if true, would most directly support the researchers’ hypothesis?", "choices": {"A": "Declines in the regional abundance of dusky sharks’ prey other than cownose rays are associated with regional declines in dusky shark abundance.", "B": "Eastern oyster abundance tends to be greater in areas with both dusky sharks and cownose rays than in areas with only dusky sharks.", "C": "Consumption of eastern oysters by cownose rays in the region substantially increased before the regional decline in dusky shark abundance began.", "D": "Cownose rays have increased in regional abundance as dusky sharks have decreased in regional abundance."}, "correct": "D", "rationale": "Choice D is the best answer because it presents a finding that, if true, would most directly support the researchers’ hypothesis about the\nconnection between the dusky shark population decline and the eastern oyster population decline. The text indicates that although dusky sharks\ndon’t usually eat eastern oysters, they do consume cownose rays, which are the main predators of eastern oysters. An increase in the abundance\nof cownose rays in the region in response to a decline in the abundance of dusky sharks would directly support the researchers’ hypothesis: a\nhigher number of cownose rays would consume more eastern oysters, driving down the oyster population.\nChoice A is incorrect because a finding that there’s an association between a decline in the regional abundance of some of dusky sharks’ prey\nand the regional abundance of dusky sharks wouldn’t directly support the researchers’ hypothesis that a decline in dusky sharks has led to a\ndecline in eastern oysters in the region. Although such a finding might help explain why shark abundance has declined, it would reveal nothing\nabout whether the shark decline is related to the oyster decline. Choice B is incorrect because a finding that eastern oyster abundance tends to\nbe greater when dusky sharks and cownose rays are present than when only dusky sharks are present wouldn’t support the researchers’\nhypothesis that a decline in dusky sharks has led to a decline in eastern oysters in the region. The text indicates that the sharks prey on the rays,\nwhich are the main predators of the oysters; if oyster abundance is found to be greater when rays are present than when rays are absent, that\nwould suggest that rays aren’t keeping oyster abundance down, and thus that a decline in rays’ predators, which would be expected to lead to an\nincrease in the abundance of rays, wouldn’t bring about a decline in oyster abundance as the researchers hypothesize. Choice C is incorrect\nbecause a finding that consumption of eastern oysters by cownose rays increased substantially before dusky sharks declined in regional\nabundance wouldn’t support the researchers’ hypothesis that the decline in dusky sharks has led to a decline in eastern oysters in the region.\nSuch a finding would suggest that some factor other than shark abundance led to an increase in rays’ consumption of oysters and thus to a\ndecrease in oyster abundance, thereby weakening the researchers’ hypothesis."}, {"id": "825dc766", "skill": "Command of Evidence", "difficulty": "Hard", "question": "King Lear is a circa 1606 play by William Shakespeare. In the play, the character of King Lear attempts to test his three daughters’ devotion to him. He later expresses regret for his actions, as is evident when he _____ Which choice most effectively uses a quotation from King Lear to illustrate the claim?", "choices": {"A": "says of himself, “I am a man / more sinned against than sinning.”", "B": "says during a growing storm, “This tempest will not give me leave to ponder / On things would hurt me more.”", "C": "says to himself while striking his head, “Beat at this gate that let thy folly in / And thy dear judgement out!”", "D": "says of himself, “I will do such things— / What they are yet, I know not; but they shall be / The terrors of the earth!”"}, "correct": "C", "rationale": "Choice C is the best answer because it most effectively uses a quotation from King Lear to illustrate the claim that King Lear expresses regret for\nhis actions. In the quotation, Lear describes striking himself on the head—the same act he’s engaged in as he speaks, and one that suggests he’s\ndeeply upset with himself. Referring to himself in the second person (with “thy”), the character exclaims “Beat at this gate that let thy folly in /\nAnd thy dear judgement out!” Lear refers metaphorically to his own mind as a gate that has allowed folly, or poor judgement, to enter and good\njudgement to escape. This suggests that Lear regrets his attempts to test his three daughters’ devotion to him, regarding those attempts as\nexamples of the folly that has entered the gate of his mind.\nChoice A is incorrect because this quotation doesn’t express King Lear’s sense of regret over his own actions; instead, it expresses his belief that\nthe harm that others have done to him (or the extent to which they have “sinned against” him) outweighs whatever harm he himself has caused\nby “sinning.” Choice B is incorrect because this quotation doesn’t express King Lear’s sense of regret over his own actions; instead, it expresses\nhis thoughts about an approaching storm (“this tempest”), which he believes “will not give [him] leave to ponder,” or time to consider, the harm\nthat he will continue to experience (“things” that “would hurt [him] more”). Choice D is incorrect because this quotation expresses King Lear’s\nvow to commit terrible actions (or “things” that “shall be / The terrors of the earth”) in the future, not his regret over actions that he’s already\ntaken."}, {"id": "0240d11c", "skill": "Command of Evidence", "difficulty": "Hard", "question": "In the twentieth century, ethnographers made a concerted effort to collect Mexican American folklore, but they did not always agree about that folklore’s origins. Scholars such as Aurelio Espinosa claimed that Mexican American folklore derived largely from the folklore of Spain, which ruled Mexico and what is now the southwestern United States from the sixteenth to early nineteenth centuries. Scholars such as Américo Paredes, by contrast, argued that while some Spanish influence is undeniable, Mexican American folklore is mainly the product of the ongoing interactions of various cultures in Mexico and the United States. Which finding, if true, would most directly support Paredes’s argument?", "choices": {"A": "The folklore that the ethnographers collected included several songs written in the form of a décima, a type of poem originating in late sixteenth-century Spain.", "B": "Much of the folklore that the ethnographers collected had similar elements from region to region.", "C": "Most of the folklore that the ethnographers collected was previously unknown to scholars.", "D": "Most of the folklore that the ethnographers collected consisted of corridos—ballads about history and social life—of a clearly recent origin."}, "correct": "D", "rationale": "Choice D is the best answer because it presents a finding that, if true, would support Paredes’s argument that Mexican-American folklore is\nmostly the result of cultural interactions in Mexico and the United States rather than an adaptation of Spanish folklore. The text describes a\ndisagreement among scholars about whether Mexican-American folklore mostly derived from the folklore of Spain or originated in Mexico and\nthe United States as cultures there have interacted. The latter view is the argument that Paredes puts forward. If Mexican-American folklore\ncollected in the twentieth century mostly consists of ballads about history and social life that originated recently, then that would support\nParedes’s argument, since it would suggest that the folklore mostly arose after Spanish rule ended in the early nineteenth century and that the\nfolklore reflects cultural interactions in Mexico and the United States rather than traditions from Spain.\nChoice A is incorrect because the inclusion of songs influenced by sixteenth-century Spanish poetry among Mexican-American folklore collected\nin the twentieth century would not support Paredes’s view that the folklore was the result of cultural interactions in Mexico and the United States\nrather than an offshoot of Spanish folklore. If anything, the presence of such songs among the folklore collected in the twentieth century would\nweaken Paredes’s argument, since it would reflect the influence of Spanish culture on the folklore. Choice B is incorrect because the mere\npresence of similarities in Mexican-American folklore across regions would not be sufficient to draw a conclusion about where the folklore\noriginated, let alone to support Paredes’s argument that the folklore reflects cultural interactions in Mexico and the United States. In fact, since\nParedes argued that Mexican-American folklore is the product of various cultures interacting in Mexico and the United States, he would likely\nexpect there to be regional variations in folklore as different cultures have interacted in different places. Choice C is incorrect because scholars’\nprevious ignorance of the folklore would have no bearing on Paredes’s argument that Mexican-American folklore mostly reflects cultural\ninteractions in Mexico and the United States. The folklore’s origins are independent of scholars’ knowledge of the folklore."}, {"id": "4d3e3c52", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "In a paper about p-i-n planar perovskite solar cells (one of several perovskite cell architectures designed to collect and store solar power), Lyndsey McMillon-Brown et al. describe a method for fabricating the cell’s electronic transport layer (ETL) using a spray coating. Conventional ETL fabrication is accomplished using a solution of nanoparticles. The process can result in a loss of up to 80% of the solution, increasing the cost of manufacturing at scale—an issue that may be obviated by spray coating fabrication, which the researchers describe as “highly reproducible, concise, and practical.” What does the text most strongly suggest about conventional ETL fabrication?", "choices": {"A": "It is less suitable for manufacturing large volumes of planar p-i-n perovskite solar cells than an alternative fabrication method may be.", "B": "It is more expensive when manufacturing at scale than are processes for fabricating ETLs used in other perovskite solar cell architectures.", "C": "It typically entails a greater loss of nanoparticle solution than do other established approaches for ETL fabrication.", "D": "It is somewhat imprecise and therefore limits the potential effectiveness of p-i-n planar perovskite solar cells at capturing and storing solar power."}, "correct": "A", "rationale": "Choice A is the best answer. Conventional solar cell fabrication increases “the cost of manufacturing at scale,” but spray coating might get rid of\nthat problem.\nChoice B is incorrect. This is not completely supported by the text. While it’s true that conventional ETL fabrication is expensive at scale, there’s\nnothing in the text that mentions other perovskite solar cell architectures. Choice C is incorrect. This choice does not match the text. Only one\nconventional method of ETL fabrication is described, so we can’t compare the solution loss in this method to that of other conventional\nmethods. Choice D is incorrect. This choice isn’t supported by the text. The text never suggests that the effectiveness of solar cells changes\nbased on their method of fabrication."}, {"id": "d1b8a9ad", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "Disco remains one of the most ridiculed popular music genres of the late twentieth century. But as scholars have argued, the genre is far less superficial than many people believe. Take the case of disco icon Donna Summer: she may have been associated with popular songs about love and heartbreak (subjects hardly unique to disco, by the way), but like many Black women singers before her, much of her music also reflects concerns about community and identity. These concerns are present in many of the genre’s greatest songs, and they generally don’t require much digging to reveal. What does the text most strongly suggest about the disco genre?", "choices": {"A": "It has been unjustly ignored by most scholars despite the importance of the themes addressed by many of the genre’s songs.", "B": "It evolved over time from a superficial genre focused on romance to a genre focused on more serious concerns.", "C": "It has been unfairly dismissed for the inclusion of subject matter that is also found in other musical genres.", "D": "It gave rise to a Black women’s musical tradition that has endured even though the genre itself faded in the late twentieth century."}, "correct": "C", "rationale": "Choice C is the best answer. The text argues that disco is \"far less superficial\" than its popular perception might indicate, and that love and\nheartbreak are \"subjects hardly unique to disco.\"\nChoice A is incorrect. This choice conflicts with the text, which says that scholars argue that disco \"is far less superficial than many people\nbelieve.\" Choice B is incorrect. This choice says the opposite of what the text suggests. The writer argues that the genre is not as superficial as\ncommonly believed, but that it always reflected \"concerns about community and identity.\" Choice D is incorrect. The text doesn’t support this\nchoice. There’s nothing in the text about disco giving rise to an enduring Black women’s musical tradition."}, {"id": "02848335", "skill": "Command of Evidence", "difficulty": "Hard", "question": "18 16 14 12 10 8 6 4 2 0 )%( ycneiciffe noisrevnoc rewoP Power Conversion Efficiency of Lowest and Highest Performing Spin-coated and Spray-coated Electron Transport Layers g g n n mi mi or or erf erf p p st st e e w h l o hi g Thickness spray coating spin coating Perovskite solar cells convert light into electricity more efficiently than earlier kinds of solar cells, and manufacturing advances have recently made them commercially attractive. One limitation of the cells, however, has to do with their electron transport layer (ETL), through which absorbed electrons must pass. Often the ETL is applied through a process called spin coating, but such ETLs are fairly inefficient at converting input power to output power. André Taylor and colleagues tested a novel spray coating method for applying the ETL. The team produced ETLs of various thicknesses and concluded that spray coating holds promise for improving the power conversion efficiency of ETLs in perovskite solar cells. Which choice best describes data from the graph that support Taylor and colleagues’ conclusion?", "choices": {"A": "Both the ETL applied through spin coating and the ETL applied through spray coating showed a power conversion efficiency greater than 10% at their lowest performing thickness.", "B": "The lowest performing ETL applied through spray coating had a higher power conversion efficiency than the highest performing ETL applied through spin coating.", "C": "The highest performing ETL applied through spray coating showed a power conversion efficiency of approximately 13%, while the highest performing ETL applied through spin coating showed a power conversion efficiency of approximately 11%.", "D": "There was a substantial difference in power conversion efficiency between the lowest and highest performing ETLs applied through spray coating."}, "correct": "B", "rationale": "Choice B is the best answer because it describes data from the graph that support Taylor and colleagues’ conclusion that spray coating holds\npromise for improving the power conversion efficiency of ETLs in perovskite solar cells. The text explains that perovskite solar cells’ efficiency at\nconverting light into electricity is diminished by their electron transport layer (ETL), which is applied through spin coating, but that Taylor’s team\ndevised a new spray coating method for applying the ETL that improves its power conversion efficiency. The graph displays data on the power\nconversion efficiency of solar cells in tests conducted by Taylor’s team, with bars for both the highest- and lowest-performing ETLs in two data\ncategories: spray coating and spin coating. According to the graph, the lowest-performing ETL applied through spray coating had a power\nconversion efficiency of between 14% and 16%, while the highest-performing ETL applied through spin coating had a power conversion\nefficiency of less than 14%. These data confirm that ETLs applied through novel spray coating are more efficient than those applied though\ntraditional spin coating. Thus, the data support Taylor and colleagues’ conclusion about spray coating’s potential value.\nChoice A is incorrect. Although this claim correctly describes the data in the graph by stating that both the lowest-performing ETL applied\nthrough spin coating and the lowest-performing ETL applied through spray coating had a power conversion efficiency greater than 10%, this\nrelationship in the data doesn’t support or relate to Taylor and colleagues’ conclusion that spray coating promises greater efficiency for solar\ncells than traditional spin coating does. Choice C is incorrect. This claim does address the greater power conversion efficiency of the highest-\nperforming ETL applied through spray coating, compared with the highest-performing ETL applied through spin coating. However, it also\nincorrectly cites the value for the efficiency of the highest-performing ETL applied through spray coating as approximately 13%, instead of a\nvalue between 14% and 16%, and the value for the efficiency of the highest-performing ETL applied through spin coating as approximately 11%,\ninstead of a value between 12% and 14%, as shown in the graph. Choice D is incorrect because Taylor and colleagues’ conclusion is based on the\ndifference in the power conversion efficiency of ETLs applied through spray coating and that of ETLs applied through spin coating, not on the\ndifference between the highest- and lowest-performing ETLs applied through just spray coating."}, {"id": "55df0275", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Ablation Rates for Three Elements in Cosmic Dust, by Dust Source Element SPC AST HTC OCC iron 20% 28% 90% 98% potassium 44% 74% 97% 100% sodium 45% 75% 99% 100% Earth’s atmosphere is bombarded by cosmic dust originating from several sources: short-period comets (SPCs), particles from the asteroid belt (ASTs), Halley-type comets (HTCs), and Oort cloud comets (OCCs). Some of the dust’s material vaporizes in the atmosphere in a process called ablation, and the faster the particles move, the higher the rate of ablation. Astrophysicist Juan Diego Carrillo-Sánchez led a team that calculated average ablation rates for elements in the dust (such as iron and potassium) and showed that material in slower-moving SPC or AST dust has a lower rate than the same material in faster-moving HTC or OCC dust. For example, whereas the average ablation rate for iron from AST dust is 28%, the average rate for _____ Which choice most effectively uses data from the table to complete the example?", "choices": {"A": "iron from SPC dust is 20%.", "B": "sodium from OCC dust is 100%.", "C": "iron from HTC dust is 90%.", "D": "sodium from AST dust is 75%."}, "correct": "C", "rationale": "Choice C is the best answer because it most effectively completes the example regarding the ablation rate of iron. The table shows the ablation\nrates for three elements—iron, potassium, and sodium—found in cosmic dust that comes from one of four sources. The text says that the\nablation rate for a given element in slower-moving SPC and AST dust was lower than the ablation rate for that same element in faster-moving\nHTC or OCC dust. The text then presents the first part of an example of this pattern, describing an ablation rate of 28% for iron in AST dust. The\ninformation that iron from HTC dust had an ablation rate of 90% is therefore the most effective way to complete this example—the comparison\nof a relatively low ablation rate for iron in slower-moving AST dust with a relatively high ablation rate for iron in faster-moving HTC dust illustrates\nthe tendency of ablation rates for a given element to be lower in slower-moving dust than in faster-moving dust.\nChoice A is incorrect because the text indicates that SPC dust, like AST dust, moves relatively slowly; a comparison of the ablation rates of iron\nfrom two slower-moving dust sources could not be an example of the difference between ablation rates in slower-moving dust and faster-moving\ndust, which is the pattern that the example is supposed to illustrate. Choice B is incorrect because the example in the text is supposed to\nillustrate the difference in the ablation rates of the same element from slower-moving dust and faster-moving dust, and the first part of the\nexample provides data about the ablation rate of iron, which means the second part of the example must also be about the ablation rate of iron,\nnot the ablation rate of sodium. Choice D is incorrect because the example in the text is supposed to illustrate the difference in the ablation rates\nof the same element from slower-moving dust and faster-moving dust, and the first part of the example provides data about the ablation rate of\n\niron, which means the second part of the example must also be about the ablation rate of iron, not the ablation rate of sodium. Additionally, any\nablation rate from AST dust would be ineffective in this example since AST dust is referenced in the first part of the example and thus additional\ndata focused on AST dust would not illustrate a variation across dust types."}, {"id": "80fd9454", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Percentage of Available Eggs Eaten by Cane Toad Tadpoles Amphibian species (common name) Percentage of eggs eaten Native to Australia Produces bufadienolide Little red tree frog 1% yes no Cane toad 90% no yes Short-footed frog 7% yes no Striped burrowing frog 10% yes no Dainty green tree frog 1% yes no Native to Latin America, the cane toad was introduced to Australia in the 1930s. In recent decades, tadpoles in the Australian population have been shown to consume eggs of their own species. A 2022 study showed that when presented with cane toad eggs as well as eggs of native Australian amphibians, cane toad tadpoles disproportionately consumed eggs of their own species. This behavior results from their attraction to bufadienolide, a chemical produced by the eggs of cane toads but not by the eggs of native amphibians. However, using data from this study, a student wishes to argue that the presence of bufadienolide doesn’t entirely explain the cane toad tadpoles’ preference for certain eggs over others. Which choice best describes data from the table that support the student’s argument?", "choices": {"A": "The tadpoles consumed a higher percentage of the striped burrowing frog eggs than they did of the eggs of the dainty green tree frog.", "B": "The tadpoles left a certain percentage of the eggs of each of the five species unharmed, thus ultimately allowing them to hatch.", "C": "The tadpoles consumed a lower percentage of the short-footed frog eggs than they did of the eggs of their own species.", "D": "The tadpoles consumed the same percentage of the dainty green tree frog eggs as they did of the little red tree frog eggs."}, "correct": "A", "rationale": "Choice A is the best answer because it most effectively uses data from the table to support the student’s argument about the role of\nbufadienolide in the egg preferences of cane toad tadpoles. For each of five amphibian species included in the 2022 study, the table gives the\npercentage of available eggs that the cane toad tadpoles ate. According to the table, the tadpoles ate 10% of striped burrowing frog eggs and 1%\nof dainty green tree frog eggs, which suggests a preference for striped burrowing frog eggs over dainty green tree frog eggs. The table also\nindicates that neither of these species’ eggs produces bufadienolide. Thus, these data suggest that something other than the presence or\nabsence of bufadienolide is needed to adequately explain the tadpoles’ egg preferences.\nChoice B is incorrect. Although the table shows that for each of the five amphibian species, the cane toad tadpoles ate less than 100% of that\nspecies’ eggs, which demonstrates that the tadpoles did indeed leave some eggs for each species unharmed, this fact alone is irrelevant to the\ntadpoles’ preferences for some species’ eggs over other species’ eggs. Choice C is incorrect. Although the table indicates that the cane toad\ntadpoles ate 90% of the cane toad eggs and 7% of the short-footed frog eggs, which suggests that they prefer cane toad eggs over short-footed\nfrog eggs, the table also indicates that cane toad eggs produce bufadienolide, whereas short-footed frog eggs do not. Therefore, these data are\nnot sufficient to exclude that bufadienolide alone could explain the tadpoles’ preference for some species’ eggs over other species’ eggs. Choice\n\nD is incorrect. Although the table shows that for both dainty green tree frog eggs and little red tree frog eggs, the cane toad tadpoles ate 1% of\nthose species’ eggs, it also indicates that neither produces bufadienolide. Thus, these data alone don’t indicate bufadienolide’s role in the\ntadpoles’ egg preferences."}, {"id": "63e7799d", "skill": "Command of Evidence", "difficulty": "Hard", "question": "In vertical inheritance, parents pass genes to their offspring, but in horizontal transfer (HT), one species, often bacteria, passes genetic material to an unrelated species. In a 2022 study, herpetologist Atsushi Kurabayashi and his team investigated HT in multicellular organisms—namely, snakes and frogs in Madagascar. The team detected BovB—a gene transmitted vertically in snakes—in many frog species. The apparent direction of gene transfer seems counterintuitive because frogs usually don’t survive encounters with snakes and so wouldn’t be able to transmit the newly acquired gene to offspring, but the team concluded that BovB is indeed transmitted from snakes to frogs, either directly or indirectly, via HT. Which finding, if true, would most directly support the team’s conclusion?", "choices": {"A": "BovB can be transmitted across frog species through HT.", "B": "Parasites known to feed on species of snakes and frogs in which the BovB gene occurs also carry BovB.", "C": "BovB cannot be reliably transmitted from a snake species to bacteria that are usually encountered by frog species.", "D": "Frog species with BovB show few discernible advantages as compared with frog species that do not carry BovB."}, "correct": "B", "rationale": "Choice B is the best answer. If there are parasites that feed on both snakes and frogs, they could carry BovB from snakes to frogs. HT could\noccur “indirectly” through those encounters, which frogs are more likely to survive than snake encounters.\nChoice A is incorrect. The team’s conclusion specifically argues that BovB is transmitted from snakes to frogs via HT, and this choice doesn’t\nmention snakes. Choice C is incorrect. The team argues that BovB is transmitted from snakes to frogs via HT, and this answer choice discusses\na scenario in which the gene is not transmitted. Choice D is incorrect. Whether or not frog species with BovB are advantaged isn’t relevant to the\nteam’s conclusion about how the gene is transmitted."}, {"id": "0dba14e6", "skill": "Inferences", "difficulty": "Hard", "question": "The increased integration of digital technologies throughout the process of book creation in the late 20th and early 21st centuries lowered the costs of book production, but those decreased costs have been most significant in the manufacturing and distribution process, which occurs after the authoring, editing, and design of the book are complete. This suggests that in the late 20th and early 21st centuries, _____ Which choice most logically completes the text?", "choices": {"A": "digital technologies made it easier than it had been previously for authors to write very long works and get them published.", "B": "customers generally expected the cost of books to decline relative to the cost of other consumer goods.", "C": "publishers increased the variety of their offerings by printing more unique titles but also printed fewer copies of each title.", "D": "the costs of writing, editing, and designing a book were less affected by the technologies used than were the costs of manufacturing and distributing a book."}, "correct": "D", "rationale": "Choice D is the best answer because it presents the conclusion that most logically follows from the text’s discussion of how digital technologies\naffected the process of book creation. The text explains that in the late 20th and early 21st centuries digital technologies lowered book\nproduction costs most significantly in manufacturing and distribution. The text goes on to point out that authoring, editing, and book design are\ndistinct steps in the process that occur before manufacturing and distribution. Because the savings connected to digital technologies have been\nmost significant in manufacturing and distribution, it’s reasonable to infer that those technologies had less of an effect on writing, editing, and\ndesigning books.\nChoice A is incorrect because the text focuses on lowered book production costs that occur after authoring has taken place; there’s no indication\nin the text whether digital technologies made writing and publishing lengthy books easier. Choice B is incorrect. Although it’s logical to conclude\nthat customers would expect the cost of books to decline if production costs have declined, the text doesn’t address customer expectations for\nthe cost of books or any other consumer goods. Choice C is incorrect because the text focuses broadly on how digital technologies have\naffected the cost of the publishing process; it doesn’t address the kinds of books being published or how many copies are printed."}, {"id": "860803dd", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Biologist Valentina Gómez-Bahamón and her team have investigated two subspecies of the fork-tailed flycatcher bird that live in the same region in Colombia, but one subspecies migrates south for part of the year, and the other doesn’t. The researchers found that, due to slight differences in feather shape, the feathers of migratory forked-tailed flycatcher males make a sound during flight that is higher pitched than that made by the feathers of nonmigratory males. The researchers hypothesize that fork-tailed flycatcher females are attracted to the specific sound made by the males of their own subspecies, and that over time the females’ preference will drive further genetic and anatomical divergence between the subspecies. Which finding, if true, would most directly support Gómez-Bahamón and her team’s hypothesis?", "choices": {"A": "The feathers located on the wings of the migratory fork-tailed flycatchers have a narrower shape than those of the nonmigratory birds, which allows them to fly long distances.", "B": "Over several generations, the sound made by the feathers of migratory male fork-tailed flycatchers grows progressively higher pitched relative to that made by the feathers of nonmigratory males.", "C": "Fork-tailed flycatchers communicate different messages to each other depending on whether their feathers create high-pitched or low-pitched sounds.", "D": "The breeding habits of the migratory and nonmigratory fork-tailed flycatchers remained generally the same over several generations."}, "correct": "B", "rationale": "Choice B is the best answer because it presents a finding that, if true, would most directly support Gómez-Bahamón and her team’s hypothesis\nabout fork-tailed flycatchers. The text indicates that although two subspecies of the birds live in the same region, the tail feathers of the\nmigrating males make a higher-pitched sound than the tail feathers of the nonmigrating males do. Gómez-Bahamón and her team hypothesize\nthat female fork-tailed flycatchers are attracted to the particular sound made by the tail feathers of males of their own subspecies, which will\nbring about additional “genetic and anatomical divergence” between the two subspecies. If it were found that the pitch generated by the tail\nfeathers of migrating males is getting higher over successive generations, it would indicate that the shape of the migrating subspecies’ tail\nfeathers is diverging further from that of the nonmigrating subspecies. And if females continue to prefer the sounds of the males of their own\nsubspecies, the females of the migrating subspecies will become acclimated to increasingly higher pitches over subsequent generations,\ncausing further divergence between the subspecies. Thus, if it were found that migrating males’ tail feathers were producing higher pitches over\ntime, that would support the researchers’ hypothesis.\nChoice A is incorrect because the researchers’ hypothesis is that female flycatchers prefer the sounds produced by the tail feathers of males of\ntheir own subspecies, which will lead to further divergence between the two subspecies. This finding is about the shape of wing feathers and\nhow that affects long-distance flight, whereas the hypothesis is about the shape of tail feathers and how that relates to female mate preference.\nChoice C is incorrect because the researchers’ hypothesis is that female flycatchers prefer the sounds produced by the tail feathers of males of\ntheir own subspecies, which will lead to further divergence between the two subspecies. This finding focuses on how the tail feather sounds\ncommunicate different messages, which doesn’t address differences between the subspecies or female preferences. Choice D is incorrect\nbecause the researchers’ hypothesis is that female flycatchers prefer the sounds produced by the tail feathers of males of their own subspecies,\nwhich will lead to further divergence between the two subspecies. The finding that breeding habits haven’t changed for either subspecies does\nnot, by itself, suggest anything about female preferences or divergence between the two subspecies."}, {"id": "8c39592a", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "The following text is adapted from William Shakespeare’s 1598 play Henry IV, Part 1. King Henry is addressing several noblemen who are rumored to have been disloyal to him. KING HENRY: My blood hath been too cold and temperate, Unapt to stir at these indignities, And you have found me, for accordingly You tread upon my patience; but be sure I will from henceforth rather be myself, Mighty and to be fear’d, than my [disposition], Which hath been smooth as oil, soft as young down, And therefore lost that title of respect Which the proud soul ne’er pays but to the proud. Which statement best describes how King Henry presents himself in the text?", "choices": {"A": "He declares that he has judged the noblemen’s conduct in an impartial manner, and that despite their attempts to regain his trust through professions of submissiveness, they have irrevocably lost his respect.", "B": "He acknowledges to the noblemen that his tolerance of their conduct has undermined their respect for him, and he resolves to display his genuine nature, which is more forceful and compels deference.", "C": "He defends his calm disposition, which he sees as fundamental to his personality, and vows to maintain his tranquil demeanor even if it causes him to lose the respect of overly proud noblemen.", "D": "He concedes that he has treated the noblemen with indifference, which in part explains why they have defied him, but he asserts that their disrespectful behavior is primarily driven by their excessive pride."}, "correct": "B", "rationale": "Choice B is the best answer because it most accurately describes King Henry’s self-presentation in the text. Henry states that his temperament\nhas been “too cold and temperate, / Unapt to stir at these indignities” (that is, too calm and slow to react to insults), and he asserts that the\nnoblemen have taken advantage of this: “accordingly / You tread upon my patience.” He then resolves to change, declaring he will “from\nhenceforth rather be myself, / Mighty and to be fear’d,” since being lenient (“smooth as oil, soft as young down”) has caused him to lose “that title\nof respect / Which the proud soul ne’er pays but to the proud.” In other words, Henry recognizes that proud people like the noblemen respect only\nstrength and resolves to show his more forceful, true nature.\nChoice A is incorrect because the text doesn’t describe Henry as having judged the noblemen impartially, nor does it mention any attempts by\nthe noblemen to regain his trust through submissiveness. Rather, Henry describes the noblemen as taking advantage of his patience and\ndeclares he will adopt a more commanding demeanor in the future. Choice C is incorrect. Although Henry concedes that he has perhaps been\ntoo calm and mild, Henry does not defend or vow to maintain his calm disposition. On the contrary, he explicitly states he will “from henceforth\nrather be myself, / Mighty and to be fear’d,” resolving to abandon the mild manner that has cost him the respect of the noblemen. Choice D is\nincorrect because Henry characterizes his manner as patient and mild—“smooth as oil, soft as young down”—not indifferent. Indifference implies\n\na lack of concern, whereas Henry describes himself as being overly lenient. Additionally, although the final lines mention “the proud soul,” the\nfocus is not on the noblemen’s excessive pride but rather on how Henry’s apparent lack of pride has caused him to lose the noblemen’s respect."}, {"id": "a44c7bd4", "skill": "Inferences", "difficulty": "Hard", "question": "Some ethicists hold that the moral goodness of an individual’s actions depends solely on whether the actions themselves are good, irrespective of the context in which they are carried out. Philosopher L. Sebastian Purcell has shown that surviving works of Aztec (Nahua) philosophy express a very different view. Purcell reveals that these works posit an ethical system in which an individual’s actions are judged in light of how well they accord with the individual’s role in society and how well they contribute to the community. To the extent that these works are representative of Aztec thought, Purcell’s analysis suggests that _____ Which choice most logically completes the text?", "choices": {"A": "the Aztecs would have disputed the idea that the morality of an individual’s actions can be assessed by appealing to standards of behavior that are independent of the individual’s social circumstances.", "B": "the Aztecs would not have accepted the notion that the morality of an individual’s actions can be fairly evaluated by people who do not live in the same society as that individual.", "C": "actions by members of Aztec society who contributed a great deal to their community could be judged as morally good even if those actions were inconsistent with behaviors the Aztecs regarded as good in all contexts.", "D": "similar actions performed by people in different social roles in Aztec society would have been regarded as morally equivalent unless those actions led to different outcomes for the community."}, "correct": "A", "rationale": "Choice A is the best answer because it most logically completes the text’s discussion about Aztec (Nahua) ethics. The text indicates that,\naccording to Purcell’s interpretation of available Aztec philosophical works, the Aztec ethical system views an individual’s actions in relation to\nthat individual’s societal role and how the actions affect the community. The text contrasts this view with another held by some ethicists, namely\nthat actions are morally good or bad regardless of the context in which they occur. Thus, Purcell’s analysis suggests that the Aztecs would have\nasserted that the morality of an individual’s actions are rooted in that person’s position in the community and the actions’ effects and therefore\ncannot be determined in the absence of that context.\nChoice B is incorrect. Although the text indicates that morally judging an action according to Aztec ethics requires an understanding of the\naction’s effects and the individual’s social circumstances, it does not specify that only members of that society can acquire this information.\nChoice C is incorrect because it implies that the Aztecs considered some actions good or bad regardless of the surrounding context, which\ncontradicts the text’s claim that the Aztecs believed that the morality of an individual’s action is dependent on the action’s effects on the\ncommunity and the person’s specific circumstances. Choice D is incorrect. Although the text indicates that in Aztec ethics the morality of an\naction depends in part on how it affects the community, this is only one of the two factors—the other being the person’s societal role—that need\nto be considered. Therefore, it is possible that two actions with the same effect on the community could be considered morally distinct if they\nare performed by individuals in different social roles."}, {"id": "e80ba20d", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "Philosophers note that many people have an intuitive sense that while we ought not to lie, there may be circumstances in which lying is permissible. If this intuition is correct and we lack an inviolable duty to speak truthfully, what grounds opposition to lying in the first place? Japa Pallikkathayil has advanced one answer by appealing to a duty to respect others’ agential interests: the possession of false beliefs constrains agency, and thus we ought not to impede the formation of true beliefs unless doing so prevents a greater constraint on someone’s agency or an otherwise impermissible end. Which choice best states the main idea of the text?", "choices": {"A": "One potential means of justifying opposition to lying is Pallikkathayil’s argument that we have an obligation to respect other people’s agency that entails a commitment to truthfulness except in certain circumstances.", "B": "Many people have an intuitive sense that lying is permissible in some circumstances but lack a principled way to identify those circumstances, and Pallikkathayil’s argument may provide a means of resolving that problem.", "C": "Pallikkathayil’s argument suggests that if we have a duty to respect other people’s agential interests and if possession of false beliefs constrains agency, then we have an inviolable duty to speak truthfully.", "D": "Pallikkathayil’s argument shows that if our intuition that circumstances may make lying permissible is correct, then it is unclear whether there are any grounds for an opposition to lying in the first place."}, "correct": "A", "rationale": "Choice A is the best answer because it most accurately states the main idea of the text. The text begins by noting a common intuition that lying\nmight sometimes be permissible, which raises the question of what is the reason for being against lying. The text then presents Pallikkathayil’s\nanswer to this question: we have a duty to respect others’ agential interests (that is, we have an obligation to allow people to exercise their free\nwill in order to best serve their own ends), false beliefs constrain agency (the implication here being that people who are deceived about what is\ntrue are impeded in acting in their own best interests), and so we should not hinder the formation of true beliefs (we should not deliberately\ndeceive a person) unless doing so prevents a greater limitation on someone’s agency or prevents some otherwise impermissible end (for\nexample, it might be morally permissible to lie to someone in the rare circumstance where a false belief would lead a person to act in their own\nbest interest, and where they would not do so if they knew the truth). Thus, the main idea of the text is that Pallikkathayil offers a potential\njustification for opposing lying based on respecting agency, while still allowing for exceptions in specific circumstances.\nChoice B is incorrect because the text doesn’t focus on people’s lack of a principled way to identify circumstances where lying is permissible or\nindicate that Pallikkathayil’s argument resolves this specific problem. Rather, the text presents Pallikkathayil’s argument that lies limit agency but\nmay be permitted in very specific situations (to prevent a greater limitation on someone’s agency or an otherwise unacceptable outcome) as one\nof a number of possible arguments about why lies are undesirable but sometimes permissible. Choice C is incorrect because it directly\ncontradicts the text. Pallikkathayil’s argument, as described in the text, wouldn’t lead to an \"inviolable duty to speak truthfully.\" On the contrary,\nthe text explicitly states that Pallikkathayil’s position is that interfering with people developing accurate beliefs is wrong, except when such\ninterference prevents either a more significant limitation on someone’s agency or an outcome that would be unacceptable for other reasons.\nThis indicates that Pallikkathayil’s argument allows for some exceptions to the duty to speak truthfully, making it not inviolable. Choice D is\nincorrect because Pallikkathayil’s argument doesn’t suggest that if it is permissible to lie in at least some circumstances, then it is unclear\nwhether there are good reasons for opposing lying in any circumstances. Instead, the text presents Pallikkathayil as offering a specific ground\n\nfor opposing lying (respecting others’ ability to act in their own best interests) while qualifying that assertion by presenting a situation in which\nlying might sometimes be morally permissible."}, {"id": "e2829dd7", "skill": "Command of Evidence", "difficulty": "Hard", "question": "1,500 1,000 500 0 skaerb maeb fo rebmuN Number of Infrared Beam Breaks by Mice Treated with CNO or Saline, by Sex 4 0 4 8 2 6 0 4 8 2 6 0 - 1 2 3 5 6 8 9 0 2 3 5 1 1 1 1 Minutes from treatment females with saline males with saline males with CNO females with CNO To investigate the influence of certain estrogen-responsive neurons on energy expenditure, biologist Stephanie Correa et al. treated female and male mice with either saline solution or clozapine-N4-oxide (CNO), which activates the neurons. Monitoring the activity levels of the mice by measuring how frequently the animals broke infrared beams crossing their enclosures, Correa et al. found that the mice in their study showed sex-specific differences in response to neuron activation: _____ Which choice most effectively uses data from the graph to complete the assertion?", "choices": {"A": "the four groups of mice differed greatly in their activity levels before treatment but showed identical activity levels at the end of the monitoring period.", "B": "saline-treated females showed substantially more activity at certain points in the monitoring period than saline-treated males did.", "C": "CNO-treated females showed more activity relative to saline-treated females than CNO-treated males showed relative to saline-treated males.", "D": "CNO-treated females showed a substantial increase and then decline in activity over the monitoring period, whereas CNO-treated males showed a substantial decline in activity followed by a steep increase."}, "correct": "C", "rationale": "Choice C is the best answer. The graph shows that the CNO-treated females were way more active than the CNO-treated males, while the saline-\ntreated males and females (the control groups) had very similar activity levels. This supports the claim that there were sex-specific differences in\nthe mice’s response to neuron activation.\nChoice A is incorrect. This choice misreads the graph. All four groups of mice started at nearly the same activity level before treatment (see how\nall four points are very close together at -4 minutes, meaning four minutes before treatment). Choice B is incorrect. This choice doesn’t complete\nthe assertion. The assertion is about the mice’s response to neuron activation, so we need to include the data about the CNO-treated females\nand males. Choice D is incorrect. This choice misreads the graph. The line for the CNO-treated males does not show a “substantial decline” until\naround 122 minutes, and there is no “steep increase” afterward."}, {"id": "4a07be59", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Neurobiologists Laura Cuaya, Raúl Hernández-Pérez, and colleagues investigated the language detection abilities of eighteen dogs. The researchers monitored the brain activity of Joey (an Australian shepherd), Mini (a mixed breed), and other dogs while the animals listened to three recordings: one of The Little Prince being read in Spanish, the second in Hungarian, and a third made up of short, randomly selected fragments of the first two, scrambled so that they didn’t resemble human speech. Each dog was familiar with either Spanish or Hungarian, but not both. The team concluded that differences in dogs’ anatomical features may affect their ability to distinguish speech from nonspeech. Which finding from the study, if true, would most directly support the team’s conclusion?", "choices": {"A": "Long-headed dogs accustomed to hearing Spanish tended to show more brain activity when hearing Spanish than long-headed dogs accustomed to hearing Hungarian showed when hearing Hungarian.", "B": "Compared with shorter-headed dogs, longer-headed dogs showed a greater difference in brain activity when hearing either Spanish or Hungarian than when hearing the scrambled recording.", "C": "The pattern of brain activity that long-headed dogs showed when hearing the scrambled recording was different from the pattern of brain activity that short-headed dogs showed when hearing the language they were accustomed to.", "D": "Compared with shorter-headed dogs, longer-headed dogs showed a greater difference in brain activity when hearing the language they were accustomed to than when hearing the other language."}, "correct": "B", "rationale": "Choice B is the best answer because it presents a finding that, if true, would most directly support the research team’s conclusion about\nanatomical features and speech detection in dogs. The text explains that a team of researchers monitored the brain activity of dogs while the\ndogs listened to three recordings: one of spoken Spanish, one of spoken Hungarian, and one of scrambled fragments that weren’t recognizable\nas human speech. The text then states that the team concluded that differences in dogs’ anatomical features may affect their ability to\ndistinguish speech from nonspeech. The finding that longer-headed dogs exhibited a greater difference in brain activity when listening to the\nspeech recordings (in Spanish or Hungarian) versus the nonspeech (scrambled) recording compared with shorter-headed dogs would establish\nan association between an anatomical feature (head length) and responses (as measured by brain activity) to speech versus nonspeech. This\nobserved relationship between head length and brain activity patterns during exposure to speech and nonspeech would support the team’s\nconclusion.\nChoice A is incorrect because it describes a finding about dogs’ responses (as indicated by brain activity) to hearing their respective familiar\nlanguages rather than dogs’ ability to distinguish speech from nonspeech, which is what the team’s conclusion specifically addresses. Moreover,\nthis finding pertains to only one anatomical type (long-headed dogs), so it wouldn’t support the conclusion that anatomical differences may\naffect dogs’ ability to distinguish speech from nonspeech. Choice C is incorrect because it describes a finding involving a comparison between\nlong-headed dogs listening to nonspeech and short-headed dogs listening to speech, which wouldn’t provide enough information to support the\nresearchers’ conclusion that anatomical differences may affect dogs’ ability to distinguish speech from nonspeech. To support that conclusion,\nthe finding would need to show how dogs with different anatomical features (for example, long-headed and short-headed dogs) respond to\nrecordings of speech as well as recordings of nonspeech. Choice D is incorrect because it describes a finding about dogs’ ability to distinguish\nbetween a familiar language and an unfamiliar one, not between speech and nonspeech. While this finding does compare dogs with different\nanatomical features (longer-headed vs. shorter-headed ones), it focuses on language recognition (Spanish vs. Hungarian) rather than the ability\nto distinguish speech from nonspeech, which is what the team’s conclusion specifically addresses."}, {"id": "a7c52fa4", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Mean Time (in Seconds) Spent per Flower for Four Pollinator Genera Pollinator Seconds per intact pin Seconds per damaged pin Seconds per intact thrum Seconds per damaged thrum genus flower flower flower flower Habropoda 2.7 5.4 4.1 9.5 Osmia 5.2 8.2 7.1 8.3 Pierid 2.6 4.0 2.4 1.9 Xylocopa 2.3 2.8 2.5 2.2 To study how floral damage affects the behavior of pollinators, such as bees, a team of researchers punched holes in the floral tissue of flowers from the vine yellow jessamine (Gelsemium sempervirens), a plant that produces flowers that have either a long pistil and a short stamen (pin morphs) or a short pistil and a long stamen (thrum morphs). The researchers then compared the time different insect pollinators spent visiting intact pin and thrum flowers to the time such pollinators spent visiting the artificially damaged pin and thrum flowers. The researchers concluded that the effect of floral damage on time spent per flower varied by both floral morph and the genus of the pollinator. Which choice best describes data from the table that support the researchers’ conclusion?", "choices": {"A": "For pin flowers, damage led to longer times per flower in all pollinator genera, whereas for thrum flowers, damage led to longer times per flower only in Habropoda and Osmia.", "B": "Compared with pollinators belonging to the genus Osmia, pollinators belonging to the genus Xylocopa spent less time on damaged pin flowers but more time on damaged thrum flowers.", "C": "Damage led to shorter times per thrum flower in three pollinator genera (Osmia, Pierid, and Xylocopa), whereas it led to longer times per thrum flower in one pollinator genus (Habropoda).", "D": "Pollinators belonging to the genus Habropoda spent 2.7 seconds on intact pin flowers and 4.1 seconds on intact thrum flowers."}, "correct": "A", "rationale": "Choice A is the best answer because it describes data from the table that support the researchers’ conclusion that the effect of floral damage on\ntime spent per flower varied by both floral morph and the genus of the pollinator. The table presents the average time pollinators spent per floral\nmorph. The data in the table shows that for pin flowers, the average time spent per flower by all pollinator genera was higher for flowers that had\nbeen artificially damaged than for intact flowers. By contrast, for thrum flowers, the difference in time spent on intact and damaged flowers is\nseen for only some pollinator genera. This supports the researchers’ conclusion that both floral morph and the genus of the pollinator are factors\ninvolved in the effect that floral damage has on time pollinators spend per flower.\nChoice B is incorrect. The table shows that pollinators belonging to the genus Xylocopa spent less time on both damaged pin flowers and\ndamaged thrum flowers than pollinators belonging to the genus Osmia did. Choice C is incorrect. The table shows that the artificial damage to\nthe thrum flowers led to shorter average times spent by pollinators on those flowers for only two of the four pollinator genera represented in the\ntable, not three. Furthermore, this choice doesn’t address the effect the artificial damage had on pin flowers; thus, even if accurate, this evidence\n\ndoesn’t support the researchers’ conclusion that both floral morph and pollinator genus affect time spent per flower when a flower has been\ndamaged. Choice D is incorrect. While this statement is true based on the information in the table, it doesn’t provide evidence that supports the\nresearchers’ conclusion that the effect of floral damage on time spent per flower varied by both floral morph and the genus of the pollinator\nbecause this choice provides information only about how much time one pollinator genus spent on intact flowers."}, {"id": "a13c1c66", "skill": "Inferences", "difficulty": "Hard", "question": "Many animals, including humans, must sleep, and sleep is known to have a role in everything from healing injuries to encoding information in long-term memory. But some scientists claim that, from an evolutionary standpoint, deep sleep for hours at a time leaves an animal so vulnerable that the known benefits of sleeping seem insufficient to explain why it became so widespread in the animal kingdom. These scientists therefore imply that _____ Which choice most logically completes the text?", "choices": {"A": "prolonged deep sleep is likely advantageous in ways that have yet to be discovered.", "B": "most traits perform functions that are hard to understand from an evolutionary standpoint.", "C": "it is more important to understand how widespread prolonged deep sleep is than to understand its function.", "D": "many traits that provide significant benefits for an animal also likely pose risks to that animal."}, "correct": "A", "rationale": "Choice A is the best answer. It most logically completes the text. The text says that some scientists can’t explain why prolonged deep sleep is so\nwidespread, given that the known benefits of sleep don’t seem to make up for how vulnerable it leaves an animal. This suggests that prolonged\ndeep sleep probably has unknown evolutionary benefits that make up for the vulnerability.\nChoice B is incorrect. It doesn’t logically complete the text. The text only discusses the benefits and risks of one trait: sleep. So there’s no basis\nfor an inference about “most traits.” Choice C is incorrect. It doesn’t logically complete the text. The text says that it is already known that\nprolonged deep sleep is widespread in the animal kingdom. Rather, what some scientists can’t explain is WHY prolonged deep sleep is so\nwidespread, given that the known benefits of sleep don’t seem to make up for how vulnerable it leaves an animal. Choice D is incorrect. It doesn’t\nlogically complete the text. The text only discusses the benefits and risks of one trait: sleep. So there’s no basis for an inference about “many\ntraits.”"}, {"id": "4ef17800", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Richard II is a play from the 1590s by William Shakespeare. Although King Richard has been vanquished by his cousin Henry Bolingbroke, he intimates that he is not entirely ready to show subservience to his cousin, saying, _____ Which quotation from Richard II most effectively illustrates the claim?", "choices": {"A": "“I have no name, no title,— / No, not that name was given me at the font,— / But ’tis usurp’d:— Alack the heavy day, / That I have worn so many winters out, / And know not now what name to call myself!”", "B": "“Alack, why am I sent for to a king, / Before I have shook off the regal thoughts / Wherewith I reign’d? I hardly yet have learn’d / To insinuate, flatter, bow, and bend my knee.”", "C": "“Still my griefs are mine. / You may my glories and my state depose, / But not my griefs; still am I king of those.”", "D": "“Am I both priest and clerk? Well then, amen. / God save the King! although I be not he; / And yet, amen, if heaven do think him me.”"}, "correct": "B", "rationale": "Choice B is the best answer because it most effectively presents a quotation that illustrates the claim that Richard intimates he is not entirely\nready to show subservience to Bolingbroke. The quotation conveys that Richard has not yet shaken off “the regal thoughts / Wherewith [he]\nreign’d”—that is, he still feels like a king—and that he has “hardly yet have learn’d / To insinuate, flatter, bow, and bend [his] knee,” directly listing\nacts of subservience he is not prepared to perform. By stating his unreadiness to behave subserviently while still inhabiting a regal mindset,\nRichard intimates exactly what the claim describes.\nChoice A is incorrect because this quotation centers on Richard’s anguish over the loss of his name and title; it expresses confusion about his\nidentity rather than illustrating that he is not yet prepared to show subservience to Bolingbroke. Choice C is incorrect because in this quotation\nRichard claims that his griefs remain his own even after his “glories” and “state” have been deposed; it concerns ownership of his suffering and\nidentity rather than any unreadiness to behave subserviently toward Bolingbroke. Choice D is incorrect because the quotation depicts Richard as\nwilling to go along with the assertion of others that Bolingbroke is the rightful king, although God, who in this case serves as an objective arbiter,\nmay have a different opinion on who the rightful king is (“if heaven do think him me”). So the quotation suggests that Richard is willing to behave\nsubserviently even if he thinks he has been wronged; it does not suggest that he is at present unwilling to show subservience."}, {"id": "1ffd60ce", "skill": "Inferences", "difficulty": "Hard", "question": "An analysis by Alain Elayi and colleagues of coins minted in Sidon in the fifth and fourth centuries BCE reveals a change in their composition over time: while a coin from circa 450 BCE contains about 98% silver and 1% copper, a coin from 367 BCE (the end of Ba’alšillem II’s reign) contains 74.2% silver and 24.7% copper, giving it a relatively yellowish appearance that traders would have noticed. Because coins with a silver content below 80% were widely considered unsuitable for trade, Elayi et al. speculate that a crisis in confidence in the currency occurred in Sidon around 367 BCE, which was likely relieved—despite Sidon’s persistent oppressive financial obligations—as a result of Ba’alšillem II’s successor Abd’aštart I’s decision to _____ Which choice most logically completes the text?", "choices": {"A": "proclaim that the percentage of silver in coins suitable for trade would be raised to a threshold higher than 80%.", "B": "keep the amount of silver in Sidonian coins consistent with that in coins minted in 367 BCE but decrease their weight.", "C": "begin minting heavier coins with a proportion of silver to copper similar to that in coins minted in 367 BCE.", "D": "fund the mining of some copper deposits that were not available to Ba’alšillem II."}, "correct": "B", "rationale": "Choice B is the best answer because it most logically completes the text’s discussion of Sidonian coins. As the text explains, researchers\ndetermined that Sidonian coins were made of silver and copper and that from 450 BCE to 367 BCE, the percentage of silver in each coin\ndecreased from 98% to 74.2% while the percentage of copper increased from 1% to 24.7%. The text indicates that because the coins containing\nless than 80% silver weren’t considered suitable for trade (suggesting that copper was less valuable than silver) and looked different from coins\ncontaining more silver, the researchers suspect there was a serious loss in confidence in the currency in Sidon in 367 BCE when the copper\ncontent was high. It’s reasonable to assume that it wasn’t possible to boost confidence simply by devoting a greater amount of valuable silver to\nthe currency, since Sidon was under significant and ongoing financial pressure; however, keeping the total amount of silver the same and\nreducing the amount of copper in the coins would have resulted in smaller coins with a higher percentage of silver. Therefore, it makes sense to\nsuggest that Abd’aštart I (the ruler after 367 BCE) likely restored confidence in the currency by deciding to keep the amount of silver in Sidonian\ncoins consistent with that in coins minted in 367 BCE but to decrease the coins’ weight.\nChoice A is incorrect because the text conveys that a crisis in confidence in the currency of Sidon likely occurred around 367 BCE because the\npercentage of silver in coins had fallen below 80% (presumably because Sidon’s financial pressures meant that less silver was available for\ncurrency), making the coins unsuitable for trade. Thus, announcing that the threshold for the percentage of silver in coins would be raised—that\nis, that coins would need to contain even more than 80% silver to be suitable for trade—likely would have worsened the crisis rather than relieved\nit. Choice C is incorrect because the text strongly suggests that a crisis in confidence in the currency of Sidon was caused by the proportion of\nsilver to copper in the coins in 367 BCE, with 74.2% being too little silver for the coins to be considered suitable for trade; therefore, it’s unlikely\nthat minting coins with a similar proportion of silver to copper (that is, still around 74.2% silver) would have restored confidence, even if the coins\nwere heavier. Choice D is incorrect because the text gives no indication that funding the mining of more copper would have relieved a crisis in\nconfidence in the currency of Sidon. The text establishes that Sidonian coins that visibly contained copper weren’t considered suitable for trade,\nso Abd’aštart I wouldn’t have wanted to add even more copper to them, and it’s unclear how else copper mining would affect views of the\ncurrency."}, {"id": "16025337", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "The following text is adapted from William Shakespeare’s 1609 poem “Sonnet 27.” The poem is addressed to a close friend as if he were physically present. Weary with toil, I [hurry] to my bed, The dear repose for limbs with travel tired; But then begins a journey in my head To work my mind, when body’s work’s expired: For then my thoughts—from far where I abide— [Begin] a zealous pilgrimage to thee, And keep my drooping eyelids open wide, What is the main idea of the text?", "choices": {"A": "The speaker is asleep and dreaming about traveling to see the friend.", "B": "The speaker is planning an upcoming trip to the friend’s house.", "C": "The speaker is too fatigued to continue a discussion with the friend.", "D": "The speaker is thinking about the friend instead of immediately falling asleep."}, "correct": "D", "rationale": "Choice D is the best answer it most accurately states the main idea of the text. The speaker describes going to bed for “repose” (rest) but finding\nthat his thoughts are focused on the friend the speaker is addressing, and the thoughts are keeping the speaker awake.\nChoice A is incorrect because the speaker isn’t asleep; the thoughts about the friend are keeping the speaker awake. Choice B is incorrect\nbecause the speaker isn’t talking about taking a literal trip; rather, the speaker uses the metaphor of a journey to describe internal thoughts.\nChoice C is incorrect because the speaker isn’t having a discussion with the friend."}, {"id": "20583752", "skill": "Command of Evidence", "difficulty": "Hard", "question": "“The Poet Walt Whitman” is an 1887 essay by José Martí, a Cuban author and political activist, originally written in Spanish. In the essay, Martí explores the value of literature, arguing that a society’s spiritual well-being depends on the character of its literary culture: _____ Which quotation from a translation of “The Poet Walt Whitman” most effectively illustrates the claim?", "choices": {"A": "“Poetry, which brings together or separates, which fortifies or brings anguish, which shores up or demolishes souls, which gives or robs men of faith and vigor, is more necessary to a people than industry itself, for industry provides them with a means of subsistence, while literature gives them the desire and strength for life.”", "B": "“Every society brings to literature its own form of expression, and the history of the nations can be told with greater truth by the stages of literature than by chronicles and decades.”", "C": "“Where will a race of men go when they have lost the habit of thinking with faith about the scope and meaning of their act
