es for the tickets under the\n\"pay what you think it’s worth\" condition than they do under both the \"pay what you can\" and the \"pay what you want\" conditions. That is, the data\nsuggest that both groups of participants named higher prices when considering the value of the tickets than when considering either what they\ncould afford or wanted to pay, a finding that supports the idea that sellers can benefit when prompting consumers to consider their own\nvaluations when they choose prices.\nChoice A is incorrect because it contradicts information in the graph. Although the graph shows that students in Study 2 assigned a higher value\nto the tickets than did the age-diverse group in Study 1, which would support the idea that consumer valuations were heterogeneous, the graph\nshows that in the \"pay what you can\" (i.e., what you can afford) condition, the students in Study 2 assigned a higher price (about $40), not a lower\nprice, than the age-diverse group in Study 1 did (about $30). Moreover, even if it were true that the students had assigned a lower price in this\ncondition, it wouldn’t support the result described in the text, only that the participants across the two studies had different ideas of what they\ncan afford to pay. Choice B is incorrect. Although a finding that participants tended to choose prices that were closest to the actual ticket costs\nin the \"pay what you think it’s worth\" condition would support the idea that sellers benefit by prompting consumers to think about their own\nvaluations (since it’s implied that sellers would lose money in the other conditions, where chosen prices were lower than the participants’\nvaluations), neither the text nor the graph addresses how any of the prices chosen by the study participants relate to the tickets’ actual market\nprice. Choice D is incorrect. Although the wide variation in participant valuations would support the idea that consumer valuations tend to be\nheterogeneous, neither the text nor the graph provides any information from which to discern the relative levels of variance among the responses\nfrom participants in either study."}, {"id": "7f293254", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Art collectives, like the United States- and Vietnam-based collective The Propeller Group or Cuba’s Los Carpinteros, are groups of artists who agree to work together: perhaps for stylistic reasons, or to advance certain shared political ideals, or to help mitigate the costs of supplies and studio space. Regardless of the reasons, art collectives usually involve some collaboration among the artists. Based on a recent series of interviews with various art collectives, an arts journalist claims that this can be difficult for artists who are often used to having sole control over their work. Which quotation from the interviews best illustrates the journalist’s claim?", "choices": {"A": "“The first collective I joined included many amazingly talented artists, and we enjoyed each other’s company, but because we had a hard time sharing credit and responsibility for our work, the collective didn’t last.”", "B": "“We work together, but that doesn’t mean that individual projects are equally the work of all of us. Many of our projects are primarily the responsibility of whoever originally proposed the work to the group.”", "C": "“Having worked as a member of a collective for several years, it’s sometimes hard to recall what it was like to work alone without the collective’s support. But that support encourages my individual expression rather than limits it.”", "D": "“Sometimes an artist from outside the collective will choose to collaborate with us on a project, but all of those projects fit within the larger themes of the work the collective does on its own.”"}, "correct": "A", "rationale": "Choice A is the best answer because it presents the quotation that best illustrates the journalist’s claim. By indicating that a collective didn’t\ncontinue because it was hard to share credit and responsibilities within the group even though the company was enjoyable, the quotation shows\nthat working collaboratively can be difficult for artists who are used to having complete control over their work.\nChoice B is incorrect because the quotation indicates that members of a collective are able to collaborate together and have agreed on a fair way\nto manage their responsibilities; this doesn’t demonstrate the challenge of sharing control among members of a collective. Choice C is incorrect\nbecause the quotation highlights the support and encouragement of individual expression an artist experiences due to working in a collective;\nthese positive aspects don’t demonstrate the challenge of sharing control among members of a collective. Choice D is incorrect because the\nquotation doesn’t address any challenges of sharing control among members of a collective; it simply indicates that artists sometimes choose\nto work with collectives without having to be a member. Therefore, the quotation doesn’t illustrate the journalist’s claim."}, {"id": "4d38c2ea", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Gorgets, or necklaces with large pendants, have been part of the ceremonial attire of tribes from the US Southeast for centuries. One of the oldest examples, the Fairfield Gorget, was found in Fairfield, Missouri, in 1958. Its overall design resembles that of other art from the region during the Mississippian period (900–1600 CE). Yet the image on the gorget is of a jaguar—a species whose range doesn’t extend to Missouri. Jaguar images are common in ancient Mexican art, and Mexico lies squarely in the species’ range. Therefore, some scholars argue that long- distance trade in Mexican art objects brought the imagery to Missouri, where a local artist could have adopted it and incorporated it into the Fairfield Gorget. Which finding, if true, would most strongly support the underlined explanation?", "choices": {"A": "The Fairfield Gorget is dated not to the Mississippian period but instead to the earlier Woodland period, which ended around 900 CE.", "B": "The range of the jaguar is shown to have expanded dramatically after the Mississippian period came to a close around 1600 CE.", "C": "An ancient Mexican art object is found at a site that dates to the Mississippian period and is close to where the Fairfield Gorget was found.", "D": "Certain works by present-day artists from Southeastern tribes reflect outside cultural influences, including contemporary Mexican art."}, "correct": "C", "rationale": "Choice C is the best answer because it presents a finding that, if true, would most strongly support the underlined explanation that the jaguar\nimagery on the Fairfield Gorget could have been inspired by art objects brought to Missouri from Mexico. The text describes the Fairfield Gorget\nas one of the oldest examples of these necklaces, noting that it’s similar to other art from the Mississippian period except for its image of a\njaguar. The text goes on to explain that this is unusual because the jaguar’s range didn’t include Missouri. The Fairfield Gorget’s artist likely\nwouldn’t have encountered a live jaguar, but since such jaguar images were common in ancient Mexican art (and the jaguar’s range did include\nMexico), perhaps some of that art inspired the gorget’s artist. Therefore, evidence that an ancient Mexican art object had been found at a site\nthat was close to the Fairfield Gorget in both location and time period would strongly support the explanation that long-distance trade from\nMexico took place during the Mississippian period and that jaguar imagery could have reached Missouri by those means.\nChoice A is incorrect. The underlined explanation indicates that Mexican artistic influence preceded the creation of the Fairfield Gorget. An\nartifact from Mexico that appeared in Missouri only after the gorget was created cannot support such a claim. Choice B is incorrect. The\nunderlined explanation pertains to whether the jaguar image on the Fairfield Gorget was suggested to the Mississippian artist who made it by\nencounters with depictions of jaguars in Mexican art. The appearance of jaguars in Missouri after the Mississippian period cannot provide\nevidence for such a claim. Choice D is incorrect. The underlined explanation pertains to influence that Mexican art might have had on\nMississippian art, restricted to the period from 900 CE to 1600 CE. The actions of contemporary artists cannot provide evidence for centuries-old\nnetworks of artistic influence and exchange."}, {"id": "5cf5c0d3", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Credited Film Output of James Young Deer, Dark Cloud, Edwin Carewe, and Lillian St. Cyr Individual Years active Number of films known and commonly credited James Young Deer 1909–1924 33 (actor), 35 (director), 10 (writer) Dark Cloud 1910–1920 35 (actor), 1 (writer) Edwin Carewe 1912–1934 47 (actor), 58 (director), 20 (producer), 4 (writer) Lillian St. Cyr (Red Wing) 1908–1921 66 (actor) Some researchers studying Indigenous actors and filmmakers in the United States have turned their attention to the early days of cinema, particularly the 1910s and 1920s, when people like James Young Deer, Dark Cloud, Edwin Carewe, and Lillian St. Cyr (known professionally as Red Wing) were involved in one way or another with numerous films. In fact, so many films and associated records for this era have been lost that counts of those four figures’ output should be taken as bare minimums rather than totals; it’s entirely possible, for example, that _____ Which choice most effectively uses data from the table to complete the example?", "choices": {"A": "Dark Cloud acted in significantly fewer films than did Lillian St. Cyr, who is credited with 66 performances.", "B": "Edwin Carewe’s 47 credited acting roles includes only films made after 1934.", "C": "Lillian St. Cyr acted in far more than 66 films and Edwin Carewe directed more than 58.", "D": "James Young Deer actually directed 33 films and acted in only 10."}, "correct": "C", "rationale": "Choice C is the best answer because it uses data from the table to effectively exemplify the idea that the film outputs of the four individuals\nincluded in the table should be considered bare minimums—that is, that we should assume that the individuals actually had higher outputs than\nthose recorded. The table presents the years during which the individuals were active and the number of known films the individuals are credited\nin. The table indicates that Lillian St. Cyr has 66 film credits as an actor and that Edwin Carewe has 58 film credits as a director; it follows that if\nsome films and records for the era were lost, it’s possible that Lillian St. Cyr acted in far more than 66 films and that Edwin Carewe directed more\nthan 58 films.\nChoice A is incorrect because it doesn’t effectively exemplify the idea that the film outputs of the four individuals included in the table should be\nconsidered bare minimums. Rather than addressing the idea that the individuals likely had higher outputs than those presented in the table, this\nchoice simply compares data from the table to make the point that Dark Cloud has fewer credited acting roles than Lillian St. Cyr (35 and 66,\nrespectively). Choice B is incorrect because it misrepresents data from the table, even though it may exemplify the idea that the film outputs of\nthe four individuals included in the table should be considered bare minimums by implying that Edwin Carewe acted in more than 47 films. The\ntable indicates that Edwin Carewe was active from 1912 to 1934, meaning that his 47 credited acting roles were in films made before or during\n1934, not after that time. Choice D is incorrect because it doesn’t effectively exemplify the idea that the film outputs of the four individuals\nincluded in the table should be considered bare minimums. Instead of addressing the idea that the individuals likely had higher outputs than\n\nthose recorded, this choice suggests that James Young Deer actually acted in and directed fewer films than presented in the table (only 33\nknown films as a director instead of 35, and only 10 known films as an actor instead of 33)."}, {"id": "a12a83ce", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "The following text is from William Shakespeare’s play The Tempest, first performed in 1611. Miranda has lived on an island with her father, Prospero, since she was three years old. Prospero has stated that Miranda likely does not remember anything other than her life on the island. MIRANDA: ’Tis far off, And rather like a dream than an assurance That my remembrance warrants. Had I not Four or five women once that tended me? PROSPERO: Thou hadst, and more, Miranda. But how is it That this lives in thy mind? What seest thou else In the dark backward and abysm of time? If thou remember’st ought ere thou camest here, How thou camest here thou mayst. In the text, which point does Prospero most directly make about Miranda and her memories?", "choices": {"A": "Miranda’s reminiscences about her early childhood have a melancholy quality that betrays her discontented view of her current circumstances.", "B": "Miranda’s doubts about the accuracy of one recollection of a place other than the island are clouding her judgment and seem to be making her reluctant to explore her recollection of traveling to the island.", "C": "Miranda’s ability to summon details of an experience she had before arriving on the island suggests that she may also be able to summon details of her arrival on the island.", "D": "Miranda’s impression of a scene is vague because she is remembering a scenario she had daydreamed about as a child rather than a scenario that had occurred in reality."}, "correct": "C", "rationale": "Choice C is the best answer because it presents a point that Prospero makes about Miranda. The text begins with Miranda responding to\nProspero’s claim that she probably doesn’t remember her life before the island. She describes a distant memory, asking if she had \"four or five\nwomen\" caring for her. Prospero confirms this (\"thou hadst\") and then asks what else she can recall, stating that because she remembers one\nthing from the time before she lived on the island (\"ought ere thou camest here\"), she might also remember arriving on the island (\"how thou\ncamest here\"). That is, Prospero indicates that Miranda’s ability to summon details of an experience from before her arrival on the island\nsuggests that she may also be able to summon details of her arrival.\n\nChoice A is incorrect because Prospero doesn’t say anything about how Miranda presents her early childhood memory of having several people\ncare for her—he indicates only his surprise that she remembers something from so long ago (\"the dark backward and abysm of time\") and his\nthought that she may also be able to recall another childhood event: her arrival on the island. Further, Prospero doesn’t suggest that he believes\nMiranda is discontent in her current circumstances. Choice B is incorrect. Although Miranda suggests some doubt about her recollection of a\nplace other than the island, in that she describes it as \"like a dream\" she can’t be certain of, Prospero doesn’t mention her uncertainty—though he\nhimself wonders how it is possible that she correctly recalls something from so long ago (\"abysm of time\"). Rather than indicating that doubt is\nmaking Miranda reluctant, Prospero simply states that Miranda may have the ability to remember traveling to the island. Choice D is incorrect.\nAlthough Miranda describes a vague impression of several people who cared for her as a young child and states that it is \"rather like a dream\"\ninstead of something she is certain is real, Prospero doesn’t indicate that Miranda is remembering a childhood daydream. Instead, he confirms\nthat what Miranda remembers actually happened, answering her question about having had caregivers with \"thou hadst,\" and asks her what else\nshe can remember from long ago."}, {"id": "5cd55c77", "skill": "Inferences", "difficulty": "Hard", "question": "During their larval phase, numerous species of coral reef fish are drawn toward areas where light is present. To better understand how artificial light at night (ALAN) might affect some coral reef fish, researchers explored the effect of exposure to low levels of ALAN on the reproductive success of the common clownfish (Amphiprion ocellaris). While exposure to low levels of ALAN had no significant effect on spawning frequency and egg fertilization in A. ocellaris, incubation in the presence of ALAN completely inhibited hatching. These findings suggest that _____ Which choice most logically completes the text?", "choices": {"A": "A. ocellaris that settle in areas with low levels of ALAN have significantly higher rates of successful egg fertilization than A. ocellaris that settle in areas without ALAN do.", "B": "the reproductive success of A. ocellaris would be at risk if they were to selectively settle in regions that are regularly exposed to low levels of ALAN.", "C": "the reproductive success of A. ocellaris is more greatly affected by the presence of low levels of ALAN during incubation than the reproductive success of other species of coral reef fish is.", "D": "the spawning frequency of A. ocellaris was more strongly affected by the presence of low levels of ALAN than egg fertilization was, though both were less affected than incubation."}, "correct": "B", "rationale": "Choice B is the best answer because it most logically completes the text’s discussion of artificial light at night (ALAN) and the common\nclownfish (A. ocellaris). The text indicates that researchers found that when A. ocellaris is exposed to low levels of ALAN, spawning frequency\nand egg fertilization aren’t significantly affected but hatching is completely inhibited—that is, the eggs never hatch. Therefore, if A. ocellaris were\nto settle only in regions where the fish would be regularly exposed to low levels of ALAN, their eggs would stop hatching and their reproductive\nsuccess would be at risk.\nChoice A is incorrect because the text indicates that exposure to low levels of ALAN had no significant effect on egg fertilization for A. ocellaris,\nso there’s no reason to expect there would be any significant difference in rates of successful egg fertilization between areas with low levels of\nALAN and areas without ALAN. Choice C is incorrect because the text doesn’t discuss the particular effects of low levels of ALAN on any species\nof coral reef fish besides A. ocellaris. For this reason, there’s no support in the text for the idea that the reproductive success of A. ocellaris is\nmore greatly affected by the presence of low levels of ALAN than the reproductive success of other species of coral reef fish is. Choice D is\nincorrect. The text does indicate that A. ocellaris incubation was most strongly affected by low levels of ALAN, but it doesn’t indicate that there\nwas a greater effect on spawning frequency than on egg fertilization; in fact, the text states that there was no significant effect on either."}, {"id": "b2e54b50", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Correlations Between Congestion Ratings and Features of the Crowd in Raters’ Immediate Vicinity Crowd feature Before obstacle After obstacle Overall Density 0.8592 0.7308 0.7447 Velocity −0.9357 −0.9518 −0.8587 Researcher Xiaolu Jia and colleagues monitored individuals’ velocity and the surrounding crowd density as a group of study participants walked through a space and navigated around an obstacle. Participants rated how congested it seemed before the obstacle, after the obstacle, and overall, and the researchers correlated those ratings with velocity and density. (Correlations range from −1 to 1, with greater distance from 0 indicating greater strength). The researchers concluded that the correlations with velocity are stronger than those with density. Which choice best describes data from the table that support the researchers’ conclusion?", "choices": {"A": "The correlation between congestion ratings before the obstacle and density is further from 0 than the correlation between overall congestion rating and velocity is.", "B": "The correlation between congestion ratings before the obstacle and velocity is further from 0 than the correlation between congestion overall and velocity is.", "C": "For each of the three ratings, the correlation with velocity is negative while the correlation with density is positive.", "D": "For each of the three ratings, correlations with velocity are further from 0 than the corresponding correlations with density are."}, "correct": "D", "rationale": "Choice D is the best answer. The text tells us that the farther the correlation is from 0, the “stronger” it is (doesn’t matter if it’s negative or\npositive). The table shows that the correlations with velocity are farther from zero than the correlations with density, which supports the\nconclusion that the correlations with velocity are stronger.\nChoice A is incorrect. This choice doesn’t support the conclusion. It makes an “apples to oranges” comparison by comparing density and velocity\ncorrelations across features instead of comparing them for each feature. Choice B is incorrect. This choice doesn’t support the conclusion. It\ndoesn’t include the density correlations for comparison. Choice C is incorrect. This choice doesn’t support the conclusion. The text tells us that\nthe farther the correlation is from 0, the “stronger” it is: it doesn’t matter for “strength” whether it’s negative or positive."}, {"id": "cca6fae9", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Delta 15-N Values in Seagrass Samples from Four Sites on the Yucatan, 2016– 2017 Site February 2016 October 2016 February 2017 October 2017 Akumal Bay no data available 3.3 2.0 6.3 Mahahual 0.7 no data available 2.5 3.4 Tulum 6.1 5.9 2.3 5.5 Xahuayxol 0.9 0.3 −0.9 1.4 15 Because water from natural, uncontaminated sources is less enriched with the stable nitrogen isotope N than wastewater from human 15 14 activities is, the presence of such wastewater in nature can be detected by examining delta 15-N values (a measure of the ratio of N to N) in plants. Karla A. Camacho-Cruz and colleagues assessed delta 15-N values in the seagrass Thalassia testudinum from sites on Mexico’s Yucatan peninsula with intermediate tourism development, including Akumal Bay and Tulum, and low tourism development, including Mahahual and Xahuayxol, throughout 2016 and 2017. The data suggest that the intermediate-tourism sites experienced influxes of human wastewater. However, the researchers concluded that this happened intermittently. Which choice best describes data from the table that support the underlined conclusion?", "choices": {"A": "Although delta 15-N values were generally higher in Akumal Bay and Tulum than in Mahahual and Xahuayxol, the values were lower in Akumal Bay than in Mahahual and Xahuayxol in February 2017.", "B": "Delta 15-N values reached their lowest level in February 2017 in both Akumal Bay and Tulum, but no data were available for Akumal Bay in February 2016, when the values reached their highest level in Tulum.", "C": "Although all sites showed considerable variation in delta 15-N values, the values remained relatively constant in Akumal Bay from October 2016 to February 2017 and in Tulum from February 2016 to October 2016.", "D": "In Akumal Bay and Tulum, delta 15-N values fluctuated considerably across the three measurements made from October 2016 to October 2017."}, "correct": "D", "rationale": "Choice D is the best answer because it describes data from the table that support the underlined conclusion. The text accompanying the table\nstates that delta 15-N values (a measure of the ratio of two nitrogen isotopes) can be used as an indirect means of measuring the ratio of human\nwastewater to water from uncontaminated sources—the higher the delta 15-N values, the greater the presence of human wastewater. The text\ngoes on to mention an experiment conducted by Camacho-Cruz and colleagues measuring delta 15-N values in seagrass on the Yucatan\npeninsula at several sites, four of which are presented in the table accompanying the text. Two of the sites noted in the table, Akumal Bay and\nTulum, had intermediate tourism development, and two others, Mahahual and Xahuayxol, had low tourism development. It is reasonable to infer\nthat sites with intermediate tourism have a greater human presence than those with low tourism and therefore are subject to greater amounts of\nwastewater and exhibit higher delta 15-N values in seagrass. However, Camacho-Cruz and colleagues found that the increase in delta 15-N\nvalues was not constant. The table supports this conclusion because the two intermediate-tourism sites (Akumal Bay and Tulum) had delta 15-N\n\nvalues that fluctuated considerably—both had higher delta 15-N values than the two low-tourism sites (Mahahual and Xahuayxol) in October\n2016 and October 2017, but in February 2017 the delta 15-N values for the intermediate-tourism sites dropped significantly (in fact, Mahahual, a\nlow-tourism site, had a higher delta 15-N value for that period). The fluctuations in values in Akumal Bay and Tulum support the conclusion that\nthese sites experienced influxes of human wastewater intermittently.\nChoice A is incorrect because it inaccurately describes data from the table: in February 2017 the delta 15-N value in Akumal Bay was higher than\nthe delta 15-N value in Xahuayxol, not lower. Choice B is incorrect because the absence of data for delta 15-N levels in Akumal Bay in February\n2016 would neither prove nor disprove that the presence of human wastewater at Akumal Bay and Tulum was not constant. Despite the\nunavailable data, there is still enough information to conclude that delta 15-N levels at both sites fluctuated significantly and that influxes of\nhuman wastewater therefore happened intermittently. Choice C is incorrect because a constancy in delta 15-N values would not indicate that the\ninflux of human wastewater was intermittent, but rather the opposite. Moreover, the two periods selected are not indicative of general trends in\nthe whole table (for example, the values fluctuated significantly in Akumal Bay between February 2017 and October 2017, and in Tulum between\nOctober 2016 and February 2017)."}, {"id": "f495b554", "skill": "Inferences", "difficulty": "Hard", "question": "Silicon-based photovoltaic cells account for 95% of the cells used in solar panels worldwide despite converting an average of only 18–22% of the sunlight that reaches them. In a study addressing this relative inefficiency, a team led by Laura Miranda-Pérez demonstrated that the addition of a thin layer of the mineral perovskite—which captures the blue range of light in the solar spectrum, whereas silicon captures the red range— allows the cells to convert 29.5% or more of the Sun’s energy into usable electricity. Cells made with only perovskite, however, are no more efficient than silicon-based ones. It’s reasonable to conclude, then, that _____ Which choice most logically completes the text?", "choices": {"A": "photovoltaic cells with both silicon and perovskite are more efficient because they make use of more of the solar spectrum.", "B": "photovoltaic cells with only perovskite and no silicon would likely convert more than 29.5% of the Sun’s energy.", "C": "solar power will remain elusive until photovoltaic cells are replaced with a more practical technology.", "D": "researchers need to evaluate whether other minerals like perovskite are as effective as perovskite seems to be."}, "correct": "A", "rationale": "Choice A is the best answer because it presents the conclusion that most logically completes the text’s discussion of the efficiency of various\nphotovoltaic cells. The text indicates that Miranda-Pérez and her team found that adding a layer of perovskite to silicon-based cells increased the\npercentage of sunlight converted to usable electricity relative to the percentage converted to electricity by silicon-based cells. Using cells with\nonly perovskite and no silicon, however, resulted in no improvement in efficiency over silicon-based cells. The text also states that perovskite\ncaptures light in the blue range of the solar spectrum and silicon captures light in the red range of the spectrum. If perovskite and silicon capture\ndifferent parts of the solar spectrum and the combination of perovskite and silicon results in greater efficiency than the use of either perovskite\nor silicon alone does, then it is reasonable to infer that the improved efficiency of perovskite-silicon cells could be attributable to their making\nuse of more of the solar spectrum than perovskite-based or silicon-based cells do.\nChoice B is incorrect because it is directly contradicted by the text, which says that silicon-based cells convert 18%–22% of the sunlight that\nreaches them to electricity and that cells with only perovskite are no more efficient than silicon-based cells are. Perovskite-only cells thus must\nconvert 22% or less—not more than 29.5%—of the sunlight that reaches them to electricity. Choice C is incorrect because the text focuses on a\npossible improvement to photovoltaic cells and makes no mention of any alternatives to those cells, so there is no reason to conclude that\nphotovoltaic cells must be replaced with some other technology. Additionally, the text presents solar power as something that currently exists, so\nit wouldn’t make sense to conclude that solar power will remain elusive. Choice D is incorrect because nothing in the text suggests that there is a\nneed to evaluate the effectiveness of other minerals than perovskite. In fact, the text gives no indication that it is even possible to use other\nminerals than silicon and perovskite in photovoltaic cells. Instead, the text is focused on the effect of combining perovskite and silicon and the\ndifferent parts of the solar spectrum that perovskite and silicon capture."}, {"id": "16ce90d9", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "In 2018, scientists discovered an immense aggregation of Muusoctopus robustus (pearl octopuses) along a hydrothermal vent 3,200 meters beneath the ocean’s surface. Water temperatures at this site—named the Octopus Garden—climb as high as 11°C, much warmer than the ambient 1.6°C typical at this depth. Based on observations made over three years, scientists concluded that temperatures at the site likely confer reproductive benefits and that the site is used exclusively for reproduction—6,000 M. robustus adults, hatchlings, and eggs were observed at the garden, but no juveniles were present. Which statement about M. robustus and the Octopus Garden is best supported by the text?", "choices": {"A": "M. robustus leave the Octopus Garden upon reaching an intermediary stage of development.", "B": "The M. robustus population at the Octopus Garden remains stable despite variations in water temperature.", "C": "M. robustus nests in the Octopus Garden contain on average fewer but larger eggs than nests at similar ocean depths.", "D": "The Octopus Garden provides an ideal feeding ground for M. robustus hatchlings."}, "correct": "A", "rationale": "Choice A is the best answer because it most logically completes the text’s discussion of the M. robustus population at the Octopus Garden. The\ntext states that the scientists concluded that the site is likely used only for reproduction because over three years they saw many adults, freshly\nhatched octopuses, and eggs but didn’t see any juveniles. This suggests that the M. robustus octopuses that hatch at the Octopus Garden leave\nthe site when they reach an intermediary state of development, returning only as adults for reproductive purposes.\nChoice B is incorrect because the text never discusses the stability of the M. robustus population at the site, only that the scientists observed\n6,000 adults, hatchlings, and eggs there. Further, the text presents the site’s temperatures as likely beneficial. Choice C is incorrect because the\ntext doesn’t provide any details about the eggs at the site and makes no mention of nests; it indicates only that eggs are present along with\nhatchlings and adults. Choice D is incorrect because the text makes no mention of the hatchlings feeding at the Octopus Garden, indicating only\nthat the temperatures at the site are probably beneficial and that the site is likely used for reproduction."}, {"id": "7dab4d5d", "skill": "Command of Evidence", "difficulty": "Hard", "question": "600 540 480 420 360 300 240 180 120 60 0 serocs rehgih( erocs tset naeM )ssenevitnetta retaerg etacidni Mean Attentiveness Scores by Leave Time Condition first second third Test administration no leave 2–4 days leave 1–5 weeks leave To investigate potential cognitive benefits of taking leave from work, psychologist Jan Packer and colleagues conducted a six-month study of Australian university staff members who took no leave from work during the study, took 2–4 days of leave, or took 1–5 weeks of leave. Tests of attentiveness were administered to participants three times during the study: at random for the no-leave staff, and for the rest, one week before their leave, one week following their return to work, and one week after the second test administration. After analyzing the results, the researchers concluded that longer leave times might not confer a greater cognitive benefit than shorter leave times do. Which choice best describes data from the graph that support the researchers’ conclusion?", "choices": {"A": "In the second test administration, participants who took 2–4 days of leave had higher average attentiveness scores than did those who took no leave, but in the third test administration, those who took no leave had higher average scores than those who took 1–5 weeks of leave.", "B": "In the first test administration, participants who took 2–4 days of leave had lower average attentiveness scores than did those who took 1–5 weeks of leave and those who took no leave.", "C": "In both the second and third test administrations, participants who took 2–4 days of leave had higher average attentiveness scores than did participants who took 1–5 weeks of leave.", "D": "In the second and third test administrations, participants who took 2–4 days of leave had higher average attentiveness scores than did those who took no leave."}, "correct": "C", "rationale": "Choice C is the best answer because it describes data from the graph that support Jan Packer and colleagues’ conclusion about the effect of\nleave time on the attentiveness of university employees. According to the text, the researchers’ study design included a group of employees who\ntook no leave, a group who took 2–4 days of leave, and a group who took 1–5 weeks of leave. The participants who took leave were tested for\nattentiveness one week before their leave (the first test administration), one week after their return to work (the second test administration), and\ntwo weeks after their return (the third test administration). The participants who took no leave were tested three times at random. The graph\nshows that at one week after their return to work, participants who took only 2–4 days of leave had an average attentiveness score of between\n540 and 600, while participants who took 1–5 weeks of leave had an average score of between 480 and 540. At two weeks after their return to\nwork, those who took only 2–4 days of leave had an average score of between 480 and 540, while those who took 1–5 weeks of leave had an\naverage score of approximately 480. In other words, the graph shows that on both post-leave testing dates, participants with longer leave times\nhad lower average attentiveness scores than those with shorter leave times. Since attentiveness is an indicator of cognitive functioning, these\ndata confirm Packer and colleagues’ conclusion that longer leave times might not confer a greater cognitive benefit than shorter leave times do.\nChoice A is incorrect. The graph does show that in the second test administration, participants who took 2–4 days of leave had higher average\nattentiveness scores than did those who took no leave and also shows that in the third test administration, those who took no leave had higher\naverage scores than those who took 1–5 weeks of leave. But neither of these findings has a direct bearing on the researchers’ conclusion, which\nconcerns a comparison of participants who took 2–4 days of leave with those who took 1–5 weeks, rather than a comparison of either group\nwith participants who took no leave. Choice B is incorrect. Although the graph does show that in the first test administration, participants who\ntook 2–4 days of leave had lower average attentiveness scores than did those who took 1–5 weeks of leave and those who took no leave, this\ntest administration occurred before any participants went on leave; therefore, these results have no bearing on the researchers’ conclusion about\nhow the amount of leave taken by participants affected their cognitive functioning. Choice D is incorrect. Although the graph does show that in\nthe second and third test administrations, participants who took 2–4 days of leave had higher average attentiveness scores than did those who\ntook no leave, the researchers’ conclusion is about the effects of short leave compared with the effects of long leave, not the effects of short\nleave compared with the effects of no leave. These results are therefore irrelevant to the conclusion."}, {"id": "014b3394", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Average Number and Duration of Torpor Bouts and Arousal Episodes for Alaska Marmots and Arctic Ground Squirrels, 2008– 2011 Feature Alaska marmots Arctic ground squirrels torpor bouts 12 10.5 duration per bout 13.81 days 16.77 days arousal episodes 11 9.5 duration per episode 21.2 hours 14.2 hours When hibernating, Alaska marmots and Arctic ground squirrels enter a state called torpor, which minimizes the energy their bodies need to function. Often a hibernating animal will temporarily come out of torpor (called an arousal episode) and its metabolic rate will rise, burning more of the precious energy the animal needs to survive the winter. Alaska marmots hibernate in groups and therefore burn less energy keeping warm during these episodes than they would if they were alone. A researcher hypothesized that because Arctic ground squirrels hibernate alone, they would likely exhibit longer bouts of torpor and shorter arousal episodes than Alaska marmots. Which choice best describes data from the table that support the researcher’s hypothesis?", "choices": {"A": "The Alaska marmots’ arousal episodes lasted for days, while the Arctic ground squirrels’ arousal episodes lasted less than a day.", "B": "The Alaska marmots and the Arctic ground squirrels both maintained torpor for several consecutive days per bout, on average.", "C": "The Alaska marmots had shorter torpor bouts and longer arousal episodes than the Arctic ground squirrels did.", "D": "The Alaska marmots had more torpor bouts than arousal episodes, but their arousal episodes were much shorter than their torpor bouts."}, "correct": "C", "rationale": "Choice C is the best answer because it describes data from the table that support the researcher’s hypothesis. According to the text, the\nresearcher hypothesized that Arctic ground squirrels would exhibit longer torpor bouts and shorter arousal episodes than Alaska marmots do—\nor, put the other way, that the marmots would show shorter torpor bouts and longer arousal episodes than the ground squirrels do. The table\nshows data about torpor bouts and arousal episodes for the two species from 2008 to 2011. According to the table, the average duration of\ntorpor bouts was 13.81 days for Alaska marmots, shorter than the average of 16.77 days for Arctic ground squirrels, and the average duration of\narousal episodes was 21.2 hours for Alaska marmots, longer than the average of 14.2 hours for Arctic ground squirrels. Thus, the table supports\nthe researcher’s hypothesis by showing that Alaska marmots had shorter bouts of torpor and longer arousal episodes than Arctic ground\nsquirrels did.\nChoice A is incorrect because it inaccurately describes data from the table and doesn’t support the researcher’s hypothesis. The table shows\nthat the average duration of arousal episodes was less than a day for both Alaska marmots (21.2 hours) and Arctic ground squirrels (14.2\nhours). Additionally, information about arousal episodes for Alaska marmots and Arctic ground squirrels isn’t sufficient to support a hypothesis\ninvolving comparisons of both arousal episodes and torpor bouts for those animals. Choice B is incorrect because it doesn’t support the\n\nresearcher’s hypothesis, which involves comparisons of arousal episodes as well as torpor bouts for Alaska marmots and Arctic ground\nsquirrels. Noting that both animals had torpor bouts lasting several days, on average, doesn’t address arousal episodes at all, nor does it reveal\nhow the animals’ torpor bouts compared. Choice D is incorrect because it doesn’t support the researcher’s hypothesis. Although the table does\nshow that Alaska marmots had more torpor bouts (12) than arousal episodes (11) and that their arousal episodes were much shorter than their\ntorpor bouts (21.2 hours and 13.81 days, respectively), comparing data across only Alaska marmot behaviors isn’t sufficient to support a\nhypothesis about torpor and arousal behaviors of both Alaska marmots and Arctic ground squirrels."}, {"id": "66fd248a", "skill": "Command of Evidence", "difficulty": "Hard", "question": "“Poetry” is a 1919 poem by Marianne Moore. The poem highlights an ambivalence toward poetry as the speaker acknowledges its merits while also expressing a sense of displeasure, writing _____ Which quotation from “Poetry” most effectively illustrates the claim?", "choices": {"A": "“nor is it valid / to discriminate against ‘business documents and / school-books’; all these phenomena are important.”", "B": "“One must make a distinction / however: when dragged into prominence by half poets, the result is not / poetry”", "C": "“when [poems] become so derivative as to become unintelligible, the / same thing may be said for all of us—that we / do not admire what / we cannot understand.”", "D": "“Reading [poetry], however, with a perfect contempt for it, one discovers that there is in / it after all, a place for the genuine.”"}, "correct": "D", "rationale": "Choice D is the best answer because it most effectively uses a quotation from \"Poetry\" to illustrate the claim that the poem highlights an\nambivalence, or a conflicted attitude, toward poetry. In the quotation, the speaker suggests that one might read poetry with \"contempt,\" or\ndisdain, for it, but even with this negative attitude one will find \"a place for the genuine.\" Because the quotation expresses conflicting attitudes\ntoward poetry, it effectively illustrates the speaker’s ambivalence in discussing the merits and displeasure of reading poetry.\nChoice A is incorrect because it doesn’t mention poetry or show ambivalence. Choice B is incorrect. Although the idea of \"half poets\" may seem\nto relate to ambivalence, the speaker mentions only negative attitudes toward certain works and the quotation therefore lacks a contrasting\npositive or neutral attitude that would be needed to indicate ambivalence. Choice C is incorrect because the speaker mentions only negative\nattitudes toward certain works and the quotation therefore lacks a contrasting positive or neutral attitude that would be needed to indicate\nambivalence."}, {"id": "5869a196", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "Hypothesizing that reliance on smartphones for information retrieval will lead a person to incorrectly remember instances of phone-assisted retrieval as instances of retrieval from memory, researchers asked participants general-knowledge trivia questions, instructing them to answer certain questions using only their smartphone and other questions using only their memory. When surveyed a week later, participants exhibited higher levels of misattribution for answers retrieved in the smartphone condition than for those retrieved in the memory condition, a finding that the researchers claimed supported their hypothesis. Which question would be most useful to answer in determining the validity of the researchers’ claim as it is presented in the text?", "choices": {"A": "Were participants as likely to remember the source of their information when asked a week later as they would have been if asked immediately after answering the trivia questions?", "B": "Were participants less confident about the accuracy of information they were instructed to retrieve from a smartphone than they were of that retrieved from their own memory?", "C": "How likely were participants to answer all the trivia questions correctly in both the smartphone and the memory conditions?", "D": "How did participants attribute information they were instructed to retrieve from a smartphone in instances when they already knew that information independently of their phone?"}, "correct": "D", "rationale": "Choice D is the best answer because it identifies a question that directly addresses a potential confounding factor in the research. The text\ndiscusses a study investigating source misattribution for information retrieved with the assistance of a smartphone—that is, how well people\nremember whether they used a smartphone to look up information or retrieved the information from their memory. The researchers hypothesized\nthat smartphone reliance causes people to mistakenly think that they retrieved the information from their memory when they in fact used a\nsmartphone. To test this hypothesis, the researchers instructed participants to look up answers to some trivia questions on smartphones and to\nanswer some questions using only their memory. The text then indicates that a week later, participants were more likely to misremember\nsmartphone-assisted answers as coming from memory than to misremember memory-based answers as coming from smartphones. The\nresearchers claimed that the higher misattribution rates for the smartphone-retrieval condition supported their hypothesis. However, the text\ndoesn’t specify whether the study design accounted for the possibility that some participants might have known many—perhaps even all—of the\ntrivia answers beforehand. If participants already knew some answers they were instructed to look up on their phones, their later attribution of\nthose answers to memory might be accurate rather than a misattribution. Knowing how participants attributed information in such cases would\nhelp determine whether the observed effect reflects smartphone-induced misattribution or simply participants’ recall of prior knowledge. Thus, in\nevaluating the validity of the researchers’ claim, it would be most useful to know how participants attributed information they were instructed to\nretrieve from a phone in instances where they already knew the information.\nChoice A is incorrect. Although survey timing is a methodological consideration, it doesn’t help distinguish between genuine misattribution\ncaused by smartphone reliance and other explanations for the observed effect. Though it’s plausible that participants’ recollections of their\ninformation source may have been more accurate immediately after answering the trivia questions than they would have been a week later, the\none-week delay would affect both conditions equally and doesn’t specifically challenge the researchers’ claim about smartphone-induced\nmisattribution. Choice B is incorrect because confidence in the accuracy of retrieved information doesn’t directly pertain to source\nmisattribution. The researchers’ claim concerns whether participants believed information came from their smartphone or their memory, not how\nconfident they were in its correctness. Instead, a useful question would need to address the source-attribution process itself. Choice C is\n\nincorrect because the accuracy of the participants’ answers doesn’t bear on the researchers’ claim about source misattribution. The claim\nconcerns the remembered origin of answers, not their correctness. Instead, the relevant issue is whether participants who looked up answers\nthey already knew might have attributed those answers to memory regardless of which of the two experimental conditions they answered those\nquestions under."}, {"id": "9c407117", "skill": "Command of Evidence", "difficulty": "Hard", "question": "A student performs an experiment testing her hypothesis that a slightly acidic soil environment is more beneficial for the growth of the plant Brassica rapa parachinensis (a vegetable commonly known as choy sum) than a neutral soil environment. She plants sixteen seeds of choy sum in a mixture of equal amounts of coffee grounds (which are highly acidic) and potting soil and another sixteen seeds in potting soil without coffee grounds as the control for the experiment. The two groups of seeds were exposed to the same growing conditions and monitored for three weeks. Which finding, if true, would most directly weaken the student’s hypothesis?", "choices": {"A": "The choy sum planted in the soil without coffee grounds were significantly taller at the end of the experiment than the choy sum planted in the mixture of soil and coffee grounds.", "B": "The choy sum grown in the soil without coffee grounds weighed significantly less at the end of the experiment than the choy sum grown in the mixture of soil and coffee grounds.", "C": "The choy sum seeds planted in the soil without coffee grounds sprouted significantly later in the experiment than did the seeds planted in the mixture of soil and coffee grounds.", "D": "Significantly fewer of the choy sum seeds planted in the soil without coffee grounds sprouted plants than did the seeds planted in the mixture of soil and coffee grounds."}, "correct": "A", "rationale": "Choice A is the best answer because it describes an experimental outcome that would most directly weaken the student’s hypothesis. According\nto the text, the student hypothesizes that Brassica rapa parachinensis (choy sum) will benefit more from acidic soil than it will from neutral soil.\nThe text then explains that the student planted 16 choy sum seeds in potting soil with coffee grounds added to increase acidity and another 16\nseeds in soil without coffee grounds as a control (a group identical to the experimental group except for the experimental modification being\ntested). If the hypothesis were correct, the plants in the more acidic soil-and-coffee-grounds mixture would grow faster than those in the control\ngroup. However, choice A proposes a scenario in which the plants in soil without coffee grounds were “significantly taller” than those in the more\nacidic mixture—an outcome that weakens the hypothesis that higher acidity is beneficial to the plants’ growth.\nChoice B is incorrect. If the choy sum planted in the neutral soil produced less plant matter and therefore weighed less than the choy sum\nplanted in the acidic soil-and-coffee-grounds mixture, this finding would strengthen the student’s hypothesis, not weaken it. Choice C is incorrect.\nIf seeds planted in neutral soil (without coffee grounds) sprouted significantly later than seeds planted in the acidic soil-and-coffee-grounds\nmixture, this finding would strengthen, not weaken, the student’s hypothesis that acidic soil benefits choy sum. Choice D is incorrect. If seeds\nplanted in the neutral soil (without coffee grounds) sprouted significantly fewer plants than seeds planted in the acidic soil-and-coffee-grounds\nmixture did, this finding would strengthen, not weaken, the student’s hypothesis that choy sum benefits from acidic soil."}, {"id": "6d69ab93", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Initially observed in 2017, the interstellar object ‘Oumuamua is the first object of its kind to be seen in our solar system. Researchers have been puzzled because its acceleration cannot be entirely explained by the gravitational pull of nearby bodies: there must be a nongravitational influence on its velocity and trajectory. Some previously suggested explanations for this nongravitational acceleration involve mechanisms that are unlikely or unrealistic, such as geometric effects from ‘Oumuamua being potentially composed of several spatially separated bodies. Now, Jennifer Bergner and colleagues propose that the nongravitational acceleration is due to the gaseous expulsion of entrapped hydrogen from ‘Oumuamua’s water-rich icy body. Which statement, if true, would most strongly support the claim made by Bergner and colleagues about the cause of ‘Oumuamua’s acceleration?", "choices": {"A": "Existing proposed models of outgassing from ‘Oumuamua include the direct conversion of nitrogen or carbon monoxide from a solid to a gaseous state without becoming liquid, but these models have theoretical or observational inconsistencies.", "B": "‘Oumuamua’s trajectory is inconsistent with a nongravitational acceleration that would be caused by the release of hydrogen gas resulting from the processing of water ice (H2O), but the interstellar object’s observable properties can be explained if it has a significant component of molecular hydrogen ice (H2).", "C": "Since nongravitational accelerations of interstellar objects are several orders of magnitude weaker than gravitational accelerations, deviation from behavior that could be fully attributed to gravitational pull has been detected on a limited number of objects similar to ‘Oumuamua.", "D": "Exposure to interstellar cosmic radiation can result in the formation of embedded pockets of hydrogen gas in water ice; moreover, when traveling through the solar system, ‘Oumuamua experienced warming sufficient to alter its icy structure and allow for outgassing."}, "correct": "D", "rationale": "Choice D is the best answer because it presents findings that, if true, would support the claim made by Bergner and colleagues that the\nnongravitational acceleration of ‘Oumuamua is due to the expulsion of entrapped hydrogen. The text first introduces the observation of a unique\ninterstellar object named ‘Oumuamua and goes on to explain that the object exhibited nongravitational acceleration that could not be fully\nattributed to the expected cause: gravitational pull of nearby celestial bodies. The text concludes by stating that Bergner and colleagues claim\nthat the nongravitational acceleration is caused by expulsion of hydrogen gas from ‘Oumuamua’s water-rich icy body. To support this claim\nrequires evidence that hydrogen gas could be present within ‘Oumuamua at all, which this answer choice presents: cosmic radiation can result in\nembedded pockets of hydrogen gas in water ice. Additionally, evidence that this gas can be released from such a body is required to fully support\nthe claim, which this answer choice goes on to provide: ‘Oumuamua experienced sufficient warming as it traveled through the solar system to\nalter its icy structure and release the hydrogen gas. Thus, this answer choice provides the best evidence to support Bergner and colleagues’\nclaim.\nChoice A is incorrect because this answer choice concerns faults with previous models of outgassing from ‘Oumuamua of carbon monoxide and\nnitrogen, which would not support a claim regarding hydrogen outgassing. Furthermore, inconsistencies in other models would not provide\nevidence in support of a different model or explanation. Choice B is incorrect. The evidence presented in this answer choice would weaken the\nclaim proposed by Bergner and colleagues that the nongravitational acceleration of ‘Oumuamua is caused by the expulsion of hydrogen gas\nbecause this answer choice suggests that there is evidence that refutes this claim: ‘Oumuamua’s trajectory is inconsistent with a\nnongravitational acceleration caused by the release of hydrogen gas. Furthermore, the remaining portion of this answer choice is unrelated to the\nclaim. Choice C is incorrect because the claim being made by Bergner and colleagues concerns the expulsion of entrapped hydrogen gas, but\n\nthis answer choice is concerned solely with the differences in magnitude of gravitational and nongravitational acceleration, which would not\nsupport Bergner’s claim. Furthermore, this answer choice discusses interstellar objects similar to ‘Oumuamua, but the text states that\n‘Oumuamua is the first observed object of its kind in our solar system, so evidence from other, similar bodies would not be available."}, {"id": "f27559d4", "skill": "Inferences", "difficulty": "Hard", "question": "Volunteering, or giving time for a community service for free, is a valuable form of civic engagement because helping in a community is also good for society as a whole. In a survey of youths in the United States, most young people said that they believe volunteering is a way to help people on an individual level. Meanwhile, only 6% of the youths said that they think volunteering is a way to help fix problems in society overall. These replies suggest that _____ Which choice most logically completes the text?", "choices": {"A": "many young people think they can volunteer only within their own communities.", "B": "volunteering may be even more helpful than many young people think it is.", "C": "volunteering can help society overall more than it can help individual people.", "D": "many young people may not know how to find ways to volunteer their time."}, "correct": "B", "rationale": "Choice B is the best answer because it most logically completes the text’s discussion of volunteering. The text asserts that volunteering benefits\nboth the community in which one volunteers and society as a whole. It then states that in a survey of young people, a majority of respondents\nsaid that volunteering helps individuals, but only 6% of respondents said that volunteering helps society as a whole. If volunteering does in fact\nhelp society as a whole, as the text says, but only 6% of young people believe it does, then it’s reasonable to conclude that volunteering is more\nhelpful than many young people think it is.\nChoice A is incorrect because the text discusses young people’s beliefs about the benefits of volunteering, not where young people believe they\nare able to volunteer. Nothing in the text suggests that many young people believe they are only able to volunteer in their own communities.\nChoice C is incorrect. Although the text indicates that volunteering is beneficial for society as a whole, nothing in the text suggests that\nvolunteering can benefit society more than it can benefit individual people. The text doesn’t compare the benefits to society with the benefits to\nindividuals. Choice D is incorrect because the text discusses young people’s beliefs about the benefits of volunteering, not how to find\nvolunteering opportunities. There’s nothing in the text to suggest that many young people don’t know how to volunteer."}, {"id": "43f4013a", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Global Strontium Seawater Curve 87 86 Sr/ Sr Age (Ma) 0.708980 6.20 0.709000 5.86 0.709020 5.40 0.709040 4.75 0.709060 3.00 The late Hemphillian (Hh) North American Land Mammal Age includes the subdivisions Hh3, 6.8 million years ago (Ma) to 6 Ma, and Hh4, 6 Ma to 4.75 Ma. While mammalian fossils have indicated that Florida’s Montbrook Fossil Site (MFS) and Palmetto Fauna of the Bone Valley Region (PFBV) date to Hh4, a more precise determination of the sites’ ages has proved challenging. Stephanie R. Killingsworth et al. compared average ratios of strontium-87 to strontium-86 ( 87 Sr/ 86 Sr) in fossil shark teeth from MFS and PFBV—0.709000 and 0.709028, respectively—to 87 Sr/ 86 Sr 87 86 ratios in the global strontium seawater curve, a record that shows how Sr/ Sr ratios in seawater correspond to numerical ages and that is used to date fossils and, by extension, fossil sites. The researchers concluded that _____ Which choice most effectively uses data from the table to complete the statement?", "choices": {"A": "mammalian fossil evidence offers less dating precision than do Sr/ Sr ratios in fossil shark teeth and that PFBV likely was deposited closer to the Hh3-Hh4 boundary than was MFS. 87 86", "B": "the average Sr/ Sr ratios in the fossil shark teeth from MFS and PFBV only partially support the site age estimates previously established through mammalian fossil evidence.", "C": "the average 87 Sr/ 86 Sr ratios in the fossil shark teeth from MFS and PFBV resolve previous uncertainty about the sites’ relative ages by indicating that both sites were deposited contemporaneously during the late Hh. 87 86", "D": "the average Sr/ Sr ratios in the fossil shark teeth from MFS and PFBV corroborate that both MFS and PFBV fall within Hh4 but suggest that PFBV was likely deposited more recently than MFS."}, "correct": "D", "rationale": "Choice D is the best answer because it most effectively uses data from the table to complete the statement about the researchers’ conclusion\nabout fossil shark teeth. The text states that mammalian fossil evidence has placed both MFS and PFBV within Hh4 (6 Ma to 4.75 Ma) but “a\nmore precise determination of the sites’ ages has proved challenging,” prompting Killingsworth and colleagues to attempt to date the sites by\ncomparing average ⁸⁷Sr/⁸⁶Sr ratios for fossil shark teeth from MFS and PFBV to ratios in the global strontium seawater curve. Given that “⁸⁷Sr/\n⁸⁶Sr ratios in seawater correspond to numerical ages,” a fossil whose ⁸⁷Sr/⁸⁶Sr ratio corresponds to the ratio associated with a particular age in\nthe global strontium seawater curve can be inferred to date to that age. According to the table, the ⁸⁷Sr/⁸⁶Sr ratio of 0.709000 for fossil shark\n\nteeth from MFS corresponds to an age of 5.86 Ma, which falls within Hh4. By contrast, the table shows that the ⁸⁷Sr/⁸⁶Sr ratio of 0.709028 for\nfossils from PFBV would fall between 0.709020 (5.40 Ma) and 0.709040 (4.75 Ma), indicating an age that falls within Hh4 but is more recent\nthan MFS’s age of 5.86 Ma. The data therefore corroborate the conclusion that both sites fall within Hh4 while suggesting that PFBV was likely\ndeposited more recently than MFS was.\nChoice A is incorrect because the table indicates that MFS was deposited closer to the Hh3-Hh4 boundary than PFBV was, not the reverse. The\ntable indicates that PFBV’s ⁸⁷Sr/⁸⁶Sr ratio of 0.709028 corresponds to an age between 4.75 Ma and 5.40 Ma, while MFS’s ⁸⁷Sr/⁸⁶Sr ratio of\n0.709000 corresponds to an age of 5.86 Ma. Because the Hh3-Hh4 boundary occurs at 6 Ma, MFS was deposited closer to that boundary than\nPFBV was. In addition, the text doesn’t establish that mammalian fossil evidence offers less dating precision than ⁸⁷Sr/⁸⁶Sr ratios do; it states\nonly that mammalian fossils have placed both MFS and PFBV in Hh4 and that more precise dating has proved challenging. Choice B is incorrect\nbecause it mischaracterizes the level of support for the site age estimates established through mammalian fossil evidence. The table indicates\nthat the average ⁸⁷Sr/⁸⁶Sr ratios from MFS (0.709000) and PFBV (0.709028) both correspond to ages that fall within Hh4 (6 Ma to 4.75 Ma)—5.86\nMa for MFS and an age between 5.40 Ma and 4.75 Ma for PFBV. The ⁸⁷Sr/⁸⁶Sr ratios therefore fully support, rather than only partially support, the\nprevious mammalian fossil evidence placing both sites within Hh4. Choice C is incorrect because the table indicates that the average ⁸⁷Sr/⁸⁶Sr\nratios in fossil shark teeth from MFS (0.709000) and PFBV (0.709028) correspond to different ages—5.86 Ma for MFS and an age between 5.40\nMa and 4.75 Ma for PFBV. Because the ratios point to different ages, they don’t support the conclusion that the fossils at the two sites were\ndeposited contemporaneously, or at the same time."}, {"id": "eaf22802", "skill": "Command of Evidence", "difficulty": "Hard", "question": "A student in a political science course is writing a paper on Aristotle’s The Politics, in which Aristotle offers his opinion on political instability and gives advice on how constitutions can be preserved. Aristotle observes that different forms of government can fall in different ways—for example, oligarchies might grant power to military leaders during wartime who refuse to relinquish that power during peacetime—but some methods of preserving order apply across all forms of government. The student claims that in particular Aristotle asserts that in a healthy state obedience to law must be as close to absolute as possible and that even minor infractions should not be ignored. Which quotation from a philosopher’s analysis of The Politics would best support the student’s claim?", "choices": {"A": "“When constructing his argument regarding the characteristics of a well-functioning government, Aristotle asserts that ‘Transgression creeps in unperceived and at last ruins the state,’ illustrating this idea with a comparison to frequent small expenditures slowly and almost imperceptibly chipping away at a fortune until it is ultimately depleted.”", "B": "“When Aristotle writes on the necessity of avoiding corruption in government, he proposes that ‘every state should be so administered and so regulated by law that its magistrates cannot possibly make money.’ In particular, he thinks oligarchies are particularly susceptible to corruption through bribery.”", "C": "“When Aristotle considers the health of constitutions, he states that ‘Constitutions are preserved when their destroyers are at a distance, and sometimes also because they are near, for the fear of them makes the government keep in hand the constitution.’ He holds that rulers who wish to see constitutions preserved must continually remind the populace of the dangers that would result from a constitutional collapse.”", "D": "“When contrasting different forms of government, Aristotle holds that ‘oligarchies may last, not from any inherent stability in such forms of government, but because the rulers are on good terms both with the unenfranchised and with the governing classes.’ That is, oligarchic leaders who wish to hold on to power will introduce members of disenfranchised classes into government in a participatory role.”"}, "correct": "A", "rationale": "Choice A is the best answer because it presents the quotation that best supports the student’s claim that in The Politics, Aristotle gives advice on\npreserving constitutions—preventing governments from falling and maintaining order—and specifically asserts that in a healthy state, laws must\nbe followed as strictly as possible and infractions should not be overlooked even if they are minor. The philosopher states that when Aristotle\nbuilds his argument about the characteristics of a well-functioning government, Aristotle asserts that transgression, or violation of law, will ruin\nthe state if it \"creeps in unperceived,\" or goes unnoticed. The philosopher then adds that Aristotle illustrates this point by comparing the situation\nto one in which small but frequent expenses diminish a fortune almost unnoticeably until, eventually, the fortune is entirely gone. In other words,\nthe philosopher indicates that Aristotle makes the point that total obedience to law preserves a healthy state while even small violations, if\nignored, will undermine the health of the state.\nChoice B is incorrect because the philosopher addresses Aristotle’s observation about corruption within the government (in particular, preventing\nthe possibility that members of the government can take bribes), and although corruption can involve infractions, the observation is about a\nsubset of people within the state and isn’t directly connected to the importance of upholding total obedience to the law throughout the state.\nChoice C is incorrect because the philosopher discusses Aristotle’s point about those who would intentionally destroy a constitution altogether\nand the need for rulers to remind the populace that it would be dangerous for a constitution to collapse, but neither idea is directly connected to\nthe importance of upholding total obedience to the law. Choice D is incorrect because the philosopher explains that Aristotle makes the point\nthat oligarchic leaders may retain power by having members of disenfranchised classes participate in government alongside governing classes,\nand this point doesn’t address the importance of ensuring obedience to the law and addressing even minor violations."}, {"id": "d1539546", "skill": "Inferences", "difficulty": "Hard", "question": "Tides can deposit large quantities of dead vegetation within a salt marsh, smothering healthy plants and leaving a salt panne—a depression devoid of plants that tends to trap standing water—in the marsh’s interior. Ecologist Kathryn Beheshti and colleagues found that burrowing crabs living within these pannes improve drainage by loosening the soil, leading the pannes to shrink as marsh plants move back in. At salt marsh edges, however, crab-induced soil loosening can promote marsh loss by accelerating erosion, suggesting that the burrowing action of crabs _____ Which choice most logically completes the text?", "choices": {"A": "can be beneficial to marshes with small pannes but can be harmful to marshes with large pannes.", "B": "may promote increases in marsh plants or decreases in marsh plants, depending on the crabs’ location.", "C": "tends to be more heavily concentrated in areas of marsh interiors with standing water than at marsh edges.", "D": "varies in intensity depending on the size of the panne relative to the size of the surrounding marsh."}, "correct": "B", "rationale": "Choice B is the best answer. The text says that crab burrowing in the pannes enables plants to grow there again. It also says that crab burrowing\nat the edges of the marsh speeds up marsh loss. This suggests that burrowing crabs can either help or hurt marshes, depending on where\nthey’re located.\nChoice A is incorrect. This inference isn’t supported. The text never discusses pannes of different sizes. Choice C is incorrect. This inference isn’t\nsupported. The text never suggests that crabs do more burrowing in the pannes (the areas with standing water) than they do at the edges.\nRather, the text says that the burrowing that happens in the pannes is beneficial, while the burrowing that happens at the edges is harmful.\nChoice D is incorrect. This inference isn’t supported. The text never discusses the intensity of crab burrowing, nor does it discuss the size of the\npanne relative to the size of the marsh."}, {"id": "627d93e3", "skill": "Command of Evidence", "difficulty": "Hard", "question": "0.25 0.20 0.15 0.10 0.05 0 htworg laidaR )raey rep sretemitnec( Modeled Radial Growth of Sugar Maple Trees urr e nt h a n g e h a n g e c e c e c at m m o d er e xtr e Climate scenario with nitrogen without nitrogen Inés Ibáñez and colleagues studied a forest site in which some sugar maple trees receive periodic fertilization with nitrogen to mimic the broader trend of increasing anthropogenic nitrogen deposition in soil. Ibáñez and colleagues modeled the radial growth of the trees with and without nitrogen fertilization under three different climate scenarios (the current climate, moderate change, and extreme change). Although they found that climate change would negatively affect growth, they concluded that anthropogenic nitrogen deposition could more than offset that effect provided that change is moderate rather than extreme. Which choice best describes data from the graph that support Ibáñez and colleagues’ conclusion?", "choices": {"A": "Growth with nitrogen under the current climate exceeded growth with nitrogen under moderate change, but the latter exceeded growth without nitrogen under extreme change.", "B": "Growth without nitrogen under the current climate exceeded growth without nitrogen under moderate change, but the latter exceeded growth with nitrogen under extreme change.", "C": "Growth with nitrogen under moderate change exceeded growth without nitrogen under moderate change, but the latter exceeded growth without nitrogen under extreme change.", "D": "Growth with nitrogen under moderate change exceeded growth without nitrogen under the current climate, but the latter exceeded growth with nitrogen under extreme change."}, "correct": "D", "rationale": "Choice D is the best answer because it describes data from the graph that support Ibáñez and colleagues’ conclusion that increasing\nanthropogenic nitrogen deposition can compensate for the negative effect of climate change on tree growth if that change is moderate but not if\nit’s extreme. The bar graph shows the growth of sugar maple trees with and without nitrogen fertilization under three different climate-change\nscenarios: current conditions, a moderate change, and an extreme change. According to the graph, radial growth without nitrogen fertilization is\nprojected to be about 0.16 centimeters (cm) under current conditions, 0.15 cm under a moderate change, and 0.04 cm under an extreme change.\nThe graph also shows that with nitrogen fertilization, growth is projected to be about 0.18 centimeters under a moderate change but only about\n0.06 centimeters under an extreme change. Thus, the data in the graph support the researchers’ conclusion by showing greater growth for a\nmoderate change using nitrogen fertilization than they do either under current conditions without nitrogen fertilization or under an extreme\nchange with nitrogen fertilization.\nChoice A is incorrect. Although it accurately represents the data in the graph, this fact pattern doesn’t support Ibáñez and colleagues’ conclusion\nthat the decline in radial growth due to climate change will be partly offset by higher levels of anthropogenic nitrogen, but only if change to the\nclimate is moderate and not if it’s extreme. To support this would require comparing radial growth without nitrogen fertilization under current\nclimate conditions to the growth with nitrogen fertilization under both moderate and extreme changes. This choice mentions only growth with\nnitrogen fertilization under current climate conditions and moderate change and growth without nitrogen fertilization under an extreme change,\nwhich don’t provide a basis to determine whether higher nitrogen in the future will be able to offset reduced growth due to climate change.\nChoice B is incorrect. Although it accurately represents the data in the graph, this fact pattern doesn’t support Ibáñez and colleagues’ conclusion\nthat the decline in radial growth due to climate change will be partly offset by higher levels of atmospheric nitrogen, but only if change to the\nclimate is moderate and not if it’s extreme. The support needed would compare radial growth under current climate conditions without nitrogen\nfertilization to the growth with nitrogen fertilization under moderate and extreme changes. This choice mentions only growth without nitrogen\nfertilization under current conditions and moderate change and growth with nitrogen fertilization under extreme change, which don’t provide a\nbasis to determine whether higher nitrogen in the future will be able to offset reduced growth due to climate change. Choice C is incorrect.\nAlthough it accurately represents the data in the graph, this fact pattern doesn’t support Ibáñez and colleagues’ conclusion that the decline in\nradial growth due to climate change will be partly offset by higher levels of atmospheric nitrogen, but only if change to the climate is moderate\nand not if it’s extreme. The support needed would compare radial growth without adding nitrogen under current climate conditions to the growth\nwith nitrogen fertilization under moderate and extreme changes. This choice mentions only the growth with and without nitrogen fertilization\nunder moderate climate change and growth without nitrogen fertilization under extreme change, which don’t provide a basis to determine\nwhether higher nitrogen in the future will be able to offset reduced growth due to climate change."}, {"id": "df9c5a1d", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Juvenile Plants Found Growing on Bare Ground and in Patches of Vegetation for Five Species Species Bare ground Patches of vegetation Total Percent found in patches of vegetation T. moroderi 9 13 22 59.1% T. libanitis 83 120 203 59.1% H. syriacim 95 106 201 52.7% H. squamatum 218 321 539 59.6% H. stoechas 11 12 23 52.2% Alicia Montesinos-Navarro, Isabelle Storer, and Rocío Perez-Barrales recently examined several plots within a diverse plant community in southeast Spain. The researchers calculated that if individual plants were randomly distributed on this particular landscape, only about 15% would be with other plants in patches of vegetation. They counted the number of juvenile plants of five species growing in patches of vegetation and the number growing alone on bare ground and compared those numbers to what would be expected if the plants were randomly distributed. Based on these results, they claim that plants of these species that grow in close proximity to other plants gain an advantage at an early developmental stage. Which choice best describes data from the table that support the researchers’ claim?", "choices": {"A": "For all five species, less than 75% of juvenile plants were growing in patches of vegetation.", "B": "The species with the greatest number of juvenile plants growing in patches of vegetation was H. stoechas.", "C": "For T. libanitis and T. moroderi, the percentage of juvenile plants growing in patches of vegetation was less than what would be expected if plants were randomly distributed.", "D": "For each species, the percentage of juvenile plants growing in patches of vegetation was substantially higher than what would be expected if plants were randomly distributed."}, "correct": "D", "rationale": "Choice D is the best answer because it provides the most direct support from the table for the claim that the plants growing in close proximity to\nother plants gained an advantage at an early developmental stage. The table shows the total number of juvenile plants from five species that\nwere found growing on bare ground and in patches of vegetation as well as the percentage of the total number of each species that were\ngrowing in patches of vegetation. For each of the five species, more than 50% of the juvenile plants were growing in patches of vegetation. The\ntext notes, however, that a random distribution of plants across the landscape should result in only about 15% of the plants being found in\npatches of vegetation. In other words, for each of the five species, the percentage of juvenile plants found growing in patches of vegetation was\nsubstantially higher than could be explained by chance alone. This finding supports the claim in the text: if plants growing in patches are\noverrepresented among plants that have survived to the juvenile stage, as the data show they are, then it suggests that it’s advantageous for\nplants at an early stage of development to grow in patches of vegetation.\n\nChoice A is incorrect because the statement that less than 75% of juvenile plants were found growing in patches of vegetation, while true,\ndoesn’t clear
