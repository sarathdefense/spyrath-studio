 (that is, widely assumed but not proven) intended to illustrate a robust model (a consistently\naccurate generalization) of how individuals pursuing their own economic interests can create broader benefits for the population. The text then\nemphasizes the lack of affirmative evidence for this idea by calling out the term \"putatively,\" and explaining that, according to Gavin Kennedy,\nSmith used the metaphor only once in his works, in reference to specific circumstances related to the now-outdated economic view known as\nmercantilism, and that the metaphor didn’t garner much attention until economists in the twentieth century held it up as a paradigm (a theoretical\nframework in the field) and thereby implied that Smith shared some of their views on economics. By emphasizing \"putatively,\" the text implies\nthat there is no independent reason to believe that Smith would agree with the metaphor’s use outside of the specific context for which he wrote\nit and that, therefore, the twentieth-century economists who used it did so to support their own views without regard for the metaphor’s\nimportance to Smith’s work.\nChoice A is incorrect. Although the text indicates that Smith’s metaphor was largely ignored until some twentieth-century economists revived it\nand bolstered its status, the text suggests that the later economists used Smith’s metaphor to self-servingly boost their own work while ignoring\nthe original context in which Smith wrote it. Moreover, the statement in this choice fails to reflect the text’s emphasis on Smith’s limited use of\nthe metaphor in his work. Choice B is incorrect. Although the text indicates that some twentieth-century economists altered the significance of\nSmith’s metaphor, the text doesn’t suggest that the metaphor is a \"useful model\" of how aggregate benefits arise from individuals’ selfish\nactions, let alone that this usefulness is unaffected by taking the metaphor out of its original context. Choice C is incorrect. Although the text\nindicates that Smith’s metaphor was intended as a model of how individuals acting in their own interest produce aggregate benefits and it was\nwritten within the context of the now-outdated economic theory of mercantilism, these points are subordinate to the primary idea in the text,\nwhich is that Smith’s use of the metaphor was tightly constrained but twentieth-century economists ignored the original context so that they\ncould use the metaphor to suggest, without support, that Smith would agree with their economic views."}, {"id": "6536183b", "skill": "Command of Evidence", "difficulty": "Hard", "question": "In the mountains of Brazil, Barbacenia tomentosa and Barbacenia macrantha—two plants in the Velloziaceae family—establish themselves on soilless, nutrient-poor patches of quartzite rock. Plant ecologists Anna Abrahão and Patricia de Britto Costa used microscopic analysis to determine that the roots of B. tomentosa and B. macrantha, which grow directly into the quartzite, have clusters of fine hairs near the root tip; further analysis indicated that these hairs secrete both malic and citric acids. The researchers hypothesize that the plants depend on dissolving underlying rock with these acids, as the process not only creates channels for continued growth but also releases phosphates that provide the vital nutrient phosphorus. Which finding, if true, would most directly support the researchers’ hypothesis?", "choices": {"A": "Other species in the Velloziaceae family are found in terrains with more soil but have root structures similar to those of B. tomentosa and B. macrantha.", "B": "Though B. tomentosa and B. macrantha both secrete citric and malic acids, each species produces the acids in different proportions.", "C": "The roots of B. tomentosa and B. macrantha carve new entry points into rocks even when cracks in the surface are readily available.", "D": "B. tomentosa and B. macrantha thrive even when transferred to the surfaces of rocks that do not contain phosphates."}, "correct": "C", "rationale": "Choice C is the best answer because it presents a finding that, if true, would support the researchers’ hypothesis about the plants’ dependence\non dissolving rock. The text indicates that the roots of the two plant species grow directly into quartzite rock, where hairs on the roots secrete\nacids that dissolve the rock. The researchers hypothesize that the plants depend on this process because dissolving rock opens spaces for the\nroots to grow and releases phosphates that provide the plants with phosphorus, a vital nutrient. If the plants carry out this process of dissolving\nrock even when the rock already has spaces into which the roots could grow, that would support the researchers’ hypothesis because it suggests\nthat the plants are getting some advantage—such as access to phosphorus—from the action of dissolving rock. If the plants don’t benefit from\ndissolving rock, they would be expected to grow in the cracks that already exist, as doing so would mean that the plants don’t have to spend\nenergy creating and secreting acids; if, however, the plants create new entry points by dissolving rock even when cracks already exist, that would\nsupport the hypothesis that they depend on dissolving rock for some benefit.\nChoice A is incorrect because the existence of soil-inhabiting members of the Velloziaceae family with similar root structures to those of the two\nspecies discussed in the text wouldn’t support the researchers’ hypothesis that the species discussed in the text depend on dissolving rock. If\nother such members exist, that might suggest that the root structures can serve more functions than secreting acids to dissolve rock (since\ndissolving rock may not be necessary for plants living in soil), but that wouldn’t suggest anything about whether the species discussed in the text\nbenefit from dissolving rock. Choice B is incorrect because differences in the proportions of citric and malic acid secreted by the two species\nwould be irrelevant to the hypothesis that the plants depend on dissolving rock. There’s no information in the text to suggest that the proportion\nof each acid has any bearing on the process of dissolving rock or on any benefits the plants might receive from that process. Choice D is\nincorrect because if the two species thrive on rocks without phosphates, that would weaken the researchers’ hypothesis that the plants depend\non dissolving rock partly because dissolving rock gives them access to phosphates. If the plants can survive on rocks without getting a vital\nnutrient by dissolving those rocks, then either the nutrient isn’t actually vital for those plants or they can get the nutrient in some way other than\nby dissolving rocks."}, {"id": "96d1c1fe", "skill": "Inferences", "difficulty": "Hard", "question": "Tatiana R. Feuerborn and colleagues analyzed the genomes of more than a hundred domesticated dogs from sites in Siberia dating from 11,000 years ago to the present. They found that the dogs constituted a genetically isolated population of Arctic breeds until approximately 2,000 years ago, at which point there was substantial interbreeding with Near Eastern dog breeds. Furthermore, beginning around 2,000 years ago, some sites contain artifacts consistent with a Near East origin, like glass beads, but the people show no evidence of having traveled extensively outside Siberia. From this, Feuerborn and colleagues concluded that around 2,000 years ago _____ Which choice most logically completes the text?", "choices": {"A": "dogs and artifacts like glass beads began to be transported from the Near East to Siberia.", "B": "people from Siberia began to reach the Near East, where they acquired dogs and artifacts such as glass beads.", "C": "glass beads and other artifacts from the Near East began to be exchanged for dogs from Siberia.", "D": "dogs from the Near East began to be exchanged for glass beads and other artifacts from Siberia."}, "correct": "A", "rationale": "Choice A is the best answer because it presents the conclusion that most logically follows from the text’s discussion of Feuerborn and\ncolleagues’ findings about sites in Siberia. The text states that genomic analysis of many domesticated dogs from Siberian sites dating from the\nlast 11,000 years revealed that the dogs represented a genetically isolated population of breeds (that is, they didn’t reproduce with dogs of any\noutside breeds) until about 2,000 years ago, when there is evidence that the dogs began interbreeding with breeds from the Near East. The text\nalso indicates that around the same time, the sites began to contain glass beads and other artifacts seeming to be from the Near East, even\nthough there is no evidence that the people of those sites traveled widely outside Siberia. Because there is evidence of Near East dog breeds and\nNear East artifacts at Siberian sites beginning about 2,000 years ago but no evidence of the people’s travel to the Near East around that time, it’s\nreasonable to infer that Feuerborn and colleagues concluded that dogs and artifacts like glass beads were transported to Siberia from the Near\nEast, starting around 2,000 years ago.\nChoice B is incorrect because the text explicitly states that there is no evidence that the people of the Siberian sites 2,000 years ago traveled\nextensively beyond Siberia, which they would’ve had to do to reach the Near East; therefore, it wouldn’t make sense to conclude that the presence\nof Near East dog breeds and artifacts like glass beads suggests that people from Siberia began arriving in the Near East around 2,000 years ago.\nChoice C is incorrect because the text addresses the presence of Near East dog breeds (and evidence of interbreeding with Siberian dogs) and\nartifacts like glass beads at Siberian sites starting about 2,000 years ago, suggesting only that the dogs and artifacts started to arrive in Siberia\naround that time. The text doesn’t suggest the purpose of the arrival of the Near East dogs and artifacts or give any indication of Siberian dog\nbreeds being transported elsewhere through trade. Choice D is incorrect because the text addresses the presence of Near East dog breeds and\nartifacts like glass beads at Siberian sites starting about 2,000 years ago, suggesting only that the dogs and artifacts started to arrive in Siberia\naround that time; it doesn’t suggest the purpose of this arrival and makes no mention of Siberian glass beads or other artifacts of Siberian origin."}, {"id": "2644644a", "skill": "Command of Evidence", "difficulty": "Hard", "question": "In countries with right-hand traffic, drivers who want to make a left turn at a traffic intersection with stoplights have to wait for either a gap in oncoming traffic or a designated left-turn signal to turn green. At busy intersections, this often causes a backup of vehicles waiting to turn left or being prevented from proceeding by left-turning vehicles in front of them. Transportation researcher Vikash V. Gayah claims that in urban areas eliminating the option to turn left at busy intersections—both with and without dedicated left-turn signals—would improve traffic flow and, as a result, reduce overall travel times even if such a restriction would require drivers to sometimes travel a slightly longer distance. Which finding, if true, would most directly support the researcher’s claim?", "choices": {"A": "In a town that installed left-turn signals at all busy intersections, seven out of ten survey respondents agreed with the statement “the streets in my community are easier to navigate by motor vehicle than before.”", "B": "A traffic study of intersections in a large city shows that on average drivers wait longer to make a left turn at intersections without left-turn signals than at intersections with such signals.", "C": "After a city eliminated left turns at busy intersections, a package-delivery company reports that its drivers have been able to reach more addresses in the city daily, on average, and therefore deliver more packages there annually.", "D": "Statistics reveal that school buses in a city that eliminated left turns at most intersections took on average two minutes longer to complete their routes after the restriction took effect than they did before."}, "correct": "C", "rationale": "Choice C is the best answer because it presents a finding that, if true, would most directly support Vikash V. Gayah’s claim that eliminating the\noption to turn left at busy intersections would improve traffic flow and reduce overall travel times. The text begins by describing a problem\nencountered by drivers in countries with right-hand traffic—namely that drivers wanting to make a left turn must wait for either gaps in oncoming\ntraffic or for designated left-turn signals before proceeding. The resulting backup of vehicles causes increased traffic congestion at busy\nintersections that slows overall travel times. According to Gayah, eliminating left turns from busy intersections in urban areas would ease the\ncongestion caused by vehicles waiting to turn left. If vehicles spend less time waiting at intersections for left turns, faster overall travel times\nwould result even if some drivers would have to drive slightly longer distances to make the desired left turn. Drivers for package-delivery\ncompanies, who presumably spend most of the day driving to destinations across the city in which they are based, would likely provide a good\nindication of overall traffic patterns across the city. A finding that after a city had eliminated left turns at busy intersections, package-delivery\ncompanies were able to complete more daily deliveries on average—which implies faster travel times between package destinations—would\ntherefore support the claim that overall travel times would decrease if left turns were eliminated at busy intersections.\nChoice A is incorrect because a finding that a majority of survey respondents agreed with the statement that implementing left-turn signals at all\nbusy intersections made navigating streets in their communities easier wouldn’t support the claim that eliminating the option to turn left\naltogether at some busy intersections—both with and without dedicated left-turn signals—would improve the flow of traffic and overall traffic\ntimes. In fact, the text emphasizes that designated left-turn signals contribute to increased congestion because they require drivers to wait to\nturn left, which results in a backup of vehicles. Installing such signals at all busy intersections would thus potentially compound the problem of\ncongestion, not improve it. Moreover, although making streets easier for drivers to navigate might indicate that left-turn signals are beneficial to\ndrivers, it doesn’t indicate that overall travel times would necessarily be reduced. Choice B is incorrect because a study concluding that drivers\nwait longer to make left turns at intersections without dedicated left-turn signals than at intersections with such signals wouldn’t support the\nclaim that eliminating the option to turn left altogether would reduce overall travel times. In fact, the finding would merely support the idea that\n\ninstalling left-turn signals would likely reduce the time drivers spend waiting at busy intersections that didn’t previously have left-turn signals, not\nthat overall travel times would be reduced. Choice D is incorrect because the finding that after a restriction eliminating left turns at most\nintersections took effect, school buses took longer to complete their routes than they did before the restriction was implemented would\ncontradict rather than support the researcher’s claim that eliminating left turns would reduce overall travel times."}, {"id": "7812801f", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "The fynbos shrubland is a diverse habitat found only in South Africa. It is adjacent to the Afro-temperate forest, with almost no transition space between the two distinct habitats. Plants in the fynbos have uniquely thin and long root systems that spread out over large distances to absorb nutrients from the soil. Ecologists transplanted tree seedlings from the forest into plots in the fynbos. Seedlings in plots isolated from the roots of fynbos plants exhibited a growth rate five times greater than that of the seedlings in plots in close proximity to the roots of fynbos plants. Based on the text, what role do fynbos roots most likely have in maintaining the border between the fynbos shrubland and the Afro-temperate forest habitats?", "choices": {"A": "Fynbos roots damage the root systems of forest plants, leaving those plants unable to acquire sufficient nutrients.", "B": "Fynbos roots extend close enough to the forest plants’ roots that they constitute a physical barrier that forest plants’ roots cannot pass.", "C": "The root systems of fynbos plants allow the plants to take in so many soil nutrients that forest plants are prevented from flourishing in the fynbos.", "D": "The root systems of fynbos plants enhance the soil immediately surrounding the plants, allowing them to thrive in an otherwise harsh habitat."}, "correct": "C", "rationale": "Choice C is the best answer because it presents a conclusion about the role of fynbos roots in maintaining the border with the Afro-temperate\nforest that can be reasonably inferred from the text. The text states that plants in the fynbos have \"uniquely thin and long root systems that\nspread out over large distances to absorb nutrients from the soil.\" The text then describes an experiment where forest tree seedlings grown in\nplots isolated from fynbos roots grew at a rate five times greater than seedlings in areas near fynbos roots. This strongly suggests that fynbos\nroots are depleting soil nutrients to such an extent that forest plants can’t get enough nutrients from that soil to flourish, thereby hindering the\nformation of any significant \"transition space\" between the habitats and helping keep the border between them sharp.\nChoice A is incorrect because there is no evidence in the text that fynbos roots physically damage the root systems of forest plants. Instead, the\ntext explicitly describes fynbos plants as having \"uniquely thin and long root systems that spread out over large distances to absorb nutrients\nfrom the soil.\" This description establishes that fynbos roots are specialized for efficient nutrient absorption. The experiment then confirms this\nfunction of the roots by showing that forest seedlings \"isolated from the roots of fynbos plants exhibited a growth rate five times greater\" than\nthose near fynbos roots. This result demonstrates that when forest seedlings don’t have to compete with the nutrient-absorbing fynbos roots,\nthey grow much better. Choice B is incorrect. Although the text does indicate that the fynbos and the Afro-temperate forest are distinct from, and\nadjacent to, each other and that there is \"almost no transition space\" (area of mixed fynbos and forest plants), the experiment shows that forest\nplants can grow in soil occupied by fynbos roots, just not very well. So, the idea that the fynbos roots physically obstruct forest plants is\nunsupported by the text. Choice D is incorrect because it directly contradicts the text’s claim that fynbos roots absorb nutrients from, and\ntherefore deplete, the soil they’re in, and furthermore, nothing in the text suggests that the habitat of the fynbos is harsh in general."}, {"id": "e35aa99b", "skill": "Command of Evidence", "difficulty": "Hard", "question": "30 25 20 15 10 5 0 )slacsapagem( htgnerts evisserpmoC Compressive Strength of Mortar Mixtures After Curing % S S A) % S S A % S S A % S S A ol ( 0 1 0 2 0 4 0 ntr o c Mixture day 7 day 28 Mollusk shells are mainly composed of calcium carbonate, a chemical compound used in mortar and other construction materials. A research team led by Ariane da Silva Cardoso investigated pulverizing discarded Sururu mussel shells to create a substitute for fine aggregates (such as sand) in mortar mixtures. The team prepared mixtures with Sururu shell aggregate (SSA) replacing varying percentages of sand and then tested the mortars’ compressive strength on days 7 and 28 of curing. Based on their findings, the team recommended SSA substitution in relatively small proportions to avoid compromising strength. Which choice most effectively uses data from the graph to support the researchers’ recommendation?", "choices": {"A": "The 10% SSA mixture’s compressive strength was greater than or approximately equal to that of the control mixture on day 7 and on day 28, but on both days the 20% and 40% SSA mixtures had less compressive strength than the control mixture did.", "B": "The compressive strength of the 10% SSA mixture remained nearly the same from day 7 to day 28, while that of the 20% and 40% SSA mixtures changed substantially.", "C": "The 10% SSA mixture’s compressive strength was greater than that of the control mixture on day 7, but by day 28 the 10% SSA mixture’s compressive strength had decreased while that of the control mixture had increased.", "D": "The compressive strength of the 10% SSA mixture never surpassed the compressive strength measured for the control mixture on day 28."}, "correct": "A", "rationale": "Choice A is the best answer because it most effectively uses data from the graph to support the researchers’ recommendation that Sururu shell\naggregate (SSA) substitution be done in relatively small proportions to avoid compromising the compressive strength of mortar mixtures. The\ntext explains that a research team investigated whether SSA can serve as a substitute for sand in mortar mixtures. The graph presents the\ncompressive strength (in megapascals) of mortar mixtures with SSA replacing 0% (control), 10%, 20%, and 40% of the sand on day 7 and day 28\nof curing. The graph shows that the compressive strength of the 10% SSA mixture was approximately 25 megapascals on day 7, which is greater\nthan the control mixture’s approximately 22 megapascals on the same day. The graph also shows that the 10% SSA mixture’s compressive\nstrength was slightly more than 25 megapascals on day 28, which is only slightly less than the control’s compressive strength on the same day\n(about 26 megapascals). Therefore, the graph shows that the compressive strength of the 10% SSA mixture was greater than that of the control\non day 7 and roughly equal to that of the control on day 28, suggesting that substituting only 10% of the sand with SSA avoids compromising the\nmortar’s compressive strength. The graph also shows that on day 7, the 20% and 40% SSA mixtures had compressive strengths of about 19 and\n13 megapascals, respectively (both lower than the control’s), and on day 28, they had compressive strengths of about 22 and 15 megapascals,\nrespectively (once again lower than the control’s). Thus, the data support the recommendation by indicating that substituting relatively small\nproportions of sand with SSA in mortar mixtures doesn’t compromise strength compared with the control, whereas substituting larger\nproportions does.\nChoice B is incorrect because the comparison it makes isn’t relevant to the researchers’ recommendation. Although the graph does show that\nthe bars representing the compressive strength of the 10% SSA mixture on day 7 and day 28 are roughly the same height (suggesting that the\nmixture’s compressive strength changed by only a small amount), and although there are relatively large gaps between the bars showing the\ncompressive strength of the 20% and 40% SSA mixtures on day 7 and day 28 (suggesting that their compressive strength changed over time by a\ngreater amount), this comparison concerns only how each SSA mixture’s strength changed over time and doesn’t compare the SSA mixtures with\nthe control mixture. Supporting the recommendation that SSA substitution be done in small proportions requires evidence that small\nsubstitutions don’t compromise strength relative to the control while larger substitutions do. Choice C is incorrect because it doesn’t accurately\nrepresent the data in the graph, nor is the comparison it makes relevant to the researchers’ recommendation. While the graph does show that the\ncompressive strength of the 10% SSA mixture was greater than that of the control on day 7 (about 25 megapascals vs. about 22 megapascals)\nand, moreover, that the compressive strength of the control increased from day 7 to day 28 (from about 22 megapascals to about 26\nmegapascals), the graph shows that the compressive strength of the 10% SSA mixture increased by a small amount (from about 25\nmegapascals to slightly more than 25 megapascals), not that it decreased. Moreover, the researchers recommended substituting relatively small\nproportions (compared with larger proportions) of the mixtures with SSA; comparing the compressive strength of the 10% SSA mixture with that\nof the control without also considering how the compressive strength of the 10% SSA mixture compared with that of the 20% and 40% SSA\nmixtures wouldn’t support the recommendation. Choice D is incorrect. Though the graph indicates that the 10% SSA mixture’s compressive\nstrength on day 7 and day 28 (about 25 megapascals and slightly more than 25 megapascals, respectively) didn’t surpass the control mixture’s\ncompressive strength on day 28 (about 26 megapascals), this observation doesn’t support the recommendation. The recommendation concerns\nthe trade-off between SSA proportion and compressive strength; supporting it requires not just evidence about how the 10% SSA mixture\ncompared with the control but also evidence about how the mixtures with larger proportions of SSA (20% and 40%) compared with the 10% SSA\nmixture and the control."}, {"id": "b5e9f3c2", "skill": "Inferences", "difficulty": "Hard", "question": "Ancestral Puebloans, the civilization from which present-day Pueblo tribes descended, emerged as early as 1500 B.C.E. in an area of what is now the southwestern United States and dispersed suddenly in the late 1200s C.E., abandoning established villages with systems for farming crops and turkeys. Recent analysis comparing turkey remains at Mesa Verde, one such village in southern Colorado, to samples from modern turkey populations in the Rio Grande Valley of north central New Mexico determined that the latter birds descended in part from turkeys cultivated at Mesa Verde, with shared genetic markers appearing only after 1280. Thus, researchers concluded that _____ Which choice most logically completes the text?", "choices": {"A": "conditions of the terrains in the Rio Grande Valley and Mesa Verde had greater similarities in the past than they do today.", "B": "some Ancestral Puebloans migrated to the Rio Grande Valley in the late 1200s and carried farming practices with them.", "C": "Indigenous peoples living in the Rio Grande Valley primarily planted crops and did not cultivate turkeys before 1280.", "D": "the Ancestral Puebloans of Mesa Verde likely adopted the farming practices of Indigenous peoples living in other regions."}, "correct": "B", "rationale": "Choice B is the best answer because it presents the conclusion that most logically follows from the text’s discussion of Ancestral Puebloans’\nmigration to the Rio Grande Valley. The text states that in the late 1200s C.E., the Ancestral Puebloan civilization abandoned villages in its\noriginal homeland, which included the Mesa Verde site. The text goes on to say that recent genetic analysis has demonstrated that the modern\nturkey population in the Rio Grande Valley descends partly from the ancient turkeys raised at Mesa Verde, and that the genetic markers shared by\nthe two turkey populations first appeared at Mesa Verde only after 1280 C.E. Therefore, it can reasonably be concluded that some Ancestral\nPuebloans migrated to the Rio Grande Valley in the late 1200s and carried their agricultural practices—including the farming of turkeys—to their\nnew home.\nChoice A is incorrect because the text never compares the condition of the Rio Grande Valley’s terrain to that of Mesa Verde’s terrain, either in the\npresent or in the past. Choice C is incorrect. Although genetic analysis has demonstrated that the modern turkey population in the Rio Grande\nvalley descended in part from the turkey population raised by the Ancestral Puebloans of Mesa Verde before their migration to the valley in 1280,\nthis finding doesn’t eliminate the possibility that Indigenous peoples living in the valley before 1280 might also have farmed turkeys. Choice D is\nincorrect. The text doesn’t consider the possibility that before their migration to the Rio Grande Valley after 1280, the Ancestral Puebloans of\nMesa Verde might have adopted turkey farming from an outside Indigenous civilization in another region; instead, the text provides evidence\nsuggesting that the Ancestral Puebloans brought turkey farming to another region—the Rio Grande Valley—after 1280."}, {"id": "629fb8a9", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Percentages of New Year’s Resolution Makers Who Make Certain Kinds of Resolutions Type of resolution Age 18-29 Age 30-49 Age 50-64 Age 65+ Health and exercise 79 80 79 76 Finances 68 63 56 47 Personal relationships 63 53 58 52 Hobbies 65 53 51 45 A Pew Research Center survey conducted in January 2024 found that three out of ten US adults make at least one New Year’s resolution (a promise for the year ahead), while half of those who make a resolution make more than one. The survey asked participants what kinds of resolutions they made and separated them into several categories. The table presents percentages of people who make particular kinds of New Year’s resolutions among those who choose to make them, indexed by age bracket. Which choice best presents a conclusion about the habits of New Year’s resolution makers that is best supported by information in the text and the table?", "choices": {"A": "Resolution makers between the ages of 50 and 64 are more likely to make resolutions related to personal relationships and less likely to make resolutions related to finances than resolution makers between the ages of 30 and 49 are.", "B": "Resolution makers between the ages of 18 and 29 are more likely to make resolutions about health and exercise than resolution makers between the ages of 30 and 49 are.", "C": "The majority of US adults who make resolutions related to health and exercise also make resolutions in multiple additional categories.", "D": "Among all US adults, people become less likely to make New Year’s resolutions as they age, regardless of the type of resolution."}, "correct": "A", "rationale": "Choice A is the best answer because it presents a conclusion about the habits of New Year’s resolution makers that is best supported by\ninformation in the text and the table. The table presents percentages of resolution makers who make particular kinds of resolutions, indexed by\nage bracket. According to the table, 58 percent of resolution makers ages 50 to 64 made resolutions related to personal relationships, compared\nto 53 percent of resolution makers ages 30 to 49—indicating that the older group is more likely to make such resolutions. The table also shows\nthat 56 percent of resolution makers ages 50 to 64 made resolutions related to finances, compared to 63 percent of resolution makers ages 30\nto 49—indicating that the older group is less likely to make financial resolutions. Thus, the data support the conclusion that resolution makers\nbetween the ages of 50 and 64 are more likely to make resolutions related to personal relationships and less likely to make resolutions related to\nfinances than resolution makers between the ages of 30 and 49 are.\nChoice B is incorrect because according to the table, 79 percent of resolution makers ages 18 to 29 made resolutions about health and exercise,\nwhile 80 percent of resolution makers ages 30 to 49 made such resolutions. Therefore, resolution makers ages 18 to 29 are slightly less likely,\nnot more likely, to make resolutions about health and exercise than resolution makers ages 30 to 49 are. Choice C is incorrect because neither\n\nthe text nor the table provides information about whether resolution makers who make resolutions related to health and exercise also make\nresolutions in multiple additional categories. The text indicates that half of those who make a resolution make more than one, but it doesn’t\nspecify how many or in which categories, and the table presents only the percentages of resolution makers in each age bracket who made\nparticular kinds of resolutions. Choice D is incorrect because the table presents data only about people who chose to make resolutions, not\nabout all US adults; the table therefore can’t support a conclusion about whether US adults overall become less likely to make resolutions as they\nage. Furthermore, although percentages of resolution makers generally decline as age bracket increases in some resolution categories, the table\nshows that the percentage of resolution makers who made health and exercise resolutions remains relatively stable across age brackets; thus,\neven among resolution makers, there isn’t a consistent age-related decline across all types of resolutions."}, {"id": "7aa510fb", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "In their meta-analysis of research on advergames (video games developed to promote products or services), Zeph M.C. van Berlo et al. confirm that such games, though they can elicit player interest, may not facilitate subsequent recall of product and brand information. This phenomenon can be explained by the finite nature of cognitive capacity as it is articulated in Annie Lang’s limited capacity model of motivated mediated message processing. In this case, players’ cognitive resources are directed foremost toward the advergame’s mechanics, leaving little or no capacity for encoding and storing the information the advertiser intends to be salient. Which choice best states the main idea of the text?", "choices": {"A": "The limited capacity model of motivated mediated message processing developed by Lang provides a means of explaining the finding by van Berlo et al. that players may not readily recollect the brand and product information embedded in advergames.", "B": "Research by van Berlo et al. corroborates Lang’s conclusion that because people predominantly focus on game mechanics when playing video games, it is difficult for advergames to communicate brand and product information in ways that are highly memorable.", "C": "The meta-analysis by van Berlo et al. reveals that higher engagement in advergame mechanics is linked to lower effectiveness in persuading players to purchase particular brands and products.", "D": "Although the limited capacity model of motivated mediated message processing developed by Lang suggests otherwise, advergames can succeed as marketing tools, provided that they achieve a balance between game mechanics and the promotion of a brand or product."}, "correct": "A", "rationale": "Choice A is the best answer because it most accurately states the main idea of the text. The text begins by presenting van Berlo et al.’s finding\nthat advergames—video games intended to promote a specific product or service—can be engaging to players but “may not facilitate subsequent\nrecall of product and brand information,” ultimately limiting their effectiveness as advertisements. The text then suggests that Lang’s limited\ncapacity model of motivated mediated message processing, which characterizes cognitive capacity as finite, can explain or account for van\nBerlo et al.’s finding: specifically, players’ attention is “directed foremost toward the advergame’s mechanics” instead of toward the advertising\ninformation. The main idea of the text is therefore that Lang’s model provides a means of explaining van Berlo et al.’s finding.\nChoice B is incorrect because it mischaracterizes the relationship between Lang’s model and van Berlo et al.’s finding. The text presents Lang’s\nmodel as a broad theoretical framework about cognitive capacity that can explain van Berlo et al.’s finding. The text doesn’t indicate that Lang\ndrew conclusions specific to video games that van Berlo et al. then corroborated. Choice C is incorrect because it mischaracterizes the findings\nof the meta-analysis by van Berlo et al. Although Lang’s model suggests that engagement in advergame mechanics occurs at the expense of\nrecalling advertising information, the text doesn’t indicate that van Berlo et al. offered this explanation for their finding. The text merely states\nthat van Berlo et al. found that advergames “can elicit player interest” but “may not facilitate subsequent recall of product and brand information.”\nIn addition, the text doesn’t discuss whether players’ ability to recall advertising content ultimately affects their purchasing behavior. Choice D is\nincorrect. Although the text presents Lang’s model as an explanation of why advergames may not succeed in promoting recall of advertising\ninformation, the text doesn’t suggest that advergames can succeed as marketing tools if they balance mechanics and promotion. The text\ndoesn’t propose a design solution to the limitations of advergames or suggest that these limitations can be overcome."}, {"id": "5eda42a3", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "The following text is from Maggie Pogue Johnson’s 1910 poem “Poet of Our Race.” In this poem, the speaker is addressing Paul Laurence Dunbar, a Black author. Thou, with stroke of mighty pen, Hast told of joy and mirth, And read the hearts and souls of men As cradled from their birth. The language of the flowers, Thou hast read them all, And e’en the little brook Responded to thy call. Which choice best states the main purpose of the text?", "choices": {"A": "To praise a certain writer for being especially perceptive regarding people and nature", "B": "To establish that a certain writer has read extensively about a variety of topics", "C": "To call attention to a certain writer’s careful and elaborately detailed writing process", "D": "To recount fond memories of an afternoon spent in nature with a certain writer"}, "correct": "A", "rationale": "Choice A is the best answer because it most accurately states the main purpose of the text. In the first part of the text, the speaker addresses\nPaul Laurence Dunbar’s ability to understand people (he has “read the hearts and souls of men” and written of their “joy and mirth”). In the\nsecond part of the text, the speaker describes Dunbar’s thorough understanding of the natural world (he has read “the language of the flowers”\nand engaged with “the little brook”). Thus, the text mainly praises Dunbar for being especially perceptive about people and nature.\nChoice B is incorrect because the speaker describes Dunbar as having read the “hearts and souls of men” and the “language of flowers” to\nconvey Dunbar’s ability to comprehend people and nature, not to suggest that Dunbar has literally read any of these things or has read a great\ndeal about them. Choice C is incorrect because the text notes how well Dunbar has made sense of the topics he’s written about but doesn’t\naddress any specific parts of Dunbar’s writing process beyond the suggestion that he used a pen. Choice D is incorrect because the text focuses\non Dunbar’s understanding of people and nature as expressed in his writing. Nothing in the text suggests that the speaker is recalling a particular\nafternoon actually spent in nature with Dunbar; even if there had been a shared experience, the text isn’t focused on reminiscing."}, {"id": "010fa3f0", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Simulated Change in Annual Aquifer Input and Irrigation Output if Precipitation Concentration Increases as Climate Models Predict Baseline concentration of annual % change in water entering % change in surface water used % change in groundwater used for precipitation aquifers for irrigation irrigation Precipitation is currently somewhat 4.9 0.4 0.9 concentrated Precipitation is currently evenly 11.0 9.0 7.9 distributed Some climate models for the western United States predict that while total annual precipitation may remain unchanged from the present level, precipitation will become concentrated into fewer but more intense rain and snow events. University of Texas climate scientist Geeta Persad and her colleagues simulated how the amount of water entering aquifers and the amount being used for irrigation purposes would change if this were to occur. Persad and her colleagues concluded that concentration of precipitation into fewer events would result in a higher number of dry days, triggering more irrigation, but that this change in irrigation output is highly sensitive to the baseline concentration of precipitation that currently exists in an area. Which choice best describes data from the table that support Persad and her colleagues’ conclusion?", "choices": {"A": "If baseline precipitation is somewhat concentrated, the amount of water being used for irrigation will increase 0.4% for surface water and 0.9% for groundwater, whereas the amount of water entering aquifers will increase 11.0% if baseline precipitation is evenly distributed.", "B": "If baseline precipitation is somewhat concentrated, water use for irrigation will increase only slightly, whereas it will increase 9.0% for surface water and 7.9% for groundwater if baseline precipitation is evenly distributed.", "C": "If baseline precipitation is somewhat concentrated, the amount of water entering aquifers will increase 4.9%, while the amount being used for irrigation will increase 0.4% for surface water and 0.9% for groundwater.", "D": "If baseline precipitation is somewhat concentrated, water use for irrigation will decline by a small amount, whereas it will increase 11.0% for surface water and 9.0% for groundwater if baseline precipitation is evenly distributed."}, "correct": "B", "rationale": "Choice B is the best answer because it describes data from the table that support Persad and her colleagues’ conclusion. The text explains that,\naccording to some climate models, precipitation in the western United States will become concentrated into fewer, more intense rain and snow\nevents. According to the text, Persad and her colleagues concluded that more irrigation will consequently be needed but that the change in\nirrigation output will be highly sensitive to, or greatly affected by, the baseline concentration of precipitation in an area. This conclusion is\nsupported by data from the researchers’ simulations of changes in annual irrigation output in two different scenarios—one in which an area’s\nannual precipitation is already somewhat concentrated and one in which its annual precipitation is evenly distributed. The table shows that if\nbaseline precipitation is somewhat concentrated, water use for irrigation will increase only slightly, whereas if baseline precipitation is evenly\ndistributed, water use for irrigation will increase much more—9.0% for surface water and 7.9% for groundwater. This difference illustrates the\nresearchers’ conclusion that the amount of additional water needed for irrigation will vary greatly depending on how concentrated or spread out\nthe annual precipitation in an area already is.\n\nChoice A is incorrect because it compares changes in the amount of water being used for irrigation to changes in the amount of water entering\naquifers. Persad and her colleagues’ conclusion doesn’t focus on changes to the amount of water entering aquifers; rather, the researchers’\nconclusion focuses on changes to irrigation output relative to how concentrated or spread out the annual precipitation in an area is. Choice C is\nincorrect because it supports only part of Persad and her colleagues’ conclusion. According to the text, the researchers concluded that the\nconcentration of precipitation into fewer events will trigger more irrigation but that this change in irrigation output will be highly sensitive to an\narea’s baseline concentration of annual precipitation. The data in this choice support the idea that more irrigation will be needed, but to support\nthe rest of the researchers’ conclusion, additional data from the table are required to show that the increases in water use for irrigation will vary\ndepending on how concentrated or spread out the annual precipitation in an area already is. Choice D is incorrect because data in the table\nindicate no declines in water use for irrigation, showing only increases in the form of positive values."}, {"id": "251e5281", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "Studies of ocean wave breaking have predominantly focused on traveling waves (those propagating along the horizontal plane), so Mark McAllister et al. utilized a circular wave tank to produce and study spike waves, axisymmetric standing waves that can erupt vertically when traveling waves propagating in opposing directions intersect. Traveling waves break when wave steepness (height-to-length ratio) passes a critical threshold; breaking thus constrains wave height. McAllister et al. found that spike waves can exceed that constraint, as other factors than just steepness (e.g., jet stability and cavity shape) mediate spike-wave breaking. Which choice best states the main idea of the text?", "choices": {"A": "Previous studies have suggested that steepness mediates breaking in traveling waves, but the study by McAllister et al. shows that jet stability and cavity shape may also influence breaking in such waves.", "B": "The process of breaking limits the height of traveling waves, but the study by McAllister et al. suggests that spike waves can exceed those limits if their height-to-length ratio reaches a critical threshold.", "C": "McAllister et al. suggest that spike waves can form when traveling waves propagating in opposing directions intersect and that spike waves tend to be higher than traveling waves.", "D": "The study by McAllister et al. suggests that when traveling waves intersect in specific ways, the resulting wave may be higher than would be expected based on the properties of traveling waves."}, "correct": "D", "rationale": "Choice D is the best answer because it most accurately states the main idea of the text. The text begins by explaining that most studies of ocean\nwave breaking have focused on traveling waves (those that move horizontally) but that McAllister et al. studied spike waves, which form when\ntraveling waves moving in opposing directions intersect. The text establishes that while traveling waves break when their steepness exceeds a\ncritical threshold (limiting their height), McAllister et al. found that spike waves can exceed these constraints because factors like jet stability and\ncavity shape can mitigate the effects of steepness. Thus, the main idea of the text is that spike waves resulting from traveling waves intersecting\nin specific ways can reach heights greater than what would be expected based on the general properties of traveling waves.\nChoice A is incorrect because it misrepresents the information in the text; the text indicates that McAllister et al. showed that jet stability and\ncavity shape (along with steepness) influence breaking in spike waves, not in traveling waves. Further, the information about specific influences\nis not the main focus of the text. Choice B is incorrect because it misrepresents the information in the text; the text indicates that McAllister et al.\nfound that spike waves can pass the steepness threshold at which traveling waves break because factors like jet stability and cavity shape affect\nthe breaking of spike waves, not because they’ve simply reached a critical threshold of steepness. Choice C is incorrect. Although the text does\nexplain that spike waves can form when traveling waves intersect, it presents this as a known fact that McAllister et al.’s study was based on, not\nas something the researchers suggested. Further, the text indicates that spike waves can exceed a threshold that limits traveling wave height but\ndoesn’t focus on the idea that spike waves typically are higher than traveling waves."}, {"id": "4f9f8ea6", "skill": "Inferences", "difficulty": "Hard", "question": "Birds of many species ingest foods containing carotenoids, pigmented molecules that are converted into feather coloration. Coloration tends to be especially saturated in male birds’ feathers, and because carotenoids also confer health benefits, the deeply saturated colors generally serve to communicate what is known as an honest signal of a bird’s overall fitness to potential mates. However, ornithologist Allison J. Shultz and others have found that males in several species of the tanager genus Ramphocelus use microstructures in their feathers to manipulate light, creating the appearance of deeper saturation without the birds necessarily having to maintain a carotenoid-rich diet. These findings suggest that _____ Which choice most logically completes the text?", "choices": {"A": "individual male tanagers can engage in honest signaling without relying on carotenoid consumption.", "B": "feather microstructures may be less effective than deeply saturated feathers for signaling overall fitness.", "C": "scientists have yet to determine why tanagers have a preference for mates with colorful appearances.", "D": "a male tanager’s appearance may function as a dishonest signal of the individual’s overall fitness."}, "correct": "D", "rationale": "Choice D is the best answer because it most logically completes the text’s discussion of Shultz’s finding about male tanagers. The text explains\nthat because carotenoids both contribute to deeply saturated feathers and offer health benefits, having deeply saturated feathers is usually “an\nhonest signal” (a true indication) that a bird is generally fit. However, Shultz and others have found that certain male tanagers can appear to have\ndeeply saturated feathers even if they haven’t consumed a diet rich in carotenoids, thanks to microstructures in their feathers that manipulate\nlight. If those birds aren’t necessarily eating carotenoid-rich diets, they may actually be less fit than other birds that appear to have similarly\nsaturated feathers; this suggests that a male tanager’s appearance may function as a dishonest signal, or a false indication, of the bird’s overall\nfitness.\nChoice A is incorrect because Shultz’s finding suggests that some tanagers can signal fitness without consuming the carotenoids that\ncontribute to fitness, thereby making those signals dishonest, not that tanagers can give honest signals of their fitness without consuming\ncarotenoids. Choice B is incorrect because Shultz’s finding suggests that the microstructures in certain tanagers’ feathers can give a dishonest\nsignal of fitness, not that the microstructures are less effective than actual pigmentation for signaling fitness. Whether the signal of fitness is\nhonest or dishonest has no bearing on how effective the signal is: a signal is effective if potential mates behave as though it’s true, regardless of\nwhether it’s actually true. Since there’s no information in the text about how potential mates respond to the dishonest signals of some tanagers,\nthere’s no support for the idea that the dishonest signals are less effective than the honest signals. Choice C is incorrect because Shultz’s finding\nsuggests that certain male tanagers may appear to be fitter than they actually are, not that scientists haven’t determined why tanagers prefer\nmates with colorful appearances."}, {"id": "2c06139b", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Tadpole Body Mass and Toxin Production after Three Weeks in Ponds Average number of distinct Average amount of Average bufadienolide concentration Population Average tadpole body bufadienolide toxins per bufadienolide per tadpole (nanograms per milligram of tadpole density mass (milligrams) tadpole (nanograms) body mass) High 193.87 22.69 5,815.51 374.22 Medium 254.56 21.65 5,525.72 230.10 Low 258.97 22.08 4,664.99 171.43 Ecologist Veronika Bókony and colleagues investigated within-species competition among common toads (Bufo bufo), a species that secretes various unpleasant-tasting toxins called bufadienolides in response to threats. The researchers tested B. bufo tadpoles’ responses to different levels of competition by creating ponds with different tadpole population densities but a fixed amount of food. Based on analysis of the tadpoles after three weeks, the researchers concluded that increased competition drove bufadienolide production at the expense of growth. Which choice uses data from the table to most effectively support the researchers’ conclusion?", "choices": {"A": "The difference in average tadpole body mass was small between the low and medium population density conditions and substantially larger between the low and high population density conditions.", "B": "Tadpoles in the low and medium population density conditions had substantially lower average bufadienolide concentrations but had greater average body masses than those in the high population density condition.", "C": "Tadpoles in the high population density condition displayed a relatively modest increase in the average amount of bufadienolide but roughly double the average bufadienolide concentration compared to those in the low population density condition.", "D": "Tadpoles produced approximately the same number of different bufadienolide toxins per individual across the population density conditions, but average tadpole body mass decreased as population density increased."}, "correct": "B", "rationale": "Choice B is the best answer. This data shows that the tadpoles in the high-density pond (meaning those with the most competition) didn’t grow\nas big as the other two groups but produced more bufadienolide.\nChoice A is incorrect. This doesn’t fully support the conclusion. It doesn’t include any data about bufadienolide production. Choice C is incorrect.\nThis doesn’t fully support the conclusion. It doesn’t include any data about growth. Choice D is incorrect. This doesn’t fully support the\nconclusion. It doesn’t demonstrate that the tadpoles in the high-density pond produced more bufadienolide overall. The fact that they didn’t\nproduce more kinds of bufadienolide isn’t relevant to the conclusion."}, {"id": "01c1d9ee", "skill": "Command of Evidence", "difficulty": "Hard", "question": "Swahili Speakers in Three African Countries Country Approximate number of speakers (in millions) Estimated % of population Democratic Republic of the Congo 22 25 Kenya 55 100 Tanzania 61 100 Swahili is estimated to be the first language of up to 15 million people worldwide. It’s also an officially recognized language in Tanzania, Kenya, and the Democratic Republic of the Congo, which means these countries use Swahili in government documents and proceedings. But even in countries where almost everyone speaks Swahili, for many it isn’t their first language but is instead their second, third, or even fourth language. Which choice most effectively uses data from the table to support the underlined claim?", "choices": {"A": "Tanzania has approximately 61 million Swahili speakers, which is much more than the estimated total number of people worldwide for whom Swahili is their first language.", "B": "Tanzania is estimated to have at most 15 million Swahili speakers, while the country’s total population is approximately 61 million people.", "C": "Approximately 100 percent of the people who speak Swahili as their first language live in Kenya, which has a total population of approximately 55 million people.", "D": "Approximately 100 percent of Kenya’s population speaks Swahili, while only about 25 percent of the Democratic Republic of the Congo’s population speaks Swahili."}, "correct": "A", "rationale": "Choice A is the best answer because it most effectively uses data from the table to support the underlined claim. The text indicates that Swahili\nis the first language of up to 15 million people worldwide. The text goes on to claim, in the underlined portion, that even in countries where nearly\neveryone speaks Swahili, many of the language’s speakers don’t have Swahili as their first language. The table indicates that 61 million people in\nTanzania, which amounts to 100 percent of the population, speak Swahili. If 61 million people in Tanzania speak Swahili, but only 15 million\npeople worldwide have Swahili as their first language, that means there are many people in Tanzania who speak Swahili as a language other than\ntheir first language. This information about Swahili speakers in Tanzania therefore supports the claim that many Swahili speakers in countries\nwhere nearly everyone speaks Swahili speak it as a language other than their first language (such as their second, third, or fourth language).\nChoice B is incorrect because it doesn’t accurately describe information in the table. According to the table, Tanzania has 61 million Swahili\nspeakers, not at most 15 million Swahili speakers. Additionally, the table indicates that 100 percent of Tanzania’s population speak Swahili, which\nmeans that the number of Swahili speakers in the country and the country’s total population should be the same, not that they should differ by\nsuch a large amount. Choice C is incorrect because there’s no information in the table or the text that indicates where people who speak Swahili\nas their first language live. Although Kenya’s total population can be inferred from the table—if Kenya has 55 million Swahili speakers and 100%\nof Kenya’s population speak Swahili, then Kenya must have a population of 55 million people—nothing suggests that all the people who speak\nSwahili as their first language live in a single country, let alone that they all live in Kenya. Choice D is incorrect. Although the table does indicate\nthat 100 percent of Kenya’s population and 25 percent of the Democratic Republic of the Congo’s population speak Swahili, this comparison is\n\nirrelevant to the claim that Swahili isn’t the first language of many of its speakers even in countries where almost everyone speaks Swahili. On its\nown, a difference in the proportions of the population who speak Swahili cannot reveal whether those Swahili speakers have Swahili as their first\nlanguage or a subsequent language."}, {"id": "b603f00b", "skill": "Inferences", "difficulty": "Hard", "question": "Microbial fuel cells (MFCs) capitalize on the ability of some species of bacteria to oxidize organic matter and transfer electrons extracellularly. The bacteria form a dense biofilm on the surface of an electron-collecting anode, but moving the electrons from the bacterial cytoplasm to an external electrode requires that the electrons pass through a series of inefficient oxidation-reduction (redox) reactions. Accordingly, MFC power 2 output rarely exceeds a density of 0.30 milliwatts per square centimeter (mW/cm ). In an experiment, researchers added silver nanoparticles to 2 carbon paper covering the anode in an MFC. The resulting power density was 0.66 mW/cm . Since metals such as silver exhibit high electrical conductivity, the researchers hypothesized that _____ Which choice most logically completes the text?", "choices": {"A": "silver nanoparticles may allow electrons to bypass the series of redox reactions and transfer directly to the electrode.", "B": "electrons may be conducted directly to the electrode before the silver nanoparticles catalyze the redox reactions.", "C": "silver nanoparticles may increase the metabolic processes of the bacteria, thereby increasing the number of free electrons available to transfer to the electrode.", "D": "as the density of the biofilm increases, the series of redox reactions may accelerate independent of the presence of the silver nanoparticles."}, "correct": "A", "rationale": "Choice A is the best answer because it most logically completes the text’s discussion of microbial fuel cells (MFCs) and the effect of silver\nnanoparticles on power output. The text explains that in MFCs, electrons are transferred from the bacterial cytoplasm to an external electrode\n2\nthrough a series of inefficient redox reactions, which typically prevent power output from exceeding 0.30 mW/cm . When researchers added\n2\nsilver nanoparticles to carbon paper covering the anode, power density more than doubled to 0.66 mW/cm . Critically, the text notes that metals\nsuch as silver exhibit high electrical conductivity. Given that the inefficiency of the redox reactions accounted for the limited power output of\nMFCs and that the addition of a highly conductive material dramatically increased that output, it is reasonable to hypothesize that the silver\nnanoparticles allowed electrons to bypass the redox reactions and transfer directly to the electrode.\nChoice B is incorrect because the researchers’ hypothesis, as set up by the last sentence of the text, is specifically grounded in the high electrical\nconductivity of metals such as silver. Nothing in the text supports the idea that the silver nanoparticles function as catalysts for the redox\nreactions, nor does the text suggest that electrons are being conducted to the electrode independently of any role played by the silver\nnanoparticles. The text points to the conductivity of silver as the explanation for the increased power density, not to any catalytic effect of the\nnanoparticles on the existing redox reactions. Choice C is incorrect because the text never discusses the metabolic processes of the bacteria in\nthe biofilm coating the electron-collecting anodes, nor is there any suggestion that the high conductivity of silver nanoparticles would interact\nwith the bacteria’s metabolism in any way. Choice D is incorrect because the text never suggests that in the experiment, the biofilm on the\nelectron-collecting anodes varied in density. Moreover, the hypothetical statement begun in the last sentence of the text concerns the high\nelectrical conductivity of metals such as silver. Thus, proposing that redox reactions—which, as the text establishes, conduct electricity—\naccelerated independently of a conductive metallic material (the silver nanoparticles) wouldn’t logically complete that hypothesis."}, {"id": "024eb2ec", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "Through adaptive radiation, multiple species of Tetragnatha—a genus of orb-weaving spiders—have significantly diversified their web architecture over a relatively short timescale. To investigate whether the material properties of Tetragnatha silk have been similarly affected by this evolutionary process, Angela M. Alicea-Serrano et al. examined the chemical composition of both the radial (non-sticky threads extending from the center) and capture (sticky threads that hold prey) silks that form the web as well as tested the tensile strength and viscosity of samples collected from three Tetragnatha species at two sites in the Hawaiian archipelago. The team found significant interspecies variation in these biomaterials. Which choice best states the main idea of the text?", "choices": {"A": "Research reveals that web architecture among species of Tetragnatha spiders has likely diversified more rapidly than the material properties of Tetragnatha’s silk have.", "B": "Research suggests that the material properties of silk from species of Tetragnatha spiders have diversified during adaptive radiation.", "C": "A study indicates that variations in web architecture among species of Tetragnatha spiders can likely be explained by corresponding variations in the material properties of their silks.", "D": "A study shows that adaptive radiation can explain interspecies variation in the web architecture of Tetragnatha spiders but not in the material properties of the spiders’ silk."}, "correct": "B", "rationale": "Choice B is the best answer because it most accurately states the main idea of the text. The text notes that Tetragnatha spiders have diversified\ntheir web architecture, or web design, through adaptive radiation and that Alicea-Serrano et al. investigated whether silk material properties were\nalso affected by this process. After examining chemical composition, tensile strength, and viscosity of silks from three Tetragnatha species, the\nteam found significant interspecies variation in these material properties, meaning that there were observable differences in these traits across\nthe studied species. In the context of the study’s research question, this finding suggests that the material properties of silk from species of\nTetragnatha spiders have indeed diversified during adaptive radiation, which is the main idea of the text.\nChoice A is incorrect because the text doesn’t compare the rate of diversification in web architecture to the rate of diversification in silk\nproperties. Although the text notes that web architecture diversified “over a relatively short timescale,” it doesn’t make a corresponding temporal\nclaim about silk properties or suggest that one changed more rapidly than the other. Choice C is incorrect because the study investigated silk\nproperties as a separate question, not as an explanation for differences in web architecture. The researchers discussed in the text investigated\nwhether silk properties were “similarly affected” by adaptive radiation, not whether they caused the variations in web design. Choice D is\nincorrect because it contradicts the findings described in the text. The study found “significant interspecies variation” in silk biomaterials,\nsuggesting that adaptive radiation did affect the properties of Tetragnatha spiders’ silk rather than showing that adaptive radiation cannot explain\nsilk variation."}, {"id": "4a5bda7a", "skill": "Central Ideas and Details", "difficulty": "Hard", "question": "In a study of perceptions of listening ability, participants explained their position on a sociopolitical issue and then received a listener’s written summary that expressed agreement or disagreement. Within selected summaries, researchers embedded markers of attentive listening (e.g., references to specific details), hypothesizing that such indications would positively influence perceptions of listening skill even in the context of disagreement. Instead, participants consistently rated listeners who expressed disagreement as less skilled, regardless of the other traits of the listeners’ summaries. What does the text most strongly imply about how participants responded to expressions of disagreement?", "choices": {"A": "When participants felt personally invested in the topics they discussed, they were less likely to perceive listeners who expressed disagreement as attentive, regardless of evidence to the contrary in these listeners’ summaries.", "B": "When participants encountered summaries from listeners who expressed disagreement with their views, participants tended to disregard evidence that the listeners had in fact been attentive.", "C": "Although participants maintained their positions regardless of a summary’s level of detail, they tended to regard listeners who expressed disagreement as more attentive when these listeners provided more detailed summaries.", "D": "Although participants were critical of expressions of disagreement, they gave higher ratings to listeners whose summaries included markers of attentiveness than to listeners whose summaries did not include these markers."}, "correct": "B", "rationale": "Choice B is the best answer because it most accurately describes what the text implies about participants’ responses to disagreement. The text\ndescribes a study in which participants were asked to explain their position on an issue to a listener, who then provided a written summary of\nthat position that also expressed their level of agreement. The participants were then asked, based on these summaries, to rate listeners’\nlistening skill. The text indicates that researchers embedded markers of attentive listening, such as references to details, in some of the\nsummaries, expecting that these markers would improve the participants’ perceptions of listening skill even when the listeners disagreed.\nInstead, participants rated disagreeing listeners as less skilled, or attentive, “regardless of the other traits of the listeners’ summaries.” This\nmeans that even when summaries contained evidence of attentive listening, participants still judged disagreeing listeners as less skilled—in\neffect, disregarding evidence that those listeners had been attentive.\nChoice A is incorrect. Although the text does suggest that participants tended to disregard evidence of attentiveness when listeners disagreed\nwith their position on the topic they discussed, it doesn’t address participants’ level of personal investment in these topics; therefore, the text\ncan’t support any conclusions about how personal investment in a topic affected participants’ perceptions of the listening skill of disagreeing\nlisteners. Choice C is incorrect because it directly contradicts the text. The text states that participants rated disagreeing listeners as less skilled\nregardless of the other traits of the listeners’ summaries, which means markers of attentiveness (specific details) didn’t lead participants to\nregard disagreeing listeners as more attentive. Instead, disagreement alone determined the participants’ lower ratings. Moreover, the text doesn’t\naddress whether participants maintained their positions based on the listeners’ summaries. The text focuses on factors affecting participants’\nperceptions of listeners’ attentiveness, not on how features of listeners’ summaries influenced the participants’ views of the sociopolitical issue\nthey discussed. Choice D is incorrect because the text indicates the opposite: participants didn’t give higher ratings to disagreeing listeners\nwhose summaries included markers of attentiveness than to disagreeing listeners whose summaries didn’t include these markers. Rather, the\ntext states that participants rated disagreeing listeners as less skilled than agreeing listeners regardless of the other traits of the summaries,\nmeaning attentiveness markers had no positive effect when listeners’ summaries expressed disagreement."}, {"id": "f2250478", "skill": "Inferences", "difficulty": "Hard", "question": "Among social animals that care for their young, such as chickens, macaque monkeys, and humans, newborns appear to show an innate attraction to faces and face-like stimuli. Elisabetta Versace and her colleagues used an image of three black dots arranged in the shape of eyes and a nose or mouth to test whether this trait also occurs in Testudo tortoises, which live alone and do not engage in parental care. They found that tortoise hatchlings showed a significant preference for the image, suggesting that _____ Which choice most logically completes the text?", "choices": {"A": "face-like stimuli are likely perceived as harmless by newborns of social species that practice parental care but as threatening by newborns of solitary species without parental care.", "B": "researchers should not assume that an innate attraction to face-like stimuli is necessarily an adaptation related to social interaction or parental care.", "C": "researchers can assume that the attraction to face-like stimuli that is seen in social species that practice parental care is learned rather than innate.", "D": "newly hatched Testudo tortoises show a stronger preference for face-like stimuli than adult Testudo tortoises do."}, "correct": "B", "rationale": "Choice B is the best answer because it presents the conclusion that most logically follows from the text’s discussion of the study by Versace and\ncolleagues. The text indicates that newborn animals of some species are attracted to faces and to stimuli that resemble faces. These species,\nthe text says, share two characteristics: they’re social and they practice parental care, meaning that parents care for their young. The text goes\non to describe Versace and colleagues’ experiment, which showed that Testudo tortoises, which aren’t social and don’t practice parental care,\nwere attracted to a stimulus that resembles a face. Since Versace and colleagues have shown that a species that isn’t social and doesn’t\npractice parental care nevertheless has the innate characteristic of being attracted to face-like stimuli, it follows that this characteristic shouldn’t\nbe assumed to be an adaptation related to social interaction or parental care.\nChoice A is incorrect because the text indicates that the tortoise hatchlings, which are solitary and don’t practice parental care, were attracted to\nthe face-like stimuli, not that they perceived the stimuli as threatening. Choice C is incorrect because the phenomenon discussed in the text is an\nattraction to faces and face-like stimuli on the part of newborn animals, which can’t show any learned characteristics since they were just born.\nAdditionally, the text tells us that the tortoises Versace and colleagues studied aren’t social and don’t practice parental care, so any findings\nabout those tortoises wouldn’t be relevant to the question of whether an attraction to faces in social species that practice parental care is innate\nor learned. Choice D is incorrect because the text gives no indication that adult tortoises were tested on face-like stimuli and, if adults were in\nfact tested, no information about how they responded is provided. Since no information about adult tortoises’ responses is provided, no\nconclusion comparing those responses to the responses of newly hatched tortoises can be supported."}, {"id": "6e0e0de1", "skill": "Inferences", "difficulty": "Hard", "question": "Aerogels are highly porous foams consisting mainly of tiny air pockets within a solidified gel. These lightweight materials are often applied to spacecraft and other equipment required to withstand extreme conditions, as they provide excellent insulation despite typically being brittle and eventually fracturing due to degradation from repeated exposure to high heat. Now, Xiangfeng Duan of the University of California, Los Angeles, and colleagues have developed an aerogel with uniquely flexible properties. Unlike earlier aerogels, Duan’s team’s material contracts rather than expands when heated and fully recovers after compressing to just 5% of its original volume, suggesting that _____ Which choice most logically completes the text?", "choices": {"A": "the aerogel’s remarkable flexibility results from its higher proportion of air pockets to solidified gel as compared to other aerogels.", "B": "the aerogel’s overall strength is greater than that of other insulators but its ability to withstand exposure to intense heat is lower.", "C": "the aerogel will be more effective as an insulator for uses that involve gradual temperature shifts than for those that involve rapid heat increases.", "D": "the aerogel will be less prone to the structural weakness that ultimately causes most other aerogels to break down with use."}, "correct": "D", "rationale": "Choice D is the best answer because it most logically completes the text’s discussion of aerogels. The text states that aerogels—highly porous\nfoams—offer \"excellent insulation\" but typically break down after prolonged exposure to high heat. However, according to the text, Duan and\ncolleagues developed an aerogel that \"contracts rather than expands when heated\" and recovers its original volume after this contraction. Thus,\nit is logical to conclude that Duan’s team’s aerogel material will be less prone to the structural weakness that caused earlier aerogels to break\ndown.\nChoice A is incorrect. Although the text indicates that aerogels consist \"mainly of tiny air pockets within a solidified gel,\" it doesn’t mention the\nnumber or proportion of air pockets to solidified gel in typical aerogels or in the aerogel developed by Duan’s team. Choice B is incorrect because\nthe text suggests that the aerogel developed by Duan’s team has a higher, not a lower, ability to withstand exposure to intense heat due to its\ncontraction and subsequent recovery. Choice C is incorrect. Although the text discusses temperature tolerances of aerogels and says that they\noffer \"excellent insulation despite typically being brittle and eventually fracturing,\" it doesn’t discuss how different rates of temperature change\ncan affect aerogels."}, {"id": "3430be35", "skill": "Command of Evidence", "difficulty": "Hard", "question": "80 70 60 50 40 30 20 10 0 )$( ecirp nesohc naeM Mean Ticket Prices Chosen in Two Studies of Participative Pricing Messaging 1 2 Study pay what you can pay what you think it’s worth pay what you want Participative pricing, in which purchasers choose the prices they pay for products, can enable sellers to capitalize on the heterogeneous values consumers assign to the same goods and services, but doing so requires careful messaging. Annie Peng Cui and Jennifer Wiggins recruited 171 participants (ages 18–60) online for an initial study and 83 students (ages 18–31) at a state university for a second study to test the effect of three different messages—“pay what you can,” “pay what you think it’s worth,” and “pay what you want”—on how much participants would pay for concert tickets. Their results illustrate both the heterogeneity of consumer valuations and how sellers can benefit by prompting consumers to consider their own valuations: _____ Which choice most effectively uses data from the graph to complete the text?", "choices": {"A": "the students tended to value the concert tickets more highly than did the more age-diverse group recruited online, but when considering what they could afford to pay, the students tended to choose a lower price than did the other group.", "B": "in all three messaging conditions, the group of participants recruited online tended to choose lower prices than did the students, but both groups tended to choose prices closest to the actual cost of the tickets when prompted to consider the tickets’ value.", "C": "the students tended to value the concert tickets more highly than did the more age-diverse group recruited online, but both groups tended to choose a higher price when considering the value of the tickets than when considering what they could afford or wanted to pay.", "D": "within each group of participants, there was wide variation in the value that individuals assigned to the concert tickets, but the students tended to assign a higher value to the tickets than did the more age-diverse group recruited online."}, "correct": "C", "rationale": "Choice C is the best answer because it most effectively uses data from the graph to complete the text about the effect of messaging on\nparticipative pricing. The graph shows mean ticket prices chosen by participants in response to three messages across two studies: Study 1,\nwhich the text indicates was conducted with an age-diverse group recruited online, and Study 2, which was conducted with student participants.\nThe graph indicates that in the \"pay what you think it’s worth\" condition, the mean price of the concert tickets in Study 2 was about $74, which is\ngreater than the mean price of about $55 in Study 1. In other words, when participants were asked to consider their valuation of the tickets, the\nresponse was heterogeneous, or mixed. Moreover, according to the graph, both Study 1 and Study 2 show higher pric
