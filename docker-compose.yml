services:
  studio:
    build: .
    ports: ["8000:8000"]
    environment:
      SPYRATH_AUTH_ENABLED: "${SPYRATH_AUTH_ENABLED:-1}"
      SPYRATH_REQUIRE_GPU: "${SPYRATH_REQUIRE_GPU:-1}"
      SPYRATH_BOOTSTRAP_API_KEY: "${SPYRATH_BOOTSTRAP_API_KEY:-}"
      SPYRATH_USAGE_DB: "/data/usage.db"
    volumes:
      - spyrath-data:/data
volumes:
  spyrath-data:
