[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spyrath-studio"
version = "1.0.0b1"
description = "Reliability-first orchestration for long-form AI presenter production."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sarath Vaddi"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
chatterbox = ["chatterbox-tts>=0.1.7"]
studio = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
include = ["spyrath*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
